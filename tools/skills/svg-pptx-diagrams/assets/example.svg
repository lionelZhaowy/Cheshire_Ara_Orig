<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <title>科研数据处理结构示例</title>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff" stroke="none"/>
  <text x="45" y="68" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#183044">数据处理与反馈：可编辑矢量示例</text>
  <rect x="60" y="190" width="250" height="180" rx="16" fill="#e8f2fe" stroke="#7faad1" stroke-width="2"/>
  <text x="185" y="264" text-anchor="middle" font-family="Microsoft YaHei" font-size="26" fill="#183044">输入数据</text>
  <text x="185" y="306" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" fill="#50667a">Input</text>
  <rect x="475" y="190" width="250" height="180" rx="16" fill="#e8f4ed" stroke="#8cbd9f" stroke-width="2"/>
  <text x="600" y="264" text-anchor="middle" font-family="Microsoft YaHei" font-size="26" fill="#183044">处理模块</text>
  <text x="600" y="306" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" fill="#50667a">Process</text>
  <circle cx="1015" cy="280" r="90" fill="#fff2e5" stroke="#d9b48e" stroke-width="2"/>
  <text x="1015" y="280" text-anchor="middle" font-family="Microsoft YaHei" font-size="26" fill="#183044">输出结果</text>
  <line x1="310" y1="280" x2="463" y2="280" stroke="#526b80" stroke-width="2"/>
  <polygon points="475,280 461,273 461,287" fill="#526b80" stroke="none"/>
  <line x1="725" y1="280" x2="913" y2="280" stroke="#526b80" stroke-width="2"/>
  <polygon points="925,280 911,273 911,287" fill="#526b80" stroke="none"/>
  <path d="M 1015 370 C 1015 525 185 525 185 382" fill="none" stroke="#2774c7" stroke-width="3"/>
  <polygon points="185,370 179,384 191,384" fill="#2774c7" stroke="none"/>
  <text x="600" y="540" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" fill="#2774c7">反馈路径 / Feedback</text>
  <ellipse cx="90" cy="603" rx="25" ry="13" fill="#e8f2fe" stroke="#7faad1" stroke-width="2"/>
  <text x="135" y="610" font-family="Microsoft YaHei" font-size="18" fill="#50667a">文字、圆角框、椭圆、曲线与箭头均为独立对象。</text>
</svg>
