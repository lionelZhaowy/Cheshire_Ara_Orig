  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-020">通用原理图；地址位分配、bank 策略、队列容量与训练寄存器由实际供应商确定。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-021">当前源码结构 / 教学示意；非运行证据</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-022">依据：DDR 控制器/PHY 通用职责；不表示固定周期，也不代表已完成 DDR 验证</text>
