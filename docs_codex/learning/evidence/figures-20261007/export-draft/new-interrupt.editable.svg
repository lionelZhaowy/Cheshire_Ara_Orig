  <rect fill="#216BB1" stroke="#216BB1" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="55" y="855" width="5" height="150" rx="0.0" ry="0.0" id="rect-040" />
