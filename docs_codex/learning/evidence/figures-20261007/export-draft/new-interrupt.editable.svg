  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="338" data-box="dev" id="text-021">保持 IRQ 直到按协议清源</text>
