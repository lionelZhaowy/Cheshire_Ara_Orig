  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-016">源码：PLIC / CLINT 接入；CPU 中断门控；现有驱动与 trap handler</text>
