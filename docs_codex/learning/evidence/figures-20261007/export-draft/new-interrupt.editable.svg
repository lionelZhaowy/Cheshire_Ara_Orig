  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="953" data-box="note-4" id="text-043">设备电平仍有效时，后续可能再次 pending</text>
  <rect fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-044" x="950" y="855" width="795" height="150" rx="7.0" ry="7.0" />
  <rect fill="#7555A3" stroke="#7555A3" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="950" y="855" width="5" height="150" rx="0.0" ry="0.0" id="rect-045" />
  <text fill="#7555A3" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="967" y="887" data-box="note-5" id="text-046">CLINT：独立的计时器入口</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="967" y="923" data-box="note-5" id="text-047">mtime ≥ mtimecmp → MTIP → CPU 定时器中断</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="967" y="953" data-box="note-5" id="text-048">处理后将比较值推迟到下一次到期时间</text>
