  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="400" y="650" id="text-038">处理并清设备源，再 complete；避免中断立即重入</text>
