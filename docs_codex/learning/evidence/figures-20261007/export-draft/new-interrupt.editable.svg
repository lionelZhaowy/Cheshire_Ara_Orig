  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-014">PLIC 外部中断与 CLINT 定时器走不同入口；complete 不自动清除设备事件。</text>
