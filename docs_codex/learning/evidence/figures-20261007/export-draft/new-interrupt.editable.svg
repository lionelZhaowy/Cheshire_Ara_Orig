  <text fill="#7555A3" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1372" y="272" data-box="cpu" id="text-029">CPU CSR 门控</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="1372" y="308" data-box="cpu" id="text-030">mie / mstatus / mcause</text>
