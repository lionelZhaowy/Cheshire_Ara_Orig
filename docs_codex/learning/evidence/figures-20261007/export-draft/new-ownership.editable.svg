  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-014">当前源码结构 / 教学示意；非运行证据</text>
