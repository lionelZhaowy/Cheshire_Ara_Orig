  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="968" data-box="note-4" id="text-052">W1C、读弹出 FIFO、忙时写入、GPIO 电平都需要各自的寄存器契约；寄存器地址正确只是访问的第一步。</text>
