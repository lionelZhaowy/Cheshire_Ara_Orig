  <text fill="#19364B" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" font-style="normal" text-anchor="start" x="68" y="77" id="text-013">一次 UART 寄存器访问：地址、寄存器副作用与引脚</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-014">同一地址访问谁由译码决定；写入产生什么动作由寄存器语义、访问宽度与设备状态决定。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-015">当前源码结构 / 教学示意；非运行证据</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-016">源码：UART DIF / HAL；AXI→Reg / APB 适配；UART 寄存器实现</text>
