  <rect fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-035" x="1415" y="240" width="330" height="190" rx="7.0" ry="7.0" />
