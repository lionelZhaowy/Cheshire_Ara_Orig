  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="977" y="308" data-box="fifo" id="text-032">DLAB 选择寄存器用途</text>
