  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="73" y="610" id="text-041">同时观察控制寄存器与外部波形</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="90" y="650" id="text-042">LSR / FIFO 状态</text>
  <text fill="#7555A3" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="660" y="650" id="text-043">UART TX</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="90" y="680" id="text-044">可继续写入？FIFO 空？移位器也已空？</text>
