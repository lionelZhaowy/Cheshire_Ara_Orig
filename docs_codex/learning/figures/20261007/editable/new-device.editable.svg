  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="522" y="308" data-box="bridge" id="text-026">地址译码</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="522" y="338" data-box="bridge" id="text-027">byte lane / 字节使能</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="522" y="368" data-box="bridge" id="text-028">握手与错误响应</text>
