  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="72" y="272" data-box="cpu" id="text-019">CPU / 驱动</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="308" data-box="cpu" id="text-020">volatile + 正确访问宽度</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="338" data-box="cpu" id="text-021">读取 LSR 检查发送条件</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="368" data-box="cpu" id="text-022">写 THR 提交一个字符</text>
