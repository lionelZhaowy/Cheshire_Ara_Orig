  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-012">当前 RTL 的功能边界与未来 SRAM / PLL / PAD / DDR 实现分层；不预设供应商或最终工艺。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-013">未来方案 / 待实现与验证</text>
