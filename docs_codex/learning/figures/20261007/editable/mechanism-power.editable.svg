  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="117" y="398" data-box="state" id="text-021">普通寄存器掉电后丢失</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="117" y="428" data-box="state" id="text-022">done 输出 / 任务内部状态</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="117" y="458" data-box="state" id="text-023">电源撤除前先完成事务</text>
  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="733" y="250" id="text-024">常开控制与隔离供电边界</text>
