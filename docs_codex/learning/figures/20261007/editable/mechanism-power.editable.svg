  <text fill="#19364B" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" font-style="normal" text-anchor="start" x="68" y="77" id="text-013">关电域与常开域：隔离、保持、电平转换各有职责</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-014">示例 done 为有效高，接收协议允许隔离时钳为 0；实际钳位值按接口协议决定。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-015">未来方案 / 待实现与验证</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-016">依据：ASIC 低功耗通用机制；需工艺库、UPF 与平台协议支持</text>
  <text fill="#7555A3" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="78" y="250" id="text-017">可关断设备域</text>
