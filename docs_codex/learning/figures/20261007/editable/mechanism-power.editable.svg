  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="77" y="847" data-box="note-4" id="text-043">关断顺序（需 IP 规范确认）</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="77" y="883" data-box="note-4" id="text-044">停发并排空 → 保存必要状态 → 隔离</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="77" y="913" data-box="note-4" id="text-045">按平台顺序关时钟 / 电源；处理异常在途事务</text>
  <rect fill="#EAF6F3" stroke="#087E83" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-046" x="935" y="815" width="815" height="160" rx="7.0" ry="7.0" />
  <rect fill="#087E83" stroke="#087E83" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="935" y="815" width="5" height="160" rx="0.0" ry="0.0" id="rect-047" />
