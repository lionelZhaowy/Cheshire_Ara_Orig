  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="767" y="398" data-box="isolation" id="text-028">隔离有效：done_out = 0</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="767" y="428" data-box="isolation" id="text-029">隔离解除：透传 done</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" font-style="normal" text-anchor="start" x="767" y="458" data-box="isolation" id="text-030">钳低不能撤销已接受 AXI</text>
