  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="952" y="883" data-box="note-5" id="text-049">供电 / 时钟稳定 → 复位 → 恢复 / 重建 → 就绪 → 解除隔离</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="952" y="913" data-box="note-5" id="text-050">电平转换负责电压兼容；保持负责状态，均不替代隔离</text>
