  <rect fill="#087E83" stroke="#087E83" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="1330" y="315" width="5" height="135" rx="0.0" ry="0.0" id="rect-037" />
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1347" y="347" data-box="i3" id="text-038">读址 + 16 字节</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="1347" y="383" data-box="i3" id="text-039">接收并检查数据</text>
  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="73" y="645" id="text-040">SPI NOR：控制器主动驱动 SCK；一次 CS1 有效覆盖命令、地址和读数据</text>
