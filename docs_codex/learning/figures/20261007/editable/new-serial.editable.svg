  <text fill="#19364B" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" font-style="normal" text-anchor="start" x="68" y="77" id="text-019">I2C EEPROM 与 SPI NOR：控制器动作映射到器件协议</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-020">固定读 16 字节；下图表示协议阶段与片选边界，不表示按比例绘制的电气时序。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-021">当前源码结构 / 教学示意；非运行证据</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-022">依据：本地 EEPROM HAL 的 STOP/START 流程；SPI NOR 0x13 读命令；VIP 预填值 0x9a</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="73" y="245" id="text-023">I2C：SDA / SCL 开漏，需要器件地址和内部地址</text>
  <rect fill="#EAF6F3" stroke="#087E83" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-024" x="85" y="315" width="355" height="135" rx="7.0" ry="7.0" />
  <rect fill="#087E83" stroke="#087E83" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="85" y="315" width="5" height="135" rx="0.0" ry="0.0" id="rect-025" />
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="102" y="347" data-box="i0" id="text-026">START + 写址</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="383" data-box="i0" id="text-027">选择 EEPROM</text>
  <rect fill="#EAF6F3" stroke="#087E83" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-028" x="500" y="315" width="355" height="135" rx="7.0" ry="7.0" />
  <rect fill="#087E83" stroke="#087E83" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="500" y="315" width="5" height="135" rx="0.0" ry="0.0" id="rect-029" />
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="517" y="347" data-box="i1" id="text-030">16 位内部地址</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="517" y="383" data-box="i1" id="text-031">设定器件读指针</text>
