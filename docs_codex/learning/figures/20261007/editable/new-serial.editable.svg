  <rect fill="#087E83" stroke="#087E83" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="915" y="315" width="5" height="135" rx="0.0" ry="0.0" id="rect-033" />
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="932" y="347" data-box="i2" id="text-034">STOP；新 START</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="932" y="383" data-box="i2" id="text-035">本地 HAL 行为</text>
