  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="758" data-box="s0" id="text-044">选择 Flash</text>
  <rect fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-045" x="500" y="690" width="355" height="120" rx="7.0" ry="7.0" />
