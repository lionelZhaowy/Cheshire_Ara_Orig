  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="517" y="722" data-box="s1" id="text-047">命令 0x13</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="517" y="758" data-box="s1" id="text-048">四字节地址读</text>
  <rect fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-049" x="915" y="690" width="355" height="120" rx="7.0" ry="7.0" />
  <rect fill="#216BB1" stroke="#216BB1" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="915" y="690" width="5" height="120" rx="0.0" ry="0.0" id="rect-050" />
  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="932" y="722" data-box="s2" id="text-051">四字节地址</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="932" y="758" data-box="s2" id="text-052">指定读取起点</text>
