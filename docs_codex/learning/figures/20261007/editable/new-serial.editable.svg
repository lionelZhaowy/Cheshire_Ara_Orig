  <rect fill="#216BB1" stroke="#216BB1" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="1330" y="690" width="5" height="120" rx="0.0" ry="0.0" id="rect-054" />
  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1347" y="722" data-box="s3" id="text-055">RX 16 字节</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="1347" y="758" data-box="s3" id="text-056">检查预期内容</text>
