  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="72" y="947" data-box="note-8" id="text-059">器件协议与平台支持分别验证</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" font-style="normal" text-anchor="start" x="72" y="983" data-box="note-8" id="text-060">EEPROM 当前流程不能标成 repeated START；SD 虽共用 SPI 控制器，但使用不同命令、响应与块校验协议。</text>
