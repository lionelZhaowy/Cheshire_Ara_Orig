  <text fill="#19364B" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" font-style="normal" text-anchor="start" x="68" y="77" id="text-027">JTAG 直接装载：主机与目标两条时间线如何汇合</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="68" y="120" id="text-028">当前保留内部 LLC 的启动基线；VIP 只检查指定配置位，不能由此推断栈和 ROM C 已完成。</text>
  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-029">当前源码结构 / 教学示意；非运行证据</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1108" id="text-030">源码：hw/bootrom；sw/lib/crt0.S；elfloader.cpp；vip_cheshire_soc.sv</text>
  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="73" y="225" id="text-031">主机：构建器 / TB / JTAG VIP</text>
  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="1008" y="225" id="text-032">目标：ROM / 存储 / 应用</text>
