  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1037" y="462" data-box="r1" id="text-050">CPU 进入调试暂停</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="498" data-box="r1" id="text-051">暂停不自动证明 sp 有效</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="528" data-box="r1" id="text-052">核对 PC / sp；SBA 写入段</text>
