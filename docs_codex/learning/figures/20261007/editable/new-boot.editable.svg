  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="102" y="627" data-box="l2" id="text-055">halt → SBA 写装载段</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="663" data-box="l2" id="text-056">目标存储须可写</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="693" data-box="l2" id="text-057">按装载规则处理初值与零区</text>
  <rect fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" id="rect-058" x="1020" y="595" width="695" height="123" rx="7.0" ry="7.0" />
  <rect fill="#216BB1" stroke="#216BB1" stroke-width="1.5" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" x="1020" y="595" width="5" height="123" rx="0.0" ry="0.0" id="rect-059" />
  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1037" y="627" data-box="r2" id="text-060">应用 _start / crt0</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="663" data-box="r2" id="text-061">继承有效栈；gp / BSS / FS</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="693" data-box="r2" id="text-062">向量入口另正确设置 VS</text>
