  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="828" data-box="r3" id="text-071">计算 / MMIO / UART</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="858" data-box="r3" id="text-072">scratch2=(code&lt;&lt;1)|1；crt0 ret</text>
  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="810" y="462" id="text-073">halt</text>
  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="810" y="625" id="text-074">段字节</text>
  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="806" y="760" id="text-075">resume</text>
