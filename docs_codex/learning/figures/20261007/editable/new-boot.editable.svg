  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="333" data-box="l0" id="text-036">构建字节、入口、PT_LOAD</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="363" data-box="l0" id="text-037">map / dump 用于静态核对</text>
