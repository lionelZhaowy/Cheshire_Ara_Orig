  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="828" data-box="l3" id="text-066">resume 后观察 UART / 状态</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="858" data-box="l3" id="text-067">逐项结果与返回码共同判定</text>
