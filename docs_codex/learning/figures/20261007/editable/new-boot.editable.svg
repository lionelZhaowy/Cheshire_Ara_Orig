  <text fill="#B76315" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="102" y="462" data-box="l1" id="text-045">VIP 检查 SPM 配置位</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="498" data-box="l1" id="text-046">CFG_SPM_LOW.bit0</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="102" y="528" data-box="l1" id="text-047">随后请求调试 halt</text>
