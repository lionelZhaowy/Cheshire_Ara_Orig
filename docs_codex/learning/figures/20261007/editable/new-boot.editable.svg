  <text fill="#216BB1" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" x="1037" y="297" data-box="r0" id="text-040">复位 PC → Boot ROM</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="333" data-box="r0" id="text-041">内部 LLC 存在：BIST / SPM 配置</text>
  <text fill="#536B7D" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" x="1037" y="363" data-box="r0" id="text-042">按容量调整栈是独立步骤</text>
