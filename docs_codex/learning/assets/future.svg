<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">未来方案：控制、数据与中断分别设计（尚未实现）</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">未来方案：控制、数据与中断分别设计（尚未实现）</text><rect x="25" y="75" width="250" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="150.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">CVA6 / Ara</text><text x="150.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">保留 SoC / LLC 路径</text><rect x="380" y="75" width="250" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="505.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">ISP + NPU 控制寄存器</text><text x="505.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">CPU 配置 / 状态 / doorbell</text><rect x="735" y="75" width="240" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="855.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">中断控制器</text><text x="855.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">完成 / 错误 → CPU</text><rect x="25" y="270" width="250" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="150.0" y="295" text-anchor="middle" font-size="16" fill="#193e50">传感器 → LVDS → ISP</text><text x="150.0" y="318" text-anchor="middle" font-size="14" fill="#193e50">采集 / 像素处理 / DMA</text><rect x="380" y="270" width="250" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="505.0" y="295" text-anchor="middle"