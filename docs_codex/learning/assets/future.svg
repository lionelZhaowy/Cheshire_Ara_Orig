1" stroke="white" stroke-width="5" paint-order="stroke">ISP DMA：绕过 LLC</text><polyline points="630,310 735,310" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="682" y="296" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">NPU DMA</text><polyline points="855,270 855,155" fill="none" stroke="#9656b4" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#irq)"/><text x="900" y="215" text-anchor="middle" font-size="13" fill="#9656b4" stroke="white" stroke-width="5" paint-order="stroke">完成 / 错误</text><polyline points="275,132 320,230 720,230 760,270" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="535" y="246" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">CPU/Ara 经 LLC → DDR</text><polyline points="855,350 855,415" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="868" y="386" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">AXI4 请求 / 响应</text><path d="M25 526h38" stroke="#136fa1" stroke-width="2" marker-end="url(#data)"/><text x="73" y="531" font-size="13" fill="#506777">数据 / 事务</text><path d="M225 526h38" stroke="#12836f" stroke-width="2" marker-end="url(#control)"/><text x="273" y="531" font-size="13" fill="#506777">控制 / 步骤</text><path d="M440 526h38" stroke="#9656b4" stroke-width="2" marker-end="url(#irq)"/><text x="488" y="531" font-size="13" fill="#506777">中断 / 失效通知</text><text x="25" y="558" font-size="12" fill="#647681">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</text></svg>