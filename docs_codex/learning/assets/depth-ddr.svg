<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 630" role="img" aria-labelledby="title desc"><title id="title">DDR 的系统边界</title><desc id="desc">AXI 是事务接口，DRAM 引脚是存储器电气与命令接口；二者之间还有控制器与 PHY。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="630" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">DDR 的系统边界</text>
<text x="32" y="74" class="small" text-anchor="start">AXI 是事务接口，DRAM 引脚是存储器电气与命令接口；二者之间还有控制器与 PHY。</text>
<rect x="40.0" y="130" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="190.0" y="169.0" class="box" text-anchor="middle">SoC LLC 下游 AXI4</text>
<text x="190.0" y="195.0" class="box" text-anchor="middle">ID / burst / WSTRB / RESP</text>
<rect x="360.0" y="130" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="510.0" y="169.0" class="box" text-anchor="middle">DDR 控制器</text>
<text x="510.0" y="195.0" class="box" text-anchor="middle">调度 / 刷新 / 地址映射</text>
<rect x="680.0" y="130" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="830.0" y="169.0" class="box" text-anchor="middle">DDR PHY → DRAM</text>
<text x="830.0" y="195.0" class="box" text-anchor="middle">训练 / 时序 / DQ-DQS</text>
<path d="M340,175 L360,175" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660,175 L680,175" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40.0" y="350" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="190.0" y="389.0" class="box" text-anchor="middle">可选 AXI CDC / 宽度适配</text>
<text x="190.0" y="415.0" class="box" text-anchor="middle">两个时钟域与在途容量</text>
<rect x="360.0" y="350" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="510.0" y="389.0" class="box" text-anchor="middle">控制寄存器 / 中断</text>
<text x="510.0" y="415.0" class="box" text-anchor="middle">初始化 / 状态 / 错误</text>
<rect x="680.0" y="350" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="830.0" y="389.0" class="box" text-anchor="middle">平台放行逻辑</text>
<text x="830.0" y="415.0" class="box" text-anchor="middle">PLL lock + init/calib done</text>
<text x="32" y="530" class="small" text-anchor="start">厂商交付需确认控制寄存器、复位顺序、AXI 限制、容量、ECC/错误和仿真模型。</text>
<text x="32" y="575" class="small" text-anchor="start">依据：现有 dram_wrapper_xilinx 边界；未来 ASIC 供应商接口尚未冻结，图不代替其数据手册。</text></svg>
