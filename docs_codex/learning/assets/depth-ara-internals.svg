<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc"><title id="title">Ara 内部：同一数组的分布与流动</title><desc id="desc">VLEN=2048、2 lanes；每架构寄存器 256 字节，共 32 个。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="730" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">Ara 内部：同一数组的分布与流动</text>
<text x="32" y="74" class="small" text-anchor="start">VLEN=2048、2 lanes；每架构寄存器 256 字节，共 32 个。</text>
<rect x="45" y="110" width="940" height="80" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="515.0" y="143.0" class="box" text-anchor="middle">dispatcher → sequencer</text>
<text x="515.0" y="169.0" class="box" text-anchor="middle">vtype / vl / vstart → 依赖表 / 各处理单元在途状态</text>
<rect x="40.0" y="260" width="460.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="270.0" y="286.0" class="box" text-anchor="middle">lane0：VRF 4 KiB</text>
<text x="270.0" y="312.0" class="box" text-anchor="middle">e32 元素 0、2、4…</text>
<text x="270.0" y="338.0" class="box" text-anchor="middle">ALU / MUL / FPU / 操作数队列</text>
<rect x="520.0" y="260" width="460.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="750.0" y="286.0" class="box" text-anchor="middle">lane1：VRF 4 KiB</text>
<text x="750.0" y="312.0" class="box" text-anchor="middle">e32 元素 1、3、5…</text>
<text x="750.0" y="338.0" class="box" text-anchor="middle">ALU / MUL / FPU / 操作数队列</text>
<path d="M270.0,190 L270.0,260" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750.0,190 L750.0,260" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40.0" y="460" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="190.0" y="499.0" class="box" text-anchor="middle">masku / sldu</text>
<text x="190.0" y="525.0" class="box" text-anchor="middle">每元素使能 / 跨 lane 移动</text>
<rect x="360.0" y="460" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="510.0" y="499.0" class="box" text-anchor="middle">VLSU</text>
<text x="510.0" y="525.0" class="box" text-anchor="middle">地址 / load / store / 缓冲</text>
<rect x="680.0" y="460" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="830.0" y="499.0" class="box" text-anchor="middle">AXI</text>
<text x="830.0" y="525.0" class="box" text-anchor="middle">访问 SPM / LLC / DDR</text>
<path d="M660,505 L680,505" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,352 L510,460" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="435" y="403" class="label" text-anchor="middle">store 数据 / load 返回</text>
<text x="32" y="625" class="small" text-anchor="start">vle32 → 分到两 lane → vadd 同 lane 计算 → vse32 重排回连续内存。</text>
<text x="32" y="675" class="small" text-anchor="start">源码：ara.sv、lane.sv、vlsu.sv；VRF 和临时 FIFO 都不是 NPU 可共享的数据 cache。</text></svg>
