<text x="32" y="535" class="small" text-anchor="start">分频改变节拍；门控停止脉冲；clock-enable 只控制状态更新。</text>
<text x="32" y="575" class="small" text-anchor="start">当前 RTL 的域与平台连接另见现状图；lock、复位释放和设备就绪是不同条件。</text></svg>
