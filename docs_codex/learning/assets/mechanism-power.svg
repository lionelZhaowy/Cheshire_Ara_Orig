<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="title desc"><title id="title">关电边界：隔离输出与保留状态</title><desc id="desc">候选示例：done 有效高，因此接收侧协议允许隔离时钳为 0。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="600" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">关电边界：隔离输出与保留状态</text>
<text x="32" y="74" class="small" text-anchor="start">候选示例：done 有效高，因此接收侧协议允许隔离时钳为 0。</text>
<rect x="30" y="155" width="265" height="120" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="162.5" y="195.0" class="box" text-anchor="middle">可关断设备域</text>
<text x="162.5" y="221.0" class="box" text-anchor="middle">状态机 → done</text>
<text x="162.5" y="247.0" class="box" text-anchor="middle">普通状态掉电后丢失</text>
<rect x="405" y="155" width="240" height="120" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="525.0" y="195.0" class="box" text-anchor="middle">常开隔离单元</text>
<text x="525.0" y="221.0" class="box" text-anchor="middle">隔离有效：输出 0</text>
<text x="525.0" y="247.0" class="box" text-anchor="middle">恢复后：透传 done</text>
<rect x="765" y="155" width="260" height="120" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="895.0" y="195.0" class="box" text-anchor="middle">常开控制域</text>
<text x="895.0" y="221.0" class="box" text-anchor="middle">完成邮箱 / epoch</text>
<text x="895.0" y="247.0" class="box" text-anchor="middle">任务与缓冲区所有权</text>
<path d="M295,215 L405,215" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M645,215 L765,215" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="365" width="265" height="100" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="162.5" y="408.0" class="box" text-anchor="middle">保持资源（独立供电）</text>
<text x="162.5" y="434.0" class="box" text-anchor="middle">保存选定配置 / 恢复</text>
<path d="M160,275 L160,365" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="365" width="620" height="100" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="715.0" y="395.0" class="box" text-anchor="middle">控制顺序</text>
<text x="715.0" y="421.0" class="box" text-anchor="middle">停发并排空 → 保存 → 隔离 → 按 IP 规范关电</text>
<text x="715.0" y="447.0" class="box" text-anchor="middle">上电与复位 → 恢复 / 重建 → 就绪 → 解除隔离</text>
<text x="32" y="530" class="small" text-anchor="start">电平转换负责不同电压的兼容；隔离负责已知输出；保持负责选定状态，三者职责独立。</text>
<text x="32" y="565" class="small" text-anchor="start">AXI 已接受事务必须先完成或受控终止；钳低信号本身不撤销事务。</text></svg>
