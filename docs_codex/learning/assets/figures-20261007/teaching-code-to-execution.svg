<text x="72" y="998" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-6">复位 PC：最早取指位置；ELF e_entry：应用入口；main：由启动代码调用的 C 函数。它们不能互相替代。</text>
