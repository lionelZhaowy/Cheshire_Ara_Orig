<text x="67" y="822" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-8">常开控制的事务顺序</text>
<text x="67" y="858" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-8">停发 → 排空 → 切换 / lock → 域内复位 / 就绪 → 放行</text>
<text x="67" y="888" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-8">lock、复位释放与设备可工作是三个不同条件</text>
<rect id="note-9" x="930" y="790" width="815" height="145" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="930" y="790" width="5" height="145" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="947" y="822" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-9">分频 / 门控 / clock-enable</text>
<text x="947" y="858" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-9">分频改变周期；门控停止时钟脉冲</text>
<text x="947" y="888" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-9">clock-enable 决定寄存器是否更新，不是新的时钟域</text>
