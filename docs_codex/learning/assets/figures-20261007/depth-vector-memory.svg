<text x="72" y="983" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-6">失效过滤 / 位宽适配 → Crossbar → SPM 或 LLC → 外存；AXI 口独立于 CPU L1 数据口</text>
