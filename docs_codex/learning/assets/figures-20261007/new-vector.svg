<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">e32,m1；VLEN=2048 → VLMAX=64。示例 a[i]+b[i]→c[i]，尾部 9 个元素同样需要校验。</text>
