<text x="837" y="687" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="r3">stack / 寄存器</text>
<text x="837" y="723" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r3">调用保存必要状态；无默认堆</text>
<rect id="note-5" x="55" y="875" width="790" height="135" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="55" y="875" width="5" height="135" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="72" y="907" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-5">函数调用示例</text>
<text x="72" y="943" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-5">main → make_value → ret；a0 传参 / 返回值，ra 保存返回地址</text>
<text x="72" y="973" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-5">跨调用仍需保留的值按 ABI 约定保存</text>
<rect id="note-6" x="925" y="875" width="810" height="135" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="925" y="875" width="5" height="135" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="942" y="907" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-6">SPM 链接时的栈前提</text>
<text x="942" y="943" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-6">__stack_pointer$ = 0 表示应用沿用既有栈</text>
<text x="942" y="973" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-6">不能把 0 写入 sp；首次栈访问前须有有效可写存储</text>
