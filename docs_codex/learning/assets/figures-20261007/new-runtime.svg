<text x="837" y="578" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r2">运行时空间：137 × 4 = 548 B；crt0 清零</text>
<rect id="r3" x="820" y="655" width="915" height="110" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
