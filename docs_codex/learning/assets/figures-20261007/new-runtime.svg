<text x="72" y="293" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">代码：main / make_value</text>
<text x="72" y="323" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">已初始化：seed = 1</text>
<text x="72" y="353" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">常量：greeting[]</text>
<text x="72" y="383" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">零初始化：result[137]</text>
<text x="72" y="413" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">局部 temporary：可在寄存器</text>
<text x="72" y="443" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="source">函数参数 / 返回值：依 ABI</text>
