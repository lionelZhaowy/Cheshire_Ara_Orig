<text x="68" y="77" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" text-anchor="start">JTAG 直接装载：主机与目标两条时间线如何汇合</text>
<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">当前保留内部 LLC 的启动基线；VIP 只检查指定配置位，不能由此推断栈和 ROM C 已完成。</text>
<text x="48" y="1077" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">当前源码结构 / 教学示意；非运行证据</text>
<text x="48" y="1108" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" text-anchor="start">源码：hw/bootrom；sw/lib/crt0.S；elfloader.cpp；vip_cheshire_soc.sv</text>
<text x="73" y="225" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">主机：构建器 / TB / JTAG VIP</text>
<text x="1008" y="225" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">目标：ROM / 存储 / 应用</text>
<rect id="l0" x="85" y="265" width="685" height="123" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="85" y="265" width="5" height="123" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="102" y="297" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="l0">ELF 与链接信息</text>
<text x="102" y="333" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l0">构建字节、入口、PT_LOAD</text>
<text x="102" y="363" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l0">map / dump 用于静态核对</text>
<rect id="r0" x="1020" y="265" width="695" height="123" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="1020" y="265" width="5" height="123" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="1037" y="297" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="r0">复位 PC → Boot ROM</text>
<text x="1037" y="333" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r0">内部 LLC 存在：BIST / SPM 配置</text>
<text x="1037" y="363" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r0">按容量调整栈是独立步骤</text>
<rect id="l1" x="85" y="430" width="685" height="123" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="85" y="430" width="5" height="123" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="102" y="462" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="l1">VIP 检查 SPM 配置位</text>
<text x="102" y="498" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l1">CFG_SPM_LOW.bit0</text>
<text x="102" y="528" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l1">随后请求调试 halt</text>
<rect id="r1" x="1020" y="430" width="695" height="123" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="1020" y="430" width="5" height="123" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="1037" y="462" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="r1">CPU 进入调试暂停</text>
<text x="1037" y="498" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r1">暂停不自动证明 sp 有效</text>
<text x="1037" y="528" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r1">核对 PC / sp；SBA 写入段</text>
<rect id="l2" x="85" y="595" width="685" height="123" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="85" y="595" width="5" height="123" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="102" y="627" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="l2">halt → SBA 写装载段</text>
<text x="102" y="663" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l2">目标存储须可写</text>
<text x="102" y="693" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l2">按装载规则处理初值与零区</text>
<rect id="r2" x="1020" y="595" width="695" height="123" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="1020" y="595" width="5" height="123" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="1037" y="627" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="r2">应用 _start / crt0</text>
<text x="1037" y="663" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r2">继承有效栈；gp / BSS / FS</text>
<text x="1037" y="693" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r2">向量入口另正确设置 VS</text>
<rect id="l3" x="85" y="760" width="685" height="123" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="85" y="760" width="5" height="123" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="102" y="792" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="l3">设置 DPC = ELF entry</text>
<text x="102" y="828" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l3">resume 后观察 UART / 状态</text>
<text x="102" y="858" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="l3">逐项结果与返回码共同判定</text>
<rect id="r3" x="1020" y="760" width="695" height="123" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="1020" y="760" width="5" height="123" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="1037" y="792" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="r3">main 与退出状态</text>
<text x="1037" y="828" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r3">计算 / MMIO / UART</text>
<text x="1037" y="858" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="r3">scratch2=(code&lt;&lt;1)|1；crt0 ret</text>
<text x="810" y="462" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">halt</text>
<text x="810" y="625" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">段字节</text>
<text x="806" y="760" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">resume</text>
<text x="810" y="845" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">结果</text>
<text x="65" y="1015" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start">无内部 LLC：平台另供首次栈访问前的存储与有效 sp。Bootrom=0：平台承担第一阶段启动。</text>
</svg>
