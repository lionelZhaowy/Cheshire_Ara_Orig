<text x="977" y="277" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b0">Debug 目标</text>
<text x="977" y="313" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b0">256 KiB 地址窗口；与 Debug SBA 发起口不同</text>
<rect id="a1" x="65" y="362" width="735" height="88" rx="7" fill="#F3F6F8" stroke="#536B7D" stroke-width="1.6"/>
<rect x="65" y="362" width="5" height="88" rx="0" fill="#536B7D" stroke="#536B7D" stroke-width="1.5"/>
<text x="82" y="394" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a1">0x0100_0000 … 0x0100_1000</text>
<rect id="b1" x="960" y="362" width="775" height="88" rx="7" fill="#F3F6F8" stroke="#536B7D" stroke-width="1.6"/>
<rect x="960" y="362" width="5" height="88" rx="0" fill="#536B7D" stroke="#536B7D" stroke-width="1.5"/>
<text x="977" y="394" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b1">iDMA 控制</text>
<text x="977" y="430" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b1">4 KiB 控制窗口；数据传输使用独立发起口</text>
<rect id="a2" x="65" y="479" width="735" height="88" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="65" y="479" width="5" height="88" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="82" y="511" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a2">0x0200_0000 … 0x0C00_0000</text>
<rect id="b2" x="960" y="479" width="775" height="88" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="960" y="479" width="5" height="88" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="977" y="511" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b2">Reg 桥 → 二级译码</text>
<text x="977" y="547" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b2">160 MiB 总窗口；包含空洞，不是连续 RAM</text>
<rect id="a3" x="65" y="596" width="735" height="88" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="65" y="596" width="5" height="88" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="82" y="628" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a3">0x1000_0000 / 0x1400_0000</text>
<rect id="b3" x="960" y="596" width="775" height="88" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="960" y="596" width="5" height="88" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="977" y="628" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b3">同一 LLC / SPM 阵列</text>
<text x="977" y="664" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b3">默认每个 SPM 别名各 128 KiB；并非双份容量</text>
<rect id="a4" x="65" y="713" width="735" height="88" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="65" y="713" width="5" height="88" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="82" y="745" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a4">0x8000_0000 … 0x1_0000_0000</text>
<rect id="b4" x="960" y="713" width="775" height="88" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="960" y="713" width="5" height="88" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="977" y="745" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b4">LLC 下游主存</text>
<text x="977" y="781" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b4">2 GiB 路由窗；实际 DDR 容量取决于平台</text>
<rect id="a5" x="65" y="830" width="735" height="88" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="65" y="830" width="5" height="88" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="82" y="862" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a5">0x1_0000_0000 … 0x2_0000_0000</text>
<rect id="b5" x="960" y="830" width="775" height="88" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="960" y="830" width="5" height="88" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="977" y="862" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="b5">Serial Link TX</text>
<text x="977" y="898" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="b5">4 GiB 对端窗口；受配置与地址映射约束</text>
<text x="80" y="1000" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" text-anchor="start">同一目标可有多个地址规则；关闭设备不等于其上层总窗口消失。未匹配访问应完成错误应答。</text>
</svg>
