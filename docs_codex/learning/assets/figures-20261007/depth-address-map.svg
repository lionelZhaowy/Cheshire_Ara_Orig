<text x="68" y="77" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" text-anchor="start">地址路由窗口与物理资源的映射</text>
<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">区间含起点、不含终点；图不按地址跨度比例。容量、权限与就绪状态分别判断。</text>
<text x="48" y="1077" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">当前源码结构 / 教学示意；非运行证据</text>
<text x="48" y="1108" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" text-anchor="start">源码：cheshire_pkg.sv::gen_axi_out / gen_reg_out / get_llc_size；默认配置</text>
<text x="65" y="205" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="bold" text-anchor="start">AXI 地址范围</text>
<text x="1010" y="205" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="bold" text-anchor="start">路由去向与实际资源</text>
<rect id="a0" x="65" y="245" width="735" height="88" rx="7" fill="#F3F6F8" stroke="#536B7D" stroke-width="1.6"/>
<rect x="65" y="245" width="5" height="88" rx="0" fill="#536B7D" stroke="#536B7D" stroke-width="1.5"/>
<text x="82" y="277" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="a0">0x0000_0000 … 0x0004_0000</text>
<rect id="b0" x="960" y="245" width="775" height="88" rx="7" fill="#F3F6F8" stroke="#536B7D" stroke-width="1.6"/>
