<text x="1317" y="532" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="elf">ELF / map / dump</text>
<text x="1317" y="568" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="elf">字节、符号、入口与装载段</text>
<text x="1317" y="598" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="elf">不能由编译成功推断目标运行</text>
