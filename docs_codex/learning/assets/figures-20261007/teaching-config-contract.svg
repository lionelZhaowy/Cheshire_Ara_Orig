<text x="1300" y="745" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">装载程序与有效硬件匹配</text>
<rect id="note-6" x="55" y="895" width="1690" height="120" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="55" y="895" width="5" height="120" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="72" y="927" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-6">运行时初始化不是再次生成硬件</text>
<text x="72" y="963" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-6">VS / FS、MMIO 配置、存储就绪、有效栈与入口：软件使用已存在的资源；SELCFG 不会自动替换 CPU profile。</text>
</svg>
