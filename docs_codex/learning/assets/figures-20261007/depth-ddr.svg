<text x="727" y="903" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="ready">供应商需给出 AXI 限制、容量、ECC / 错误、寄存器、模型与复位顺序</text>
