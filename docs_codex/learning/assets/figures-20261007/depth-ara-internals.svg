<text x="102" y="678" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="alu0">整数 / MUL / FPU</text>
<rect id="res0" x="470" y="610" width="325" height="115" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="470" y="610" width="5" height="115" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="487" y="642" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="res0">结果写回 VRF</text>
