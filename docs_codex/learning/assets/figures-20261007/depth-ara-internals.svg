<text x="1397" y="678" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="res1">按目标寄存器归位</text>
<rect id="cross" x="635" y="820" width="525" height="70" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="635" y="820" width="5" height="70" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="652" y="852" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="cross">masku / sldu：使能与跨 lane 交换</text>
<rect id="vlsu" x="55" y="930" width="1680" height="83" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="55" y="930" width="5" height="83" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="72" y="962" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="vlsu">VLSU：连续内存 → load 分发 → lanes → store 重排 → AXI</text>
<text x="72" y="998" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="vlsu">VRF 与临时 FIFO 不构成 NPU 可寻址共享 cache</text>
</svg>
