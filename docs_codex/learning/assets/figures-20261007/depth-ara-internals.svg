<text x="102" y="452" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="vrf0">分布式寄存器字节</text>
<text x="102" y="488" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="vrf0">e32 元素 0、2、4、6 …</text>
<text x="102" y="518" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="vrf0">VLEN 与 lane 数共同决定存储分片</text>
