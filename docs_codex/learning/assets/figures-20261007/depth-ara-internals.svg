<text x="72" y="232" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="disp">dispatcher → sequencer</text>
<text x="72" y="268" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="disp">vtype / vl / vstart → 依赖跟踪、功能单元发出与完成汇总</text>
<text x="73" y="390" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">lane 0：VRF 4 KiB</text>
