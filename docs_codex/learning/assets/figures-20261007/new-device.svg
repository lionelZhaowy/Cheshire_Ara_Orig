<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img">
<title>一次 UART 寄存器访问：地址、寄存器副作用与引脚</title>
<desc>同一地址访问谁由译码决定；写入产生什么动作由寄存器语义、访问宽度与设备状态决定。；源码：UART DIF / HAL；AXI→Reg / APB 适配；UART 寄存器实现</desc>
<rect x="0" y="0" width="1800" height="1125" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="40" y="40" width="8" height="62" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<line x1="40" y1="148" x2="1760" y2="148" stroke="#B9CAD6" stroke-width="1.5" fill="none"/>
<line x1="40" y1="1045" x2="1760" y2="1045" stroke="#B9CAD6" stroke-width="1.5" fill="none"/>
<rect x="55" y="575" width="1690" height="235" rx="12" fill="#F3F6F8" stroke="#B9CAD6" stroke-width="1.5"/>
<polyline points="395,335.0 505,335.0" fill="none" stroke="#216BB1" stroke-width="3"/>
<polygon points="505.00,335.00 493.00,330.00 493.00,340.00" fill="#216BB1" stroke="#216BB1" stroke-width="1"/>
<polyline points="850,335.0 960,335.0" fill="none" stroke="#216BB1" stroke-width="3"/>
<polygon points="960.00,335.00 948.00,330.00 948.00,340.00" fill="#216BB1" stroke="#216BB1" stroke-width="1"/>
<polyline points="1305,335.0 1415,335.0" fill="none" stroke="#216BB1" stroke-width="3"/>
<polygon points="1415.00,335.00 1403.00,330.00 1403.00,340.00" fill="#216BB1" stroke="#216BB1" stroke-width="1"/>
<polyline points="860,680 940,680 940,740 1020,740 1020,680 1100,680 1100,740 1180,740 1180,680 1260,680 1260,740 1340,740 1340,680 1690,680" fill="none" stroke="#7555A3" stroke-width="3"/>
<text x="68" y="77" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" text-anchor="start">一次 UART 寄存器访问：地址、寄存器副作用与引脚</text>
<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">同一地址访问谁由译码决定；写入产生什么动作由寄存器语义、访问宽度与设备状态决定。</text>
<text x="48" y="1077" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">当前源码结构 / 教学示意；非运行证据</text>
<text x="48" y="1108" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" text-anchor="start">源码：UART DIF / HAL；AXI→Reg / APB 适配；UART 寄存器实现</text>
<rect id="cpu" x="55" y="240" width="340" height="190" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="55" y="240" width="5" height="190" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="72" y="272" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="cpu">CPU / 驱动</text>
<text x="72" y="308" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="cpu">volatile + 正确访问宽度</text>
<text x="72" y="338" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="cpu">读取 LSR 检查发送条件</text>
<text x="72" y="368" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="cpu">写 THR 提交一个字符</text>
<rect id="bridge" x="505" y="240" width="345" height="190" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="505" y="240" width="5" height="190" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="522" y="272" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="bridge">AXI → Reg / APB</text>
<text x="522" y="308" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="bridge">地址译码</text>
<text x="522" y="338" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="bridge">byte lane / 字节使能</text>
<text x="522" y="368" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="bridge">握手与错误响应</text>
<rect id="fifo" x="960" y="240" width="345" height="190" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="960" y="240" width="5" height="190" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="977" y="272" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="fifo">寄存器 / TX FIFO</text>
<text x="977" y="308" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="fifo">DLAB 选择寄存器用途</text>
<text x="977" y="338" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="fifo">写入入队 / 状态更新</text>
<text x="977" y="368" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="fifo">访问成功不代表发送结束</text>
<rect id="pin" x="1415" y="240" width="330" height="190" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="1415" y="240" width="5" height="190" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="1432" y="272" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="pin">串行状态机</text>
<text x="1432" y="308" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="pin">波特率分频</text>
<text x="1432" y="338" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="pin">起始位 / 数据 / 停止位</text>
<text x="1432" y="368" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="pin">TX 引脚输出</text>
<text x="73" y="610" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">同时观察控制寄存器与外部波形</text>
<text x="90" y="650" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start">LSR / FIFO 状态</text>
<text x="660" y="650" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start">UART TX</text>
<text x="90" y="680" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start">可继续写入？FIFO 空？移位器也已空？</text>
<text x="90" y="713" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start">三个问题按具体状态位定义判断。</text>
<text x="960" y="780" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start">起始位</text>
<text x="1190" y="780" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start">数据位示意</text>
<text x="1550" y="780" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start">停止位</text>
<rect id="note-4" x="55" y="900" width="1690" height="110" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="55" y="900" width="5" height="110" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="72" y="932" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-4">其他外设仍沿同一分析方法</text>
<text x="72" y="968" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-4">W1C、读弹出 FIFO、忙时写入、GPIO 电平都需要各自的寄存器契约；寄存器地址正确只是访问的第一步。</text>
</svg>
