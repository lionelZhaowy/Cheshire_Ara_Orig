<text x="68" y="77" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" text-anchor="start">未来图像系统：流数据、帧缓冲与控制路径分层</text>
<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">LVDS / ISP / NPU 均为待集成模块；带宽与缓存规模必须由分辨率、格式、帧率和访问次数推导。</text>
<text x="48" y="1077" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">未来方案 / 待实现与验证</text>
<text x="48" y="1108" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" text-anchor="start">依据：用户产品方向与未来 IP 集成契约；不代表已实现 RTL 或已验证吞吐</text>
<text x="73" y="245" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">像素 / 张量处理通路：每段需要格式、背压与时钟契约</text>
<rect id="p0" x="85" y="310" width="350" height="175" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="85" y="310" width="5" height="175" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="102" y="342" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="p0">LVDS 接收</text>
<text x="102" y="378" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p0">解串 / 像素打包</text>
<text x="102" y="408" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p0">源同步采样 / 跨域 FIFO</text>
<rect id="p1" x="500" y="310" width="350" height="175" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="500" y="310" width="5" height="175" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="517" y="342" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="p1">ISP</text>
<text x="517" y="378" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p1">行缓存与图像算法</text>
<text x="517" y="408" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p1">格式、位宽与边界处理</text>
<rect id="p2" x="915" y="310" width="350" height="175" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="915" y="310" width="5" height="175" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="932" y="342" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="p2">脉动阵列 / NPU</text>
<text x="932" y="378" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p2">命令与张量布局</text>
<text x="932" y="408" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p2">片上复用与 AXI 读写</text>
<rect id="p3" x="1330" y="310" width="350" height="175" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="1330" y="310" width="5" height="175" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="1347" y="342" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="p3">CPU / Ara</text>
<text x="1347" y="378" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p3">调度与后处理</text>
<text x="1347" y="408" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start" data-box="p3">结果核对 / 下一阶段</text>
<rect id="ddr" x="340" y="715" width="1120" height="160" rx="7" fill="#EDF4FC" stroke="#216BB1" stroke-width="1.6"/>
<rect x="340" y="715" width="5" height="160" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<text x="357" y="747" fill="#216BB1" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="ddr">共享帧 / 张量缓冲 → AXI4 DDR 子系统</text>
<text x="357" y="783" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="ddr">NPU / ISP 数据旁路 LLC：需新增互连、仲裁、ID 与 CDC 契约</text>
<text x="357" y="813" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="ddr">所有权、可见性、QoS、背压、异常恢复与带宽预算需联合设计</text>
<rect id="note-5" x="55" y="925" width="1690" height="100" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="55" y="925" width="5" height="100" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="72" y="957" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-5">工程实施边界</text>
<text x="72" y="993" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-5">独立 cheshire_ara_asic/、固定配置、静态清单；Bender 至多用于一次性离线解析。图中系统仍需正式提取与验证。</text>
</svg>
