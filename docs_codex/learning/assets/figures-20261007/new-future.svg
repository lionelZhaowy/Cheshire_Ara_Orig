<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img">
<title>未来图像系统：流数据、帧缓冲与控制路径分层</title>
<desc>LVDS / ISP / NPU 均为待集成模块；带宽与缓存规模必须由分辨率、格式、帧率和访问次数推导。；依据：用户产品方向与未来 IP 集成契约；不代表已实现 RTL 或已验证吞吐</desc>
