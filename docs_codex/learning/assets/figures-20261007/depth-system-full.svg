<text x="952" y="948" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-8">仿真：RAM 模型；FPGA：MIG / DDR；ASIC：待采购 CTRL + PHY</text>
