<text x="92" y="948" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-7">CPU 写 MMIO → 外设状态机 → UART / SPI / I2C / GPIO 引脚</text>
<text x="92" y="978" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-7">外设 IRQ 经同步 / PLIC 等入口返回 CPU</text>
