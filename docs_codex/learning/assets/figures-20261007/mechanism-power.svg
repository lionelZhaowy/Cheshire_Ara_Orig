<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img">
<title>关电域与常开域：隔离、保持、电平转换各有职责</title>
<desc>示例 done 为有效高，接收协议允许隔离时钳为 0；实际钳位值按接口协议决定。；依据：ASIC 低功耗通用机制；需工艺库、UPF 与平台协议支持</desc>
<rect x="0" y="0" width="1800" height="1125" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="40" y="40" width="8" height="62" rx="0" fill="#216BB1" stroke="#216BB1" stroke-width="1.5"/>
<line x1="40" y1="148" x2="1760" y2="148" stroke="#B9CAD6" stroke-width="1.5" fill="none"/>
<line x1="40" y1="1045" x2="1760" y2="1045" stroke="#B9CAD6" stroke-width="1.5" fill="none"/>
<rect x="60" y="215" width="525" height="505" rx="12" fill="#F3EFF9" stroke="#B9CAD6" stroke-width="1.5"/>
<rect x="715" y="215" width="1040" height="505" rx="12" fill="#FFF3E7" stroke="#B9CAD6" stroke-width="1.5"/>
<polyline points="540,422.5 750,422.5" fill="none" stroke="#7555A3" stroke-width="3"/>
<polygon points="750.00,422.50 738.00,417.50 738.00,427.50" fill="#7555A3" stroke="#7555A3" stroke-width="1"/>
<polyline points="1195,422.5 1300,422.5" fill="none" stroke="#B76315" stroke-width="3"/>
<polygon points="1300.00,422.50 1288.00,417.50 1288.00,427.50" fill="#B76315" stroke="#B76315" stroke-width="1"/>
<polyline points="320.0,515 312.5,600" fill="none" stroke="#087E83" stroke-width="3"/>
<polygon points="312.50,600.00 318.54,588.49 308.57,587.61" fill="#087E83" stroke="#087E83" stroke-width="1"/>
<text x="68" y="77" fill="#19364B" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="bold" text-anchor="start">关电域与常开域：隔离、保持、电平转换各有职责</text>
<text x="68" y="120" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="normal" text-anchor="start">示例 done 为有效高，接收协议允许隔离时钳为 0；实际钳位值按接口协议决定。</text>
<text x="48" y="1077" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" text-anchor="start">未来方案 / 待实现与验证</text>
<text x="48" y="1108" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="20" font-weight="normal" text-anchor="start">依据：ASIC 低功耗通用机制；需工艺库、UPF 与平台协议支持</text>
<text x="78" y="250" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">可关断设备域</text>
<rect id="state" x="100" y="330" width="440" height="185" rx="7" fill="#F3EFF9" stroke="#7555A3" stroke-width="1.6"/>
<rect x="100" y="330" width="5" height="185" rx="0" fill="#7555A3" stroke="#7555A3" stroke-width="1.5"/>
<text x="117" y="362" fill="#7555A3" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="state">计算状态机</text>
<text x="117" y="398" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="state">普通寄存器掉电后丢失</text>
<text x="117" y="428" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="state">done 输出 / 任务内部状态</text>
<text x="117" y="458" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="state">电源撤除前先完成事务</text>
<text x="733" y="250" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" text-anchor="start">常开控制与隔离供电边界</text>
<rect id="isolation" x="750" y="330" width="445" height="185" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="750" y="330" width="5" height="185" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="767" y="362" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="isolation">输出隔离单元</text>
<text x="767" y="398" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="isolation">隔离有效：done_out = 0</text>
<text x="767" y="428" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="isolation">隔离解除：透传 done</text>
<text x="767" y="458" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="isolation">钳低不能撤销已接受 AXI</text>
<rect id="mail" x="1300" y="330" width="415" height="185" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="1300" y="330" width="5" height="185" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="1317" y="362" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="mail">完成邮箱 / 控制器</text>
<text x="1317" y="398" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="mail">记录 epoch 与所有权</text>
<text x="1317" y="428" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="mail">匹配状态后回收 buffer</text>
<text x="1317" y="458" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="normal" text-anchor="start" data-box="mail">处理超时与错误</text>
<rect id="retain" x="130" y="600" width="365" height="90" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="130" y="600" width="5" height="90" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="147" y="632" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="retain">保持资源：独立供电</text>
<text x="147" y="668" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="retain">仅保存选定状态</text>
<rect id="note-4" x="60" y="815" width="815" height="160" rx="7" fill="#FFF3E7" stroke="#B76315" stroke-width="1.6"/>
<rect x="60" y="815" width="5" height="160" rx="0" fill="#B76315" stroke="#B76315" stroke-width="1.5"/>
<text x="77" y="847" fill="#B76315" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-4">关断顺序（需 IP 规范确认）</text>
<text x="77" y="883" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-4">停发并排空 → 保存必要状态 → 隔离</text>
<text x="77" y="913" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-4">按平台顺序关时钟 / 电源；处理异常在途事务</text>
<rect id="note-5" x="935" y="815" width="815" height="160" rx="7" fill="#EAF6F3" stroke="#087E83" stroke-width="1.6"/>
<rect x="935" y="815" width="5" height="160" rx="0" fill="#087E83" stroke="#087E83" stroke-width="1.5"/>
<text x="952" y="847" fill="#087E83" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="bold" text-anchor="start" data-box="note-5">恢复顺序与电平兼容</text>
<text x="952" y="883" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-5">供电 / 时钟稳定 → 复位 → 恢复 / 重建 → 就绪 → 解除隔离</text>
<text x="952" y="913" fill="#536B7D" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="normal" text-anchor="start" data-box="note-5">电平转换负责电压兼容；保持负责状态，均不替代隔离</text>
</svg>
