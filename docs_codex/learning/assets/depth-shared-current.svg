<text x="190.0" y="190.0" class="box" text-anchor="middle">一致性 CSR + pending 等待</text>
<rect x="360.0" y="125" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="510.0" y="164.0" class="box" text-anchor="middle">Ara：VRF / VLSU</text>
<text x="510.0" y="190.0" class="box" text-anchor="middle">无独立地址标记 D-cache</text>
<rect x="680.0" y="125" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="830.0" y="164.0" class="box" text-anchor="middle">iDMA / 其他设备</text>
<text x="830.0" y="190.0" class="box" text-anchor="middle">不自动进入 Ara 失效协议</text>
