<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">当前 CPU / Ara 的数据可见性路径</title><desc id="desc">实线表示已存在的连接；不包含未来 NPU。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="690" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">当前 CPU / Ara 的数据可见性路径</text>
<text x="32" y="74" class="small" text-anchor="start">实线表示已存在的连接；不包含未来 NPU。</text>
