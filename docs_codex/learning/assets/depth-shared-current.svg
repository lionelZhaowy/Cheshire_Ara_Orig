<path d="M510.0,217 L510.0,390" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830.0,217 L830.0,390" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515,248 L195,248" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="280" class="label" text-anchor="middle">Ara AW → invalidation filter → L1 line invalidation</text>
<rect x="45" y="390" width="940" height="85" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="515.0" y="425.5" class="box" text-anchor="middle">系统 Crossbar → 主存原子处理 → LLC / SPM</text>
<text x="515.0" y="451.5" class="box" text-anchor="middle">CPU cache 属性、SPM 别名和 LLC way 模式分别控制副本存在条件</text>
<rect x="350" y="550" width="390" height="65" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="545.0" y="588.5" class="box" text-anchor="middle">LLC 下游 AXI → 外部存储</text>
<path d="M545,475 L545,550" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="660" class="small" text-anchor="start">源码：csr_regfile、acc_dispatcher、axi_inval_filter、cheshire_soc；该协作不覆盖任意新主设备。</text></svg>
