<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-labelledby="title desc"><title id="title">沿先决知识推进一条主线</title><desc id="desc">每段回答一个下一段会用到的问题。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="560" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">沿先决知识推进一条主线</text>
<text x="32" y="74" class="small" text-anchor="start">每段回答一个下一段会用到的问题。</text>
<rect x="35" y="110" width="140" height="60" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="105.0" y="146.0" class="box" text-anchor="middle">01—03</text>
<text x="205" y="134" class="box" text-anchor="start">系统 / 配置 / 互连</text>
<text x="205" y="159" class="small" text-anchor="start">有什么硬件？请求怎样走？</text>
<path d="M105,170 L105,190" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="190" width="140" height="60" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="105.0" y="226.0" class="box" text-anchor="middle">04—07</text>
<text x="205" y="214" class="box" text-anchor="start">运行 / 构建 / 启动 / 仿真</text>
<text x="205" y="239" class="small" text-anchor="start">程序怎样成为一次可观察执行？</text>
<path d="M105,250 L105,270" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="270" width="140" height="60" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="105.0" y="306.0" class="box" text-anchor="middle">08—11</text>
<text x="205" y="294" class="box" text-anchor="start">寄存器 / 中断 / 串行设备</text>
<text x="205" y="319" class="small" text-anchor="start">软件怎样控制并确认器件动作？</text>
<path d="M105,330 L105,350" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="350" width="140" height="60" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="105.0" y="386.0" class="box" text-anchor="middle">12—14</text>
<text x="205" y="374" class="box" text-anchor="start">存储 / 向量 / 主动设备</text>
<text x="205" y="399" class="small" text-anchor="start">多个执行者怎样共享数据？</text>
<path d="M105,410 L105,430" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="430" width="140" height="60" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="105.0" y="466.0" class="box" text-anchor="middle">15—16</text>
<text x="205" y="454" class="box" text-anchor="start">接入 / 独立工程与 ASIC</text>
<text x="205" y="479" class="small" text-anchor="start">新增能力需要哪些系统契约？</text></svg>
