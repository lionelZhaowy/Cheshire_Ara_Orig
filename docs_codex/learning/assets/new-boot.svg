<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" role="img" aria-labelledby="title desc"><title id="title">两条时间线在调试装载处汇合</title><desc id="desc">主机工具和目标 CPU 并行推进；箭头表示关键依赖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="690" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">两条时间线在调试装载处汇合</text>
<text x="32" y="74" class="small" text-anchor="start">主机工具和目标 CPU 并行推进；箭头表示关键依赖。</text>
<text x="40" y="120" class="title" text-anchor="start">主机：构建器 / 模拟器 / VIP</text>
<text x="590" y="120" class="title" text-anchor="start">目标：ROM / 应用</text>
<rect x="35" y="150" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="255.0" y="185.5" class="box" text-anchor="middle">构建 ELF</text>
<text x="255.0" y="211.5" class="box" text-anchor="middle">取得入口与装载段</text>
<rect x="585" y="150" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="805.0" y="185.5" class="box" text-anchor="middle">复位 PC → Boot ROM</text>
<text x="805.0" y="211.5" class="box" text-anchor="middle">BIST → 写 SPM 配置</text>
<path d="M255,235 L255,275" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805,235 L805,275" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="275" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="255.0" y="310.5" class="box" text-anchor="middle">运行 TB 与 JTAG VIP</text>
<text x="255.0" y="336.5" class="box" text-anchor="middle">检查 CFG_SPM_LOW.bit0</text>
<rect x="585" y="275" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="805.0" y="310.5" class="box" text-anchor="middle">处理器进入调试暂停</text>
<text x="805.0" y="336.5" class="box" text-anchor="middle">PC / sp 与栈范围须独立核对</text>
<path d="M255,360 L255,400" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805,360 L805,400" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="400" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="255.0" y="435.5" class="box" text-anchor="middle">halt → SBA 写段</text>
<text x="255.0" y="461.5" class="box" text-anchor="middle">设置 DPC = ELF entry → resume</text>
<rect x="585" y="400" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="805.0" y="435.5" class="box" text-anchor="middle">应用入口 crt0</text>
<text x="805.0" y="461.5" class="box" text-anchor="middle">gp / BSS / FS → main</text>
<path d="M255,485 L255,525" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805,485 L805,525" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="525" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="255.0" y="560.5" class="box" text-anchor="middle">采样 UART / 读退出状态</text>
<text x="255.0" y="586.5" class="box" text-anchor="middle">检查数据与结束码</text>
<rect x="585" y="525" width="440" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="805.0" y="560.5" class="box" text-anchor="middle">main 返回 → scratch2</text>
<text x="805.0" y="586.5" class="box" text-anchor="middle">(code &lt;&lt; 1) | 1；crt0 执行 ret</text>
<path d="M585,193 L475,318" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M475,443 L585,443" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M585,568 L475,568" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="665" class="small" text-anchor="start">VIP 无显式等待扩栈或 ROM C 的条件；应用继承栈须独立核对 PC / sp。</text></svg>
