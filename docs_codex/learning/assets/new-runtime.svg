<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-labelledby="title desc"><title id="title">C 对象、运行期与存储空间</title><desc id="desc">编译器根据语义安排位置；局部变量不必都占栈。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="620" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">C 对象、运行期与存储空间</text>
<text x="32" y="74" class="small" text-anchor="start">编译器根据语义安排位置；局部变量不必都占栈。</text>
<rect x="35" y="120" width="405" height="115" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="237.5" y="157.5" class="box" text-anchor="middle">journey.c</text>
<text x="237.5" y="183.5" class="box" text-anchor="middle">seed = 1；result[137]；greeting[]</text>
<text x="237.5" y="209.5" class="box" text-anchor="middle">make_value(i) 内的 temporary</text>
<rect x="610" y="110" width="400" height="70" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="810.0" y="151.0" class="box" text-anchor="middle">.text：指令</text>
<rect x="610" y="200" width="400" height="95" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="810.0" y="240.5" class="box" text-anchor="middle">.misc：常量与已初始化数据</text>
<text x="810.0" y="266.5" class="box" text-anchor="middle">greeting / seed</text>
<rect x="610" y="315" width="400" height="95" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="810.0" y="355.5" class="box" text-anchor="middle">.bss：运行空间，启动时清零</text>
<text x="810.0" y="381.5" class="box" text-anchor="middle">result：137 × 4 = 548 字节</text>
<rect x="610" y="430" width="400" height="100" rx="9" fill="#fff3da" stroke="#a7c2cb"/>
<text x="810.0" y="473.0" class="box" text-anchor="middle">stack：调用时保存必要状态</text>
<text x="810.0" y="499.0" class="box" text-anchor="middle">寄存器容纳部分临时值；无默认堆</text>
<path d="M440,150 L610,150" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,190 L610,245" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,220 L610,360" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="330" width="405" height="110" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="237.5" y="365.0" class="box" text-anchor="middle">main → make_value → ret</text>
<text x="237.5" y="391.0" class="box" text-anchor="middle">a0 传参数 / 返回值；ra 保存返回地址</text>
<text x="237.5" y="417.0" class="box" text-anchor="middle">需要跨调用保留的值按 ABI 保存</text>
<text x="32" y="580" class="small" text-anchor="start">SPM 链接器的 __stack_pointer$ = 0：应用继承 ROM 栈；0 不是要写进 sp 的实际地址。</text></svg>
