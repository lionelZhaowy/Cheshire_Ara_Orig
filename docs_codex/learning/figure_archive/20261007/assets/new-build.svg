<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-labelledby="title desc"><title id="title">同一程序在主机上形成 ELF</title><desc id="desc">每种产物回答不同问题；dump 是反汇编文本。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="560" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">同一程序在主机上形成 ELF</text>
<text x="32" y="74" class="small" text-anchor="start">每种产物回答不同问题；dump 是反汇编文本。</text>
<rect x="30" y="120" width="225" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="142.5" y="155.5" class="box" text-anchor="middle">journey.c</text>
<text x="142.5" y="181.5" class="box" text-anchor="middle">C 语义</text>
<rect x="290" y="120" width="225" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="402.5" y="155.5" class="box" text-anchor="middle">journey.i</text>
<text x="402.5" y="181.5" class="box" text-anchor="middle">预处理</text>
<rect x="550" y="120" width="225" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="662.5" y="155.5" class="box" text-anchor="middle">journey.s</text>
<text x="662.5" y="181.5" class="box" text-anchor="middle">目标汇编</text>
<rect x="810" y="120" width="225" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="922.5" y="155.5" class="box" text-anchor="middle">journey.o</text>
<text x="922.5" y="181.5" class="box" text-anchor="middle">编码 + 符号 + 重定位</text>
<path d="M255,162 L290,162" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515,162 L550,162" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M775,162 L810,162" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="335" width="320" height="110" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="195.0" y="370.0" class="box" text-anchor="middle">crt0.o + libsupport.a</text>
<text x="195.0" y="396.0" class="box" text-anchor="middle">UART / CLINT / printf</text>
<text x="195.0" y="422.0" class="box" text-anchor="middle">提供入口与函数实现</text>
<rect x="435" y="335" width="230" height="110" rx="9" fill="#ddf0e9" stroke="#a7c2cb"/>
<text x="550.0" y="383.0" class="box" text-anchor="middle">链接器 + .ld</text>
<text x="550.0" y="409.0" class="box" text-anchor="middle">布局与符号解析</text>
<rect x="745" y="310" width="280" height="150" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="885.0" y="352.0" class="box" text-anchor="middle">journey.spm.elf</text>
<text x="885.0" y="378.0" class="box" text-anchor="middle">PT_LOAD：装载段</text>
<text x="885.0" y="404.0" class="box" text-anchor="middle">入口 / 字节 / 运行大小</text>
<text x="885.0" y="430.0" class="box" text-anchor="middle">旁证：map、nm、dump</text>
<path d="M922,205 L550,335" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M355,390 L435,390" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M665,390 L745,390" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="510" class="small" text-anchor="start">链接成功说明对象和布局可组成程序文件；处理器是否正确执行，需要随后装载与运行。</text></svg>
