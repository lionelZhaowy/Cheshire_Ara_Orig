<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" role="img" aria-labelledby="title desc"><title id="title">未来共享存储：候选路径与责任</title><desc id="desc">本图是规划；NPU / ISP 及其控制协议尚未集成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#357988"/></marker></defs><rect width="1060" height="650" fill="#fcfefe"/><style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#17384a}.title{font-size:25px;font-weight:700}.small{font-size:15px;fill:#536b78}.box{font-size:18px}.label{font-size:16px;fill:#216c77}</style>
<text x="32" y="42" class="title" text-anchor="start">未来共享存储：候选路径与责任</text>
<text x="32" y="74" class="small" text-anchor="start">本图是规划；NPU / ISP 及其控制协议尚未集成。</text>
<rect x="40.0" y="115" width="460.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="270.0" y="154.0" class="box" text-anchor="middle">CPU / Ara</text>
<text x="270.0" y="180.0" class="box" text-anchor="middle">软件任务 / 后处理</text>
<rect x="520.0" y="115" width="460.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="750.0" y="154.0" class="box" text-anchor="middle">NPU / ISP</text>
<text x="750.0" y="180.0" class="box" text-anchor="middle">独立数据发起端</text>
<rect x="40.0" y="330" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="190.0" y="369.0" class="box" text-anchor="middle">共享 SPM / SRAM</text>
<text x="190.0" y="395.0" class="box" text-anchor="middle">小块数据 / 明确所有权</text>
<rect x="360.0" y="330" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="510.0" y="369.0" class="box" text-anchor="middle">现有 LLC 路径</text>
<text x="510.0" y="395.0" class="box" text-anchor="middle">需验证 CPU/Ara 缓存维护</text>
<rect x="680.0" y="330" width="300.0" height="92" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="830.0" y="369.0" class="box" text-anchor="middle">DDR 旁路互连</text>
<text x="830.0" y="395.0" class="box" text-anchor="middle">与 LLC 下游合流</text>
<path d="M270,207 L195,330" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,207 L510,330" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,207 L195,330" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,207 L830,330" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="600" y="510" width="390" height="65" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="795.0" y="548.5" class="box" text-anchor="middle">AXI4 DDR 控制器 + PHY + DRAM</text>
<path d="M830,422 L800,510" fill="none" stroke="#357988" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="610" class="small" text-anchor="start">候选共用地址 / 布局 / 可见性协议；旁路普通写也需纳入原子与 LR/SC 验证。</text></svg>
