<text x="525.0" y="176.5" class="box" text-anchor="middle">向量指令 → 独立访存</text>
<rect x="715" y="115" width="300" height="85" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
<text x="865.0" y="150.5" class="box" text-anchor="middle">调试 / iDMA / 设备</text>
