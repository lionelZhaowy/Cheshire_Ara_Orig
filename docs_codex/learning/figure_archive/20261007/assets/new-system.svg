<text x="530.0" y="306.0" class="box" text-anchor="middle">AXI Crossbar：地址选择目标，ID 帮助定位请求来源</text>
<rect x="35" y="410" width="300" height="90" rx="9" fill="#edf5f7" stroke="#a7c2cb"/>
