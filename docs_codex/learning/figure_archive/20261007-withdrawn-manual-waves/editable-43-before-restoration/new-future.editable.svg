  <text fill="#087E83" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" x="48" y="1077" id="text-020">未来方案 / 待实现与验证</text>
