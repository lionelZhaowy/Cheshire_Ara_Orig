  <text fill="#7555A3" stroke="none" stroke-width="1" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" x="73" y="245" id="text-022">像素 / 张量处理通路：每段需要格式、背压与时钟契约</text>
