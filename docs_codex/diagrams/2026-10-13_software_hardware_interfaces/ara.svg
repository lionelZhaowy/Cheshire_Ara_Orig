<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<marker id="call" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#4775AC"/></marker>
<marker id="bus" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#287D70"/></marker>
<marker id="data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8660A5"/></marker>
<marker id="event" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#BB6D30"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="900" fill="#FAFCFF"/>
<text x="48" y="55" font-family="Microsoft YaHei" font-size="30" font-weight="bold" text-anchor="start" fill="#26384B">Ara 接口：向量请求与批量数据走不同通路</text>
<rect x="50" y="125" width="350" height="150" rx="9" fill="#EAF1FC" stroke="#4775AC" stroke-width="2"/>
<text x="225.0" y="161" font-family="Microsoft YaHei" font-size="23" font-weight="bold" text-anchor="middle" fill="#26384B">软件向量内核</text>
<text x="225.0" y="195" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">vsetvli / vle32 / vadd / vse32</text>
<text x="225.0" y="224" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">标量 GPR 给基址与长度</text>
<text x="225.0" y="253" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">VS / FS 和特权条件</text>
<rect x="515" y="125" width="355" height="150" rx="9" fill="#EAF1FC" stroke="#4775AC" stroke-width="2"/>
<text x="692.5" y="161" font-family="Microsoft YaHei" font-size="23" font-weight="bold" text-anchor="middle" fill="#26384B">CVA6 acc_dispatcher</text>
<text x="692.5" y="195" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">insn / rs1 / rs2 / trans_id</text>
<text x="692.5" y="224" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">非推测发射 / pending</text>
<text x="692.5" y="253" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">barrier 与结果写回</text>
<rect x="995" y="125" width="355" height="150" rx="9" fill="#F1ECF7" stroke="#8660A5" stroke-width="2"/>
<text x="1172.5" y="161" font-family="Microsoft YaHei" font-size="23" font-weight="bold" text-anchor="middle" fill="#26384B">Ara dispatcher / lanes</text>
<text x="1172.5" y="195" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">指令执行 / 向量寄存器</text>
<text x="1172.5" y="224" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">VL / VTYPE / 元素运算</text>
<text x="1172.5" y="253" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#26384B">响应 / exception / 完成</text>
