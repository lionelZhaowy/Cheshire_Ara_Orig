<text x="458" y="183" font-family="Microsoft YaHei" font-size="19" font-weight="normal" text-anchor="middle" fill="#4775AC">指令执行</text>
<polyline points="870,200 995,200" fill="none" stroke="#4775AC" stroke-width="2.4" marker-end="url(#call)" marker-start="url(#call)"/>
<text x="932" y="183" font-family="Microsoft YaHei" font-size="19" font-weight="normal" text-anchor="middle" fill="#4775AC">专用请求/响应</text>
