<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>数据处理与配置关系</title>
  <defs>
    <marker id="blue-arrow" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#3575A6"/>
    </marker>
    <marker id="purple-arrow" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#8161A8"/>
    </marker>
    <marker id="teal-arrow" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#347F7A"/>
    </marker>
  </defs>
  <rect id="background" width="1200" height="720" fill="#FFFFFF" stroke="none"/>
  <rect id="processing-domain" x="430" y="42" width="340" height="208" rx="18" fill="#F6FAFE" stroke="#8CA6C1" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="450" y="81" font-family="Microsoft YaHei" font-size="24" fill="#536E88">处理域</text>
  <rect id="input" x="60" y="110" width="260" height="100" rx="14" fill="#E4F0FC" stroke="#83A9CD" stroke-width="2"/>
  <rect id="compute" x="470" y="110" width="260" height="100" rx="14" fill="#E4F3EC" stroke="#85B69A" stroke-width="2"/>
  <rect id="output" x="910" y="110" width="230" height="100" rx="14" fill="#FFF0DF" stroke="#CCA47A" stroke-width="2"/>
  <g font-family="Microsoft YaHei" font-size="28" fill="#263E53" text-anchor="middle">
    <text x="190" y="169">输入数据</text>
    <text x="600" y="169">处理模块</text>
    <text x="1025" y="169">输出结果</text>
  </g>
  <line id="input-to-compute" x1="320" y1="160" x2="470" y2="160" stroke="#3575A6" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <line id="compute-to-output" x1="730" y1="160" x2="910" y2="160" stroke="#3575A6" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <path id="feedback" d="M 1025 210 C 1025 350 190 350 190 210" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="600" y="360" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" fill="#3575A6">反馈数据</text>
  <rect id="software" x="60" y="420" width="250" height="100" rx="14" fill="#EEE8F6" stroke="#AC96C5" stroke-width="2"/>
  <rect id="registers" x="470" y="420" width="260" height="100" rx="14" fill="#EEE8F6" stroke="#AC96C5" stroke-width="2"/>
  <rect id="peripheral" x="910" y="420" width="230" height="100" rx="14" fill="#E3F3F1" stroke="#82B6B0" stroke-width="2"/>
  <g font-family="Microsoft YaHei" font-size="28" fill="#263E53" text-anchor="middle">
    <text x="185" y="479">软件配置</text>
    <text x="600" y="479">控制寄存器</text>
    <text x="1025" y="479">外设控制</text>
  </g>
  <polyline id="configuration-elbow" points="310,470 390,470 390,550 600,550 600,520" fill="none" stroke="#8161A8" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#purple-arrow)"/>
  <line id="control-bidirectional" x1="730" y1="470" x2="910" y2="470" stroke="#347F7A" stroke-width="3" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <rect id="status" x="470" y="610" width="180" height="75" rx="12" fill="#EEE8F6" stroke="#AC96C5" stroke-width="2"/>
  <rect id="events" x="910" y="610" width="230" height="75" rx="12" fill="#E3F3F1" stroke="#82B6B0" stroke-width="2"/>
  <g font-family="Microsoft YaHei" font-size="26" fill="#263E53" text-anchor="middle">
    <text x="560" y="657">状态寄存器</text>
    <text x="1025" y="657">事件源</text>
  </g>
  <line id="reverse-status" x1="910" y1="647" x2="650" y2="647" stroke="#347F7A" stroke-width="3" marker-end="url(#teal-arrow)"/>
</svg>
