<text id="n092" x="1922.5" y="1103.0" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#29292D">rdata[31:0] / error / ready</text>
<text id="n093" x="1922.5" y="1133.0" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#29292D">ready 同时决定本次 Reg 访问能否完成</text>
