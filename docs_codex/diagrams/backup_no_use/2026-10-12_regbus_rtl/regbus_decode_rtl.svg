<text id="n095" x="1430" y="1268" font-family="Microsoft YaHei" font-size="25" font-weight="normal" text-anchor="start" fill="#606773">默认错误路径也返回响应，不是丢弃请求</text>
<rect id="n096" x="40" y="1385" width="1110" height="110" fill="#FFFFFF" stroke="#29292D" stroke-width="1.8"/>
<text id="n097" x="595.0" y="1433.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" text-anchor="middle" fill="#29292D">组合关系：输出只由当前请求、地址规则和目标响应决定</text>
<text id="n098" x="595.0" y="1463.0" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#29292D">addr_decode / reg_demux 内无 FIFO、无状态机、无时钟寄存器</text>
<rect id="n099" x="1180" y="1385" width="1180" height="110" fill="#FFFFFF" stroke="#29292D" stroke-width="1.8"/>
<text id="n100" x="1770.0" y="1433.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" text-anchor="middle" fill="#29292D">时序边界位于上下游模块</text>
<text id="n101" x="1770.0" y="1463.0" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#29292D">reg_demux 的 clk_i / rst_ni 端口在当前实现中未被内部逻辑使用</text>
<text id="n102" x="45" y="1540" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="start" fill="#606773">蓝：请求字段   紫：选择控制   绿：响应字段   SEL：同一个 reg_select 网络；图中 p/k 为端口索引，j 为规则索引。</text>
