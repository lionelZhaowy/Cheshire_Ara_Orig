<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1680" height="900" viewBox="0 0 1680 900">
  <title id="title-001">参考 DDR Controller V2.1 的三端口接入建议</title>
  <desc id="desc-001">尚未实现的接入建议。保留当前 Cheshire Crossbar、原子适配及 LLC；LLC 出口接控制器 S0，ISP 接 S1，NPU 接 S2。仲裁器和 FR-FCFS 命令调度位于控制器内部。独立 urgent 接口不支持，带宽保底及最坏等待时间尚待评估。</desc>
  <rect id="rect-001" x="0" y="0" width="1680" height="900" fill="#f7fafc" stroke="none" stroke-width="0" />
  <text id="text-001" x="30" y="52" font-family="Microsoft YaHei" font-size="34" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">参考 DDR Controller V2.1 的多端口接入建议</text>
  <text id="text-002" x="30" y="90" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">工程建议，当前 RTL 尚未集成供应商 IP；Crossbar 原有结构沿用，ISP/NPU 数据直接进入控制器的不同 AXI Slave。</text>
  <rect id="rect-002" x="30" y="112" width="1620" height="51" fill="#e8f4ed" stroke="#b4d5c2" stroke-width="2" />
  <text id="text-003" x="48" y="145" font-family="Microsoft YaHei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">SoC → S0  ·  ISP → S1  ·  NPU → S2 ；控制器集成多端口仲裁，可配置优先级及 QoS。</text>
  <rect id="rect-003" x="775" y="182" width="690" height="485" fill="#eef4f9" stroke="#9ab3c9" stroke-width="2" />
  <text id="text-004" x="795" y="216" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">DDR Controller 内部（仅画与接入相关的功能）</text>
  <rect id="rect-004" x="30" y="248" width="185" height="74" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-005" x="48" y="280" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">CVA6 + Ara</text>
  <text id="text-006" x="48" y="307" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">当前 SoC 发起端</text>
  <rect id="rect-005" x="255" y="248" width="180" height="74" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-007" x="270" y="280" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">Cheshire</text>
  <text id="text-008" x="270" y="307" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">Crossbar</text>
  <rect id="rect-006" x="475" y="235" width="270" height="100" fill="#e8f2fe" stroke="#96b9df" stroke-width="2" />
  <text id="text-009" x="491" y="267" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">现有原子适配 + LLC</text>
  <text id="text-010" x="491" y="295" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">经 LLC 出口访问外存</text>
  <text id="text-011" x="491" y="321" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">SPM 访问仍可在片内完成</text>
  <line id="line-001" x1="215" y1="285" x2="255" y2="285" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-001" points="247,281 255,285 247,289" fill="#526b80" stroke="none" />
