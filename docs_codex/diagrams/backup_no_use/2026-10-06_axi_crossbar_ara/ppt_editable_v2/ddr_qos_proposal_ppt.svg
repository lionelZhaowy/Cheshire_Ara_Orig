  <text id="text-012" x="48" y="428" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">ISP 数据 AXI Master</text>
  <text id="text-013" x="48" y="458" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">写帧缓存，绕过 Crossbar / LLC</text>
  <line id="line-004" x1="390" y1="435" x2="795" y2="435" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-004" points="787,431 795,435 787,439" fill="#526b80" stroke="none" />
