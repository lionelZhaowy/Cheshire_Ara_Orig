  <rect id="rect-011" x="795" y="540" width="140" height="90" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-020" x="810" y="575" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">AXI S2</text>
  <text id="text-021" x="810" y="608" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">NPU 读 / 写</text>
  <line id="line-008" x1="935" y1="585" x2="975" y2="585" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-008" points="967,581 975,585 967,589" fill="#526b80" stroke="none" />
  <rect id="rect-012" x="975" y="240" width="200" height="390" fill="#f9f5ff" stroke="#b9a6d4" stroke-width="2" />
  <text id="text-022" x="994" y="315" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">内部 Arbiter</text>
  <text id="text-023" x="994" y="359" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">可配置优先级</text>
  <text id="text-024" x="994" y="394" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">轮询 / QoS</text>
  <text id="text-025" x="994" y="470" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">页命中限制</text>
  <text id="text-026" x="994" y="510" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">端口请求仲裁</text>
  <line id="line-009" x1="1175" y1="435" x2="1210" y2="435" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-009" points="1202,431 1210,435 1202,439" fill="#526b80" stroke="none" />
  <rect id="rect-013" x="1210" y="345" width="230" height="190" fill="#e8f2fe" stroke="#96b9df" stroke-width="2" />
  <text id="text-027" x="1227" y="383" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">Controller Core</text>
  <text id="text-028" x="1227" y="423" font-family="Microsoft YaHei" font-size="21" font-weight="normal" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">内部命令队列</text>
  <text id="text-029" x="1227" y="467" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">FR-FCFS 调度</text>
  <text id="text-030" x="1227" y="508" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">遵守 DRAM 时序</text>
  <line id="line-010" x1="1440" y1="435" x2="1490" y2="435" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-010" points="1482,431 1490,435 1482,439" fill="#526b80" stroke="none" />
  <rect id="rect-014" x="1490" y="394" width="160" height="82" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-031" x="1510" y="428" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">PHY</text>
  <text id="text-032" x="1510" y="457" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">+ SDRAM</text>
  <rect id="rect-015" x="30" y="696" width="1620" height="168" fill="#ffffff" stroke="#cbd9e4" stroke-width="2" />
  <text id="text-033" x="48" y="728" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">依据与待确认边界</text>
  <text id="text-034" x="48" y="762" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">Datasheet V2.1：p8 最多 8 个 AXI 端口；p10 仲裁特性；p13 每端口 QoS；p17–18 内部结构与命令调度。</text>
  <text id="text-035" x="48" y="794" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">p14：独立 AXI Urgent 接口不支持。优先级 / QoS 的具体寄存器、映射规则、带宽保底和最坏延迟仍需用户手册确认。</text>
  <text id="text-036" x="48" y="826" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">多端口不会自动保证共享缓存一致性或旁路写的 AMO/LRSC 语义；RT 是否需要添加，后续结合控制器能力评估。</text>
</svg>