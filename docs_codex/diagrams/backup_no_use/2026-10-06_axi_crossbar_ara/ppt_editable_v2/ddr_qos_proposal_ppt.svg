  <text id="text-014" x="48" y="578" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">NPU 数据 AXI Master</text>
  <text id="text-015" x="48" y="608" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">读写权重 / 特征图，绕过 LLC</text>
  <line id="line-005" x1="390" y1="585" x2="795" y2="585" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-005" points="787,581 795,585 787,589" fill="#526b80" stroke="none" />
  <rect id="rect-009" x="795" y="240" width="140" height="90" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-016" x="810" y="275" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">AXI S0</text>
  <text id="text-017" x="810" y="308" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">SoC 外存流量</text>
  <line id="line-006" x1="935" y1="285" x2="975" y2="285" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
  <polygon id="polygon-006" points="967,281 975,285 967,289" fill="#526b80" stroke="none" />
  <rect id="rect-010" x="795" y="390" width="140" height="90" fill="#ffffff" stroke="#bccbd8" stroke-width="2" />
  <text id="text-018" x="810" y="425" font-family="Microsoft YaHei" font-size="25" font-weight="bold" font-style="normal" text-anchor="start" fill="#183044" stroke="none" xml:space="preserve">AXI S1</text>
  <text id="text-019" x="810" y="458" font-family="Microsoft YaHei" font-size="17" font-weight="normal" font-style="normal" text-anchor="start" fill="#50667a" stroke="none" xml:space="preserve">ISP 写入</text>
  <line id="line-007" x1="935" y1="435" x2="975" y2="435" fill="none" stroke="#8094a6" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" />
