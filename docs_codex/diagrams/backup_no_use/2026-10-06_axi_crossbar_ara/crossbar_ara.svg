<text x="1138" y="260" class="h">M0 · Debug 目标接口</text>
<text x="1138" y="283" class="small">调试模块地址空间（与 SBA 发起端分开）</text>
<rect x="1120" y="332" width="530" height="126" rx="12" fill="#fff2e5" stroke="#d9b48e" stroke-width="2" />
<text x="1138" y="363" class="h">M1 · AXI → Regbus → Reg demux</text>
<text x="1138" y="393" >Boot ROM / CLINT / PLIC / SoC regs</text>
<text x="1138" y="423" >UART / I²C / SPI / GPIO / LLC 控制等</text>
<rect x="1120" y="487" width="530" height="198" rx="12" fill="#e8f2fe" stroke="#96b9df" stroke-width="2" />
<text x="1138" y="521" class="h">M2 · LLC / SPM 共用一个目标端口</text>
<text x="1138" y="553" class="sub">AMO/LRSC 适配 → cut / 地址重映射 → LLC</text>
<text x="1138" y="583" class="sub">SPM：128 KiB，含 cached / uncached 别名</text>
<text x="1138" y="613" class="small">外存窗口：0x8000_0000 ≤ addr &lt; 0x1_0000_0000</text>
<text x="1138" y="648" class="sub">LLC 下游 AXI 端口 → 平台 DDR 控制器</text>
<text x="1138" y="674" class="small">SPM / cache 命中访问可在片内完成</text>
<rect x="1120" y="713" width="530" height="64" rx="12" fill="#fff" stroke="#bccbd8" stroke-width="2" />
<text x="1138" y="741" class="h">M3 · iDMA 控制接口</text>
<text x="1138" y="765" class="small">0x0100_0000 起；与 DMA 数据发起端分开</text>
<rect x="1120" y="829" width="530" height="72" rx="12" fill="#fff" stroke="#bccbd8" stroke-width="2" />
<text x="1138" y="857" class="h">M4 · Serial Link TX 目标窗口</text>
<text x="1138" y="883" class="small">0x1_0000_0000 ≤ addr &lt; 0x2_0000_0000</text>
<rect x="30" y="951" width="1620" height="174" rx="12" fill="#fff" stroke="#cbd9e4" stroke-width="2" />
<text x="50" y="983" class="h">如何读这张图</text>
<text x="50" y="1017" class="sub">① 每个输入按地址分流；每个输出独立仲裁。访问不同输出可并行，争同一输出才在该处竞争。</text>
<text x="50" y="1046" class="sub">② 线代表 AXI 通道组：AR/AW/W 向目标，R/B 返回；未映射地址进入各输入的错误响应单元（图略）。</text>
<text x="50" y="1075" class="sub">③ 从 Crossbar 看：S 是 slave port（接发起者），M 是 master port（接目标），所以名称看起来反过来。</text>
<text x="50" y="1104" class="sub">④ VCU118 当前加源脚本：SerialLink=0、USB=0、Ara=1 ⇒ 5 × 4；RT 同样关闭。图为仿真 Ara 配置。</text>
</svg>
