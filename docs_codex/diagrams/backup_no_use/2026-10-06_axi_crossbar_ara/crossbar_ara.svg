<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1160" viewBox="0 0 1680 1160" role="img" aria-labelledby="title desc"><title id="title">带 Ara 的 Cheshire AXI Crossbar：7 个输入、5 个输出</title><desc id="desc">当前仿真 SELCFG=3 的源码结构。每个输入有地址译码与分流，每个输出有独立汇聚仲裁。Ara 是独立访存发起者。RT 未实例化。LLC 与 SPM 共用输出端口，DDR 接于 SoC 外。右下附 FPGA 配置差异。</desc><style>text{font-family:"WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif;fill:#183044;font-size:21px}.title{font-size:34px;font-weight:bold}.h{font-size:25px;font-weight:bold}.sub{font-size:19px;fill:#50667a}.small{font-size:17px;fill:#50667a}.mono{font-family:monospace;font-size:18px}.box{fill:#fff;stroke:#bccbd8;stroke-width:2}.wire{fill:none;stroke:#8094a6;stroke-width:2}.note{fill:#edf3f8;stroke:#cbd9e4;stroke-width:1.5}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#526b80"/></marker><marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#2774c7"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#c66a20"/></marker></defs><rect width="1680" height="1160" fill="#f7fafc"/>
