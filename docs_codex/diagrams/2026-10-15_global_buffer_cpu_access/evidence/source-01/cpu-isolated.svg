<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>CPU 与 Global Buffer 的连接方案</title>
<defs>
<marker id="data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#314D66"/></marker>
<marker id="local" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#187C78"/></marker>
<marker id="control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#765489"/></marker>
<marker id="irq" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#A05255"/></marker>
<marker id="host" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B96043"/></marker>
</defs>
<rect id="background" x="0" y="0" width="2560" height="1440" fill="#FFFFFF" stroke="none"/>
<text x="60" y="63" font-family="WenQuanYi Zen Hei" font-size="42" font-weight="700" text-anchor="start" fill="#29292D">方案一：CPU 标量端不直接访问 GB</text>
<text x="60" y="112" font-family="WenQuanYi Zen Hei" font-size="28" font-weight="400" text-anchor="start" fill="#606773">CPU 后处理前，由 Ara 转存到预留 SPM，或由搬运器转存到 DDR</text>
<rect id="host-domain" x="60" y="160" width="1510" height="430" fill="#F8ECEC" stroke="#29292D" stroke-width="1.8"/>
<text x="85" y="202" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="start" fill="#29292D">CVA6 / Ara 计算与访存</text>
<rect id="accelerator-domain" x="1780" y="160" width="720" height="430" fill="#ECF2F7" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1805" y="202" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="start" fill="#29292D">NPU 与显式搬运（规划）</text>
<rect id="gb-domain" x="1780" y="620" width="720" height="520" fill="#EEF7F3" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1805" y="661" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="start" fill="#29292D">独立片上共享存储（规划）</text>
<rect id="cpu" x="110" y="240" width="300" height="150" fill="#F1D7D9" stroke="#29292D" stroke-width="1.8"/>
<text x="260.0" y="287.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="cpu">CVA6</text>
<text x="260.0" y="325.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="cpu">标量 load / store</text>
<text x="260.0" y="363.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="cpu">GB 访问属性单独配置</text>
<rect id="ara" x="560" y="240" width="280" height="150" fill="#F1D7D9" stroke="#29292D" stroke-width="1.8"/>
<text x="700.0" y="306.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="ara">Ara</text>
<text x="700.0" y="344.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="ara">RVV / 单一 AXI 出口</text>
<rect id="filter" x="940" y="240" width="260" height="150" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8"/>
<text x="1070.0" y="306.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="filter">现有失效过滤</text>
<text x="1070.0" y="344.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="filter">关联 CVA6 L1D</text>
<rect id="split" x="1300" y="240" width="220" height="150" fill="#F5E1C9" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1410.0" y="306.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="split">地址分流</text>
<text x="1410.0" y="344.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="split">普通 / GB</text>
<rect id="converter" x="700" y="430" width="400" height="120" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8"/>
<text x="900.0" y="481.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="converter">Ara 普通路径宽度适配</text>
<text x="900.0" y="519.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="converter">32 × NrLanes → 64-bit</text>
<rect id="interrupt" x="440" y="470" width="190" height="90" fill="#E8DFED" stroke="#29292D" stroke-width="1.8"/>
<text x="535.0" y="506.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="interrupt">外部中断</text>
<text x="535.0" y="544.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="interrupt">PLIC / CLIC</text>
<rect id="npu" x="1820" y="235" width="280" height="150" fill="#F1D7D9" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1960.0" y="301.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="npu">NPU 计算</text>
<text x="1960.0" y="339.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="npu">GB 数据读写</text>
<rect id="mover" x="2180" y="235" width="280" height="150" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="2320.0" y="301.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="mover">DDR ↔ GB 搬运器</text>
<text x="2320.0" y="339.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="mover">引擎实现待定</text>
<rect id="device-regs" x="1820" y="480" width="640" height="80" fill="#E8DFED" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="2140.0" y="530.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="device-regs">NPU / 搬运器控制与完成状态</text>
<rect id="xbar" x="110" y="690" width="1430" height="120" fill="#F5E1C9" stroke="#29292D" stroke-width="1.8"/>
<text x="825.0" y="741.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="xbar">主 AXI Xbar · 64-bit</text>
<text x="825.0" y="779.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="xbar">普通内存、寄存器与外部存储目标</text>
<rect id="arbiter" x="1810" y="680" width="650" height="150" fill="#D9EEE8" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="2135.0" y="727.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="arbiter">GB 多入口适配 / 仲裁 / bank 调度</text>
<text x="2135.0" y="765.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="arbiter">位宽、ID、字节选通；按需 CDC</text>
<text x="2135.0" y="803.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="arbiter">逻辑入口数不等于 SRAM 物理端口数</text>
<rect id="sram" x="1860" y="960" width="570" height="160" fill="#D9EEE8" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="2145.0" y="1012.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="sram">GB SRAM</text>
<text x="2145.0" y="1050.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="sram">独立物理存储 · 容量 / bank / 端口待定</text>
<text x="2145.0" y="1088.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="sram">CPU 可达时建议不缓存、不可执行</text>
<rect id="regext" x="110" y="960" width="320" height="120" fill="#E8DFED" stroke="#29292D" stroke-width="1.8"/>
<text x="270.0" y="1011.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="regext">Reg 扩展配置路径</text>
<text x="270.0" y="1049.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="regext">AXI → Reg → RegExt</text>
<rect id="atomics" x="650" y="940" width="300" height="100" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8"/>
<text x="800.0" y="981.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="atomics">现有原子适配</text>
<text x="800.0" y="1019.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="atomics">普通内存路径</text>
<rect id="llc" x="650" y="1130" width="300" height="120" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8"/>
<text x="800.0" y="1181.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="llc">LLC / SPM</text>
<text x="800.0" y="1219.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="llc">预留 SPM 可作结果暂存</text>
<rect id="merge" x="1050" y="1130" width="270" height="120" fill="#F5E1C9" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1185.0" y="1181.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="merge">DDR 合流边界</text>
<text x="1185.0" y="1219.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="merge">端口 / 适配待定</text>
<rect id="ddr-controller" x="1420" y="1130" width="300" height="120" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8" stroke-dasharray="10 7"/>
<text x="1570.0" y="1181.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="ddr-controller">Controller / PHY</text>
<text x="1570.0" y="1219.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="ddr-controller">AXI4 接入</text>
<rect id="ddr" x="1830" y="1190" width="280" height="100" fill="#D8E8F4" stroke="#29292D" stroke-width="1.8"/>
<text x="1970.0" y="1231.0" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="ddr">DDR</text>
<text x="1970.0" y="1269.0" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="ddr">外部主存</text>
<text x="1170" y="890" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#606773">CPU 标量端无 GB 数据出口</text>
<text x="1170" y="932" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#606773">GB 窗口不在主 Xbar 上映射</text>
<text x="280" y="449" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#314D66">64-bit</text>
<text x="485" y="264" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="middle" fill="#765489">RVV</text>
<text x="485" y="324" font-family="WenQuanYi Zen Hei" font-size="22" font-weight="400" text-anchor="middle" fill="#765489">指令 / 结果</text>
<text x="1010" y="417" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#314D66">32 × NrLanes</text>
<text x="1180" y="474" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#314D66">普通地址</text>
<text x="920" y="579" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#314D66">64-bit</text>
<text x="1580" y="300" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#187C78">GB 地址</text>
<text x="1680" y="713" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#187C78">Ara GB</text>
<text x="2160" y="900" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#187C78">bank 读写服务</text>
<text x="820" y="884" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#314D66">主存 / SPM</text>
<text x="1740" y="1323" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#314D66">搬运器 DDR 主口 · 绕过 LLC</text>
<text x="280" y="905" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="400" text-anchor="start" fill="#765489">配置访问</text>
<text x="1120" y="632" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="start" fill="#765489">RegExt 配置 / 状态访问</text>
<text x="1120" y="585" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="start" fill="#A05255">完成 / 错误 IRQ</text>
<text x="60" y="1378" font-family="WenQuanYi Zen Hei" font-size="26" font-weight="400" text-anchor="start" fill="#29292D">蓝灰：普通访存    绿：GB 访存    紫：指令 / 配置    暗红：完成通知    橙：方案二新增主机通路</text>
<text x="60" y="1418" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#606773">箭头表示请求方向，存储响应省略；RVV 双向线含结果。跳线处不连接。虚线框为规划部件；均未实施。</text>
