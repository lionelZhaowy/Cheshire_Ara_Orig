<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945">
<title>③ 分配策略与设备缓存：区分两个分类维度</title>
<defs>
<marker id="data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#314D66"/></marker>
<marker id="control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#765489"/></marker>
<marker id="local" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#187C78"/></marker>
</defs>
<rect id="background" x="0" y="0" width="1680" height="945" fill="#FFFFFF" stroke="none"/>
<text x="50" y="54" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="700" text-anchor="start" fill="#29292D">③ 分配策略与设备缓存：区分两个分类维度</text>
<text x="50" y="96" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#606773">同一布局：左侧为 CPU 缓存层次，右侧为设备；沿绿线比较设备接入位置。</text>
<rect id="Epanel" x="25" y="130" width="800" height="740" fill="#F5FAF7" stroke="#29292D" stroke-width="1.7"/>
<text x="50" y="167" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="start" fill="#29292D">E  I/O 一致性 · 不分配 LLC</text>
<text x="50" y="206" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#187C78">逐事务协调机制；供文献比较</text>
<rect id="Ecpu" x="85" y="240" width="200" height="55" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="185.0" y="277.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Ecpu">CPU</text>
<rect id="Eprivate" x="85" y="350" width="200" height="85" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="185.0" y="385.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Eprivate">L1 / L2</text>
<text x="185.0" y="420.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Eprivate">写缓冲</text>
<rect id="Ellc" x="85" y="560" width="200" height="85" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="185.0" y="595.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Ellc">LLC</text>
<text x="185.0" y="630.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Ellc">系统侧缓存</text>
<rect id="Eddr" x="85" y="710" width="680" height="60" fill="#E8DFED" stroke="#29292D" stroke-width="1.7"/>
<text x="425.0" y="750.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Eddr">内存接入 / DDR</text>
<rect id="Edevice" x="545" y="240" width="220" height="95" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="655.0" y="280.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Edevice">加速器</text>
<text x="655.0" y="315.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Edevice">独立本地 SRAM</text>
<rect id="Edma" x="545" y="375" width="220" height="55" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="655.0" y="412.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Edma">DMA</text>
<polyline id="Ecpu-private" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="185,295 185,350"/>
<polyline id="Eprivate-llc" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="185,435 185,560"/>
<polyline id="Ellc-ddr" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="185,645 185,710"/>
<polyline id="Elocal-dma" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="655,335 655,375"/>
<polyline id="Edma-fabric" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="655,430 655,560"/>
<rect id="Efabric" x="465" y="560" width="300" height="85" fill="#F5E1C9" stroke="#29292D" stroke-width="1.7" stroke-dasharray="9 6"/>
<text x="615.0" y="595.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Efabric">一致性协调点</text>
<text x="615.0" y="630.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Efabric">设备不分配 LLC</text>
<polyline id="Edevice-ddr" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="615,645 615,710"/>
<polyline id="Eprobe-private" fill="none" stroke="#765489" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)" points="465,575 350,575 350,400 285,400"/>
<polyline id="Eprobe-llc" fill="none" stroke="#765489" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)" points="465,622 285,622"/>
<text x="50" y="813" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#29292D">逐事务协调；设备不分配 LLC 行</text>
<text x="50" y="845" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#29292D">本项目沿用旁路拓扑，采用软件范围交接</text>
<rect id="Fpanel" x="855" y="130" width="800" height="740" fill="#FAFBFC" stroke="#29292D" stroke-width="1.7"/>
<text x="880" y="167" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="700" text-anchor="start" fill="#29292D">F  完整缓存代理一致性</text>
<text x="880" y="206" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#606773">设备持有可探测的私有缓存；本项目不采用</text>
<rect id="Fcpu" x="915" y="240" width="200" height="55" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="1015.0" y="277.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fcpu">CPU</text>
<rect id="Fprivate" x="915" y="350" width="200" height="85" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="1015.0" y="385.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fprivate">L1 / L2</text>
<text x="1015.0" y="420.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Fprivate">写缓冲</text>
<rect id="Fllc" x="915" y="560" width="200" height="85" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="1015.0" y="595.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fllc">LLC</text>
<text x="1015.0" y="630.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Fllc">系统侧缓存</text>
<rect id="Fddr" x="915" y="710" width="680" height="60" fill="#E8DFED" stroke="#29292D" stroke-width="1.7"/>
<text x="1255.0" y="750.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fddr">内存接入 / DDR</text>
<rect id="Fdevice" x="1375" y="240" width="220" height="95" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="1485.0" y="280.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fdevice">加速器</text>
<text x="1485.0" y="315.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Fdevice">独立本地 SRAM</text>
<rect id="Fdma" x="1375" y="375" width="220" height="55" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="1485.0" y="412.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fdma">DMA</text>
<polyline id="Fcpu-private" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="1015,295 1015,350"/>
<polyline id="Fprivate-llc" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="1015,435 1015,560"/>
<polyline id="Fllc-ddr" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)" points="1015,645 1015,710"/>
<polyline id="Flocal-dma" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="1485,335 1485,375"/>
<rect id="Fdevcache" x="1375" y="470" width="220" height="55" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="1485.0" y="507.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Fdevcache">设备私有缓存</text>
<polyline id="Fdma-cache" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="1485,430 1485,470"/>
<polyline id="Fcache-fabric" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="1485,525 1485,560"/>
<rect id="Ffabric" x="1295" y="560" width="300" height="85" fill="#F5E1C9" stroke="#29292D" stroke-width="1.7"/>
<text x="1445.0" y="595.5" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="Ffabric">一致性互连</text>
<text x="1445.0" y="630.5" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="Ffabric">多缓存代理</text>
<polyline id="Fdevice-llc" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" marker-start="url(#local)" points="1295,587 1115,587"/>
<polyline id="Fprobe-private" fill="none" stroke="#765489" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)" points="1295,575 1180,575 1180,400 1115,400"/>
<polyline id="Fprobe-llc" fill="none" stroke="#765489" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)" points="1295,622 1115,622"/>
<polyline id="Fprobe-devcache" fill="none" stroke="#765489" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)" points="1595,620 1630,620 1630,498 1595,498"/>
<text x="880" y="813" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#29292D">设备私有缓存也接收探测并返回数据</text>
<text x="880" y="845" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#29292D">本地 SRAM 仍显式管理；分配策略另设</text>
<text x="30" y="916" font-family="WenQuanYi Zen Hei" font-size="23" font-weight="400" text-anchor="start" fill="#29292D">蓝灰：CPU 常规访存    绿色：设备访问 / 数据    紫色：维护 / 探测与确认（双向合并）</text>
</svg>
