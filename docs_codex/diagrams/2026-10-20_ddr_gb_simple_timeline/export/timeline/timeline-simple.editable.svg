<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1600.0" height="900.0" viewBox="0.0 0.0 1600.0 900.0">
  <defs>
    <marker id="next" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#314D66" />
    </marker>
  </defs>
  <rect fill="#FFFFFF" stroke="none" stroke-width="1" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" x="0" y="0" width="1600" height="900" rx="0.0" ry="0.0" id="rect-001" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="36" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="53" id="text-002">一次推理的两次数据交接</text>
  <rect fill="#F1D7D9" stroke="#29292D" stroke-width="1.7" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="stage-1" x="180" y="100" width="1240" height="120" rx="0.0" ry="0.0" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="29" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="132" data-owner="stage-1" id="text-004">CPU／Ara 准备输入</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="180" data-owner="stage-1" id="text-005">计算结束，交出输入与输出范围</text>
  <line fill="none" stroke="#314D66" stroke-width="2.8" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="url(#next)" id="next-1" x1="800" y1="220" x2="800" y2="244" />
  <rect fill="#E8DFED" stroke="#29292D" stroke-width="1.7" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="stage-2" x="180" y="244" width="1240" height="120" rx="0.0" ry="0.0" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="29" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="276" data-owner="stage-2" id="text-008">交接前同步</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="310" data-owner="stage-2" id="text-009">先排空旧事务，再清理输入、清理并失效输出</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="348" data-owner="stage-2" id="text-010">确认设备端口可见，允许启动搬运</text>
  <line fill="none" stroke="#314D66" stroke-width="2.8" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="url(#next)" id="next-2" x1="800" y1="364" x2="800" y2="388" />
  <rect fill="#D9EEE8" stroke="#29292D" stroke-width="1.7" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="stage-3" x="180" y="388" width="1240" height="120" rx="0.0" ry="0.0" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="29" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="420" data-owner="stage-3" id="text-013">设备执行</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="468" data-owner="stage-3" id="text-014">DDR → GB → NPU 计算 → 结果从 GB 写回 DDR</text>
  <line fill="none" stroke="#314D66" stroke-width="2.8" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="url(#next)" id="next-3" x1="800" y1="508" x2="800" y2="532" />
  <rect fill="#E8DFED" stroke="#29292D" stroke-width="1.7" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="stage-4" x="180" y="532" width="1240" height="120" rx="0.0" ry="0.0" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="29" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="564" data-owner="stage-4" id="text-017">交回 CPU 前同步</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="598" data-owner="stage-4" id="text-018">确认写回成功且 CPU 端口可见</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="636" data-owner="stage-4" id="text-019">处理相关回填，再失效 L1D／LLC 输出副本</text>
  <line fill="none" stroke="#314D66" stroke-width="2.8" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="url(#next)" id="next-4" x1="800" y1="652" x2="800" y2="676" />
  <rect fill="#F1D7D9" stroke="#29292D" stroke-width="1.7" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="stage-5" x="180" y="676" width="1240" height="120" rx="0.0" ry="0.0" />
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="29" font-weight="bold" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="708" data-owner="stage-5" id="text-022">CPU 读取结果并后处理</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="756" data-owner="stage-5" id="text-023">同步成功后重新取得输出使用权</text>
  <text fill="#29292D" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="24" font-weight="normal" font-style="normal" text-anchor="middle" stroke-dasharray="none" marker-start="none" marker-end="none" x="800" y="850" id="text-024">箭头表示先后顺序；每个阶段成功后才进入下一阶段。</text>
</svg>