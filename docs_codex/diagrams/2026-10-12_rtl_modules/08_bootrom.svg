<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<rect x="0" y="0" width="1800" height="980" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">08  BootROM：组合 ROM 内容与 Regbus 应答延迟</text>
<rect x="365" y="155" width="1375" height="565" fill="#FFFFFF" stroke="#9DAABA" stroke-width="2" stroke-dasharray="9 6"/>
<text x="380" y="185" font-family="WenQuanYi Zen Hei" font-size="23" fill="#56697F" text-anchor="start">Cfg.Bootrom 生成分支；clk_i / rst_ni</text>
<text x="45" y="280" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="start">Regbus 32</text>
<rect x="405" y="230" width="345" height="195" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="577.5" y="271.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  reg_to_mem</text>
<text x="577.5" y="303.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">地址截为 16-bit</text>
<text x="577.5" y="335.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">req / we / addr</text>
<text x="577.5" y="367.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">gnt = req</text>
<text x="577.5" y="399.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">rvalid / rerror 返回</text>
<polyline points="50,330 405,330" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="405,330 393.0,325.0 393.0,335.0" fill="#28699B"/>
<polygon points="50,330 62.0,335.0 62.0,325.0" fill="#28699B"/>
<rect x="900" y="220" width="400" height="195" fill="#F2EEF8" stroke="#23354B" stroke-width="2"/>
<line x1="912" y1="220" x2="912" y2="415" stroke="#23354B" stroke-width="1.5"/>
<text x="1100.0" y="261.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  cheshire_bootrom</text>
<text x="1100.0" y="293.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">word = addr / 4</text>
<text x="1100.0" y="325.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">case(word) → data[31:0]</text>
<text x="1100.0" y="357.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">当前生成内容：2048 words</text>
<text x="1100.0" y="389.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">组合查表；clk / rst 未用</text>
<polyline points="750,280 900,280" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="900,280 888.0,275.0 888.0,285.0" fill="#28699B"/>
<rect x="1440" y="220" width="245" height="195" fill="#F2EEF8" stroke="#23354B" stroke-width="2"/>
<line x1="1452" y1="220" x2="1452" y2="415" stroke="#23354B" stroke-width="1.5"/>
<text x="1562.5" y="277.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  FF 延迟对齐</text>
<text x="1562.5" y="309.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">data_q ← data</text>
<text x="1562.5" y="341.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">req_q ← req</text>
<text x="1562.5" y="373.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">we_q ← we</text>
<polyline points="1300,280 1440,280" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1440,280 1428.0,275.0 1428.0,285.0" fill="#28699B"/>
<polyline points="750,380 815,380 815,480 1560,480 1560,415" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="1560,415 1555.0,427.0 1565.0,427.0" fill="#9C5B25"/>
<text x="1020" y="468" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="start">req / we 同步延迟</text>
<polyline points="1440,350 1370,350 1370,595 585,595 585,425" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="585,425 580.0,437.0 590.0,437.0" fill="#28699B"/>
<text x="835" y="575" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">rdata = data_q；rvalid = req_q；rerror = we_q</text>
<text x="60" y="795" font-family="WenQuanYi Zen Hei" font-size="26" fill="#23354B" text-anchor="start">软件源 .S / .c → 链接与 ROM 生成脚本 → cheshire_bootrom.sv 常量内容</text>
<text x="60" y="851" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">写访问返回错误；16-bit 接口窗口不等于 64 KiB 唯一 ROM 内容。</text>
<polyline points="42,940 118,940" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="118,940 106.0,935.0 106.0,945.0" fill="#28699B"/>
<text x="130" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">数据 / 请求；双箭头含返回</text>
<polyline points="575,940 655,940" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="655,940 643.0,935.0 643.0,945.0" fill="#9C5B25"/>
<text x="667" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">配置 / 控制（标注 IRQ、使能时按标签）</text>
<text x="1270" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">编号与正文逐块对应</text>
</svg>