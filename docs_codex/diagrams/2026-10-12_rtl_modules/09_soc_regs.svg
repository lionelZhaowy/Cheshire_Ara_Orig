<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<rect x="0" y="0" width="1800" height="980" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">09  SoC Regs：软件 scratch 与只读硬件能力信息</text>
<rect x="40" y="340" width="310" height="160" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="195.0" y="396.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">Regbus 32 请求</text>
<text x="195.0" y="428.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">addr / write / wstrb</text>
<text x="195.0" y="460.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">wdata / valid</text>
<rect x="480" y="195" width="430" height="185" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="695.0" y="247.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  地址与访问译码</text>
<text x="695.0" y="279.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">cheshire_reg_top</text>
<text x="695.0" y="311.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">reg_we / reg_re</text>
<text x="695.0" y="343.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">字节写使能 / 未命中错误</text>
<polyline points="350,400 410,400 410,285 480,285" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="480,285 468.0,280.0 468.0,290.0" fill="#28699B"/>
<rect x="1100" y="155" width="615" height="165" fill="#F2EEF8" stroke="#23354B" stroke-width="2"/>
<line x1="1112" y1="155" x2="1112" y2="320" stroke="#23354B" stroke-width="1.5"/>
<text x="1407.5" y="213.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  scratch[0…15]</text>
<text x="1407.5" y="245.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">prim_subreg：16 × 32-bit RW</text>
<text x="1407.5" y="277.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">保存软件数据；复位为 0；不是 SRAM</text>
<polyline points="910,250 1100,250" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1100,250 1088.0,245.0 1088.0,255.0" fill="#28699B"/>
<rect x="1100" y="460" width="615" height="195" fill="#E8F2EA" stroke="#23354B" stroke-width="2"/>
<text x="1407.5" y="501.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  硬件只读字段</text>
<text x="1407.5" y="533.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">boot_mode_i；RtcFreq；PlatformRom</text>
<text x="1407.5" y="565.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">NumIntHarts；HW_FEATURES；LLC_SIZE</text>
<text x="1407.5" y="597.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">VGA RGB 位宽</text>
<text x="1407.5" y="629.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">来自 SoC 的 hw2reg 连线</text>
<rect x="480" y="630" width="430" height="155" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="695.0" y="683.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">4  读回选择 / 响应</text>
<text x="695.0" y="715.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">rdata = 地址选中值</text>
<text x="695.0" y="747.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ready = 1；error = 非法访问</text>
<polyline points="1200,320 1200,395 970,395 970,680 910,680" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="910,680 922.0,685.0 922.0,675.0" fill="#28699B"/>
<polyline points="1100,570 1020,570 1020,735 910,735" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="910,735 922.0,740.0 922.0,730.0" fill="#28699B"/>
<polyline points="690,380 690,630" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="690,630 695.0,618.0 685.0,618.0" fill="#9C5B25"/>
<polyline points="480,710 195,710 195,500" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="195,500 190.0,512.0 200.0,512.0" fill="#28699B"/>
<text x="45" y="793" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">rdata / error / ready</text>
<text x="60" y="865" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">功能位描述当前综合配置，不是动态电源开关，也不是 PLL 或 DDR 初始化控制器。</text>
<polyline points="42,940 118,940" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="118,940 106.0,935.0 106.0,945.0" fill="#28699B"/>
<text x="130" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">数据 / 请求；双箭头含返回</text>
<polyline points="575,940 655,940" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="655,940 643.0,935.0 643.0,945.0" fill="#9C5B25"/>
<text x="667" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">配置 / 控制（标注 IRQ、使能时按标签）</text>
<text x="1270" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">编号与正文逐块对应</text>
</svg>