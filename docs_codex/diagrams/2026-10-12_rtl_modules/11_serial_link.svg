<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<rect x="0" y="0" width="1800" height="980" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">11  Serial Link：AXI 通道编码、流控与源同步物理传输</text>
<rect x="40" y="185" width="335" height="190" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="207.5" y="224.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  SoC 外层适配</text>
<text x="207.5" y="256.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">出站地址 domain / mask</text>
<text x="207.5" y="288.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">axi_id_remap</text>
<text x="207.5" y="320.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AMO 标记适配</text>
<text x="207.5" y="352.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">对端入站 → 本地 AXI</text>
<rect x="500" y="185" width="365" height="190" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="682.5" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  serial_link_network</text>
<text x="682.5" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AXI AW / W / B / AR / R</text>
<text x="682.5" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">通道仲裁 / 封装 / 还原</text>
<text x="682.5" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AXI ↔ payload stream</text>
<polyline points="375,280 500,280" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="500,280 488.0,275.0 488.0,285.0" fill="#28699B"/>
<polygon points="375,280 387.0,285.0 387.0,275.0" fill="#28699B"/>
<rect x="1000" y="185" width="345" height="190" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="1172.5" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  serial_link_data_link</text>
<text x="1172.5" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">接收缓冲 / 流控</text>
<text x="1172.5" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">payload 拆分 / 重组</text>
<text x="1172.5" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">raw mode 支路</text>
<polyline points="865,280 1000,280" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1000,280 988.0,275.0 988.0,285.0" fill="#28699B"/>
<polygon points="865,280 877.0,285.0 877.0,275.0" fill="#28699B"/>
<rect x="1440" y="195" width="320" height="170" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="1600.0" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">4  channel_allocator</text>
<text x="1600.0" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">NumChannels &gt; 1 时</text>
<text x="1600.0" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">分配与还原通道</text>
<text x="1600.0" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">单通道直接连接</text>
<polyline points="1345,280 1440,280" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1440,280 1428.0,275.0 1428.0,285.0" fill="#28699B"/>
<polygon points="1345,280 1357.0,285.0 1357.0,275.0" fill="#28699B"/>
<rect x="1260" y="600" width="475" height="180" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="1497.5" y="650.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">5  serial_link_physical × 通道</text>
<text x="1497.5" y="682.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">发送时钟分频 / 相位控制</text>
<text x="1497.5" y="714.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">DDR 引脚收发 / 接收跨域</text>
<text x="1497.5" y="746.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ddr_rcv_clk + ddr 数据 lanes</text>
<polyline points="1600,365 1600,600" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1600,600 1605.0,588.0 1595.0,588.0" fill="#28699B"/>
<polygon points="1600,365 1595.0,377.0 1605.0,377.0" fill="#28699B"/>
<polyline points="1485,780 1485,870" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1485,870 1490.0,858.0 1480.0,858.0" fill="#28699B"/>
<polygon points="1485,780 1480.0,792.0 1490.0,792.0" fill="#28699B"/>
<text x="1145" y="905" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">外部串行链路；此处 DDR 指双边沿传输</text>
<rect x="465" y="620" width="540" height="160" fill="#E8F2EA" stroke="#23354B" stroke-width="2"/>
<text x="735.0" y="660.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">6  serial_link_reg_top</text>
<text x="735.0" y="692.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">Regbus → 可选 reg_cdc → 配置</text>
<text x="735.0" y="724.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">TX clk_div / raw mode / FIFO 控制</text>
<text x="735.0" y="756.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">当前 SoC 的三路逻辑时钟都接 clk_i</text>
<polyline points="1005,695 1260,695" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="1260,695 1248.0,690.0 1248.0,700.0" fill="#9C5B25"/>
<polyline points="735,620 735,485 1170,485 1170,375" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="1170,375 1165.0,387.0 1175.0,387.0" fill="#9C5B25"/>
<text x="45" y="855" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">AXI 事务跨芯片传输，不是 UART，也不自动提供缓存一致性。</text>
<polyline points="42,940 118,940" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="118,940 106.0,935.0 106.0,945.0" fill="#28699B"/>
<text x="130" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">数据 / 请求；双箭头含返回</text>
<polyline points="575,940 655,940" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="655,940 643.0,935.0 643.0,945.0" fill="#9C5B25"/>
<text x="667" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">配置 / 控制（标注 IRQ、使能时按标签）</text>
<text x="1270" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">编号与正文逐块对应</text>
</svg>