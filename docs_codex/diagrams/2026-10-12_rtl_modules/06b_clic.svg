<text x="1237.5" y="292.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">pending / enable</text>
<text x="1237.5" y="324.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">level / priority / mode</text>
