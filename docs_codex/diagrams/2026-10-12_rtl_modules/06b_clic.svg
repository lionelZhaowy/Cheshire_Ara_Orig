<text x="45" y="565" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">Cfg.Clic 控制生成</text>
<polyline points="725,640 725,520 625,520 625,395" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
