<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<rect x="0" y="0" width="1800" height="980" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">15  CVA6 Trap：异步中断与同步异常在提交路径汇合</text>
<rect x="40" y="165" width="330" height="180" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="205.0" y="215.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  平台中断输入</text>
<text x="205.0" y="247.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">PLIC：irq_i（M / S）</text>
<text x="205.0" y="279.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">CLINT：time_irq_i / ipi_i</text>
<text x="205.0" y="311.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">可选 CLIC 握手</text>
<rect x="480" y="155" width="395" height="200" fill="#E8F2EA" stroke="#23354B" stroke-width="2"/>
<text x="677.5" y="199.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  csr_regfile</text>
<text x="677.5" y="231.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">pending / enable / 委托</text>
<text x="677.5" y="263.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">mip / mie / mstatus …</text>
<text x="677.5" y="295.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">trap 状态：epc / cause / tval</text>
<text x="677.5" y="327.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">trap_vector_base / eret</text>
<polyline points="370,245 480,245" fill="none" stroke="#765096" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="480,245 468.0,240.0 468.0,250.0" fill="#765096"/>
<rect x="1030" y="155" width="350" height="200" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="1205.0" y="199.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  decoder / id_stage</text>
<text x="1205.0" y="231.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">结合特权级与 IRQ 控制</text>
<text x="1205.0" y="263.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">选出可接受的中断</text>
<text x="1205.0" y="295.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">或生成译码异常</text>
<text x="1205.0" y="327.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">写入指令的 ex 信息</text>
<polyline points="875,245 1030,245" fill="none" stroke="#765096" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="1030,245 1018.0,240.0 1018.0,250.0" fill="#765096"/>
<rect x="1480" y="175" width="280" height="160" fill="#F2EEF8" stroke="#23354B" stroke-width="2"/>
<line x1="1492" y1="175" x2="1492" y2="335" stroke="#23354B" stroke-width="1.5"/>
<text x="1620.0" y="231.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">4  scoreboard</text>
<text x="1620.0" y="263.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">指令与结果关联</text>
<text x="1620.0" y="295.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ex 随指令保存</text>
<polyline points="1380,245 1480,245" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1480,245 1468.0,240.0 1468.0,250.0" fill="#28699B"/>
<rect x="1470" y="565" width="295" height="180" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="1617.5" y="615.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">5  commit_stage</text>
<text x="1617.5" y="647.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">按提交顺序选异常</text>
<text x="1617.5" y="679.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">阻止错误指令提交</text>
<text x="1617.5" y="711.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ex_commit → CSR</text>
<polyline points="1620,335 1620,565" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1620,565 1625.0,553.0 1615.0,553.0" fill="#28699B"/>
<rect x="980" y="580" width="330" height="155" fill="#EAF1F8" stroke="#23354B" stroke-width="2"/>
<text x="1145.0" y="633.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">执行 / 访存异常</text>
<text x="1145.0" y="665.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">非法操作 / 访问故障等</text>
<text x="1145.0" y="697.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">结果携带 exception_t</text>
<polyline points="1145,580 1145,440 1550,440 1550,335" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="1550,335 1545.0,347.0 1555.0,347.0" fill="#28699B"/>
<polyline points="1570,745 1570,805 930,805 930,400 775,400 775,355" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="775,355 770.0,367.0 780.0,367.0" fill="#28699B"/>
<text x="1090" y="837" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">ex_commit / PC</text>
<rect x="450" y="590" width="370" height="160" fill="#FFF0DB" stroke="#23354B" stroke-width="2"/>
<text x="635.0" y="630.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">6  controller + frontend</text>
<text x="635.0" y="662.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">flush 错误路径流水线</text>
<text x="635.0" y="694.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">PC 转向 trap 入口</text>
<text x="635.0" y="726.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">xRET 恢复返回 PC</text>
<polyline points="590,355 590,590" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="590,590 595.0,578.0 585.0,578.0" fill="#9C5B25"/>
<polyline points="450,665 60,665" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="60,665 72.0,670.0 72.0,660.0" fill="#28699B"/>
<text x="50" y="626" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">CPU 开始执行处理程序</text>
<text x="45" y="865" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">图中软件处理程序不在硬件中：保存现场、处理设备 / 控制器、恢复现场，再执行返回指令。</text>
<polyline points="42,940 118,940" fill="none" stroke="#28699B" stroke-width="2.5"/>
<polygon points="118,940 106.0,935.0 106.0,945.0" fill="#28699B"/>
<text x="130" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">数据 / 请求；双箭头含返回</text>
<polyline points="575,940 655,940" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-dasharray="8 5"/>
<polygon points="655,940 643.0,935.0 643.0,945.0" fill="#9C5B25"/>
<text x="667" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">配置 / 控制（标注 IRQ、使能时按标签）</text>
<text x="1270" y="946" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">编号与正文逐块对应</text>
</svg>