<text x="1250" y="242" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="start">SCK / CS 与移位节拍</text>
<text x="90" y="862" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">IRQ：ERROR / SPI_EVENT；片选数量、FIFO 深度和字节顺序以当前参数为准。</text>
