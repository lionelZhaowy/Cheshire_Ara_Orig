<text x="980.0" y="484.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">6  byte_select</text>
<text x="980.0" y="516.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">32-bit → 有效发送字节</text>
