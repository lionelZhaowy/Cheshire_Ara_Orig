<text x="1510.0" y="499.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">串 / 并转换</text>
<text x="1510.0" y="531.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">标准 / 双线 / 四线</text>
<text x="1510.0" y="563.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">SD[3:0] 输入 / 输出 / OE</text>
