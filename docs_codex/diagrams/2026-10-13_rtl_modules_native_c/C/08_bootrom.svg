  <rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#214E79" text-anchor="start">08  BootROM：组合 ROM 内容与 Regbus 应答延迟</text>
  <rect x="365" y="155" width="1375" height="565" fill="#F8FAFD" stroke="#A6B5C8" stroke-width="1.7" rx="12" />
  <text x="380" y="185" font-family="WenQuanYi Zen Hei" font-size="23" fill="#56697F" text-anchor="start">Cfg.Bootrom 生成分支；clk_i / rst_ni</text>
  <text x="45" y="280" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="start">Regbus 32</text>
  <rect x="405" y="230" width="345" height="195" fill="#EFF6FD" stroke="#346DA6" stroke-width="1.8" rx="8" />
  <rect x="408.0" y="233.0" width="339.0" height="48.5" fill="#346DA6" stroke="none" rx="5" />
  <text x="577.5" y="271.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">1  reg_to_mem</text>
  <text x="577.5" y="303.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">地址截为 16-bit</text>
  <text x="577.5" y="335.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">req / we / addr</text>
  <text x="577.5" y="367.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">gnt = req</text>
  <text x="577.5" y="399.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">rvalid / rerror 返回</text>
  <polyline id="E01" points="50,330 405,330" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" marker-start="url(#m28699B)" />
  <rect x="900" y="220" width="400" height="195" fill="#F6F1FB" stroke="#7552A1" stroke-width="1.8" rx="8" />
  <rect x="903.0" y="223.0" width="394.0" height="48.5" fill="#7552A1" stroke="none" rx="5" />
  <polyline points="912,220 912,415" fill="none" stroke="#23354B" stroke-width="2.5" stroke-linejoin="miter" />
  <text x="1100.0" y="261.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">2  cheshire_bootrom</text>
  <text x="1100.0" y="293.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">word = addr / 4</text>
  <text x="1100.0" y="325.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">case(word) → data[31:0]</text>
  <text x="1100.0" y="357.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">当前生成内容：2048 words</text>
  <text x="1100.0" y="389.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">组合查表；clk / rst 未用</text>
  <polyline id="E02" points="750,280 900,280" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <rect x="1440" y="220" width="245" height="195" fill="#F6F1FB" stroke="#7552A1" stroke-width="1.8" rx="8" />
  <rect x="1443.0" y="223.0" width="239.0" height="64.5" fill="#7552A1" stroke="none" rx="5" />
  <polyline points="1452,220 1452,415" fill="none" stroke="#23354B" stroke-width="2.5" stroke-linejoin="miter" />
  <text x="1562.5" y="277.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">3  FF 延迟对齐</text>
  <text x="1562.5" y="309.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">data_q ← data</text>
  <text x="1562.5" y="341.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">req_q ← req</text>
  <text x="1562.5" y="373.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">we_q ← we</text>
  <polyline id="E03" points="1300,280 1440,280" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <polyline id="E04" points="750,380 815,380 815,480 1560,480 1560,415" fill="none" stroke="#9C5B25" stroke-width="2.8" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m9C5B25)" />
  <text x="1020" y="468" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="start">req / we 同步延迟</text>
  <polyline id="E05" points="1440,350 1370,350 1370,595 585,595 585,425" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <text x="835" y="575" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">rdata = data_q；rvalid = req_q；rerror = we_q</text>
  <text x="60" y="795" font-family="WenQuanYi Zen Hei" font-size="26" fill="#23354B" text-anchor="start">软件源 .S / .c → 链接与 ROM 生成脚本 → cheshire_bootrom.sv 常量内容</text>
  <text x="60" y="851" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">写访问返回错误；16-bit 接口窗口不等于 64 KiB 唯一 ROM 内容。</text>
  <rect x="202.5" y="299.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="227.0" y="320.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E01</text>
  <rect x="800.0" y="249.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="824.5" y="270.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E02</text>
  <rect x="1345.0" y="249.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="1369.5" y="270.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E03</text>
  <rect x="1162.5" y="487.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="1187.0" y="508.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="middle" font-weight="bold">E04</text>
  <rect x="952.5" y="602.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="977.0" y="623.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E05</text>
  <text x="40" y="1000" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">E 编号对应图下连接表；总线双箭头合并请求/响应；单箭头含义以表为准。</text>
  <text x="40" y="1028" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">虚线连线表示控制/事件；虚线模块表示规划。交叉无圆点不连接。C：连续走线。</text>
</svg>