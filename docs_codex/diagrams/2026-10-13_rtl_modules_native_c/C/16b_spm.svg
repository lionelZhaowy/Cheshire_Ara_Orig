  <rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#214E79" text-anchor="start">16B  LLC / SPM：相同 SRAM 的 way 分配与配置提交</text>
  <rect x="40" y="175" width="390" height="190" fill="#EFF8F3" stroke="#317E69" stroke-width="1.8" rx="8" />
  <rect x="43.0" y="178.0" width="384.0" height="46.0" fill="#317E69" stroke="none" rx="5" />
  <text x="235.0" y="214.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">1  axi_llc_reg_top</text>
  <text x="235.0" y="246.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">CFG_SPM / CFG_FLUSH</text>
  <text x="235.0" y="278.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">COMMIT_CFG / FLUSHED</text>
  <text x="235.0" y="310.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">BIST / 容量 / 版本</text>
  <text x="235.0" y="342.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">当前控制接口：Regbus</text>
  <rect x="590" y="175" width="430" height="190" fill="#FFF8EB" stroke="#966017" stroke-width="1.8" rx="8" />
  <rect x="593.0" y="178.0" width="424.0" height="46.0" fill="#966017" stroke="none" rx="5" />
  <text x="805.0" y="214.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">2  axi_llc_config</text>
  <text x="805.0" y="246.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">提交新配置 / 停止接收新事务</text>
  <text x="805.0" y="278.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">等待在途工作 / 发 flush 描述符</text>
  <text x="805.0" y="310.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">必要时写回脏行</text>
  <text x="805.0" y="342.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">更新 spm_lock / flushed</text>
  <polyline id="E01" points="430,260 590,260" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" marker-start="url(#m28699B)" />
