  <text x="1560.0" y="702.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">相同 data SRAM</text>
  <polyline id="E03" points="1420,365 1420,515" fill="none" stroke="#9C5B25" stroke-width="2.8" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m9C5B25)" />
  <text x="70" y="580" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">SoC 的 SPM 地址别名</text>
  <text x="70" y="630" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">AmSpm / AmSpmBaseUncached</text>
  <text x="70" y="680" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">外层地址重映射到同一存储</text>
  <text x="70" y="730" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="start">CPU 缓存属性需另外匹配</text>
  <text x="45" y="865" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">LLC/SPM 不是独立 Global Buffer；DDR 旁路 master 也不会自动窥探 CPU / LLC 中的脏数据。</text>
  <rect x="485.0" y="229.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="509.5" y="250.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E01</text>
