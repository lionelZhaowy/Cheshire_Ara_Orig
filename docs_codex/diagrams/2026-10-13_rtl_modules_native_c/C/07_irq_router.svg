  <rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#214E79" text-anchor="start">07  IRQ Router：每条源中断对应一个目标位掩码</text>
  <rect x="45" y="180" width="315" height="180" fill="#EFF6FD" stroke="#346DA6" stroke-width="1.8" rx="8" />
  <rect x="48.0" y="183.0" width="309.0" height="57.0" fill="#346DA6" stroke="none" rx="5" />
  <text x="202.5" y="230.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">1  intr 源向量</text>
  <text x="202.5" y="262.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">片内外设 IRQ</text>
  <text x="202.5" y="294.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">外部 IRQ 经 sync</text>
  <text x="202.5" y="326.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">源 0 固定为 0</text>
  <rect x="485" y="195" width="330" height="145" fill="#EFF6FD" stroke="#346DA6" stroke-width="1.8" rx="8" />
  <rect x="488.0" y="198.0" width="324.0" height="55.5" fill="#346DA6" stroke="none" rx="5" />
  <text x="650.0" y="243.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">2  irqs_cloned</text>
  <text x="650.0" y="275.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">每个目标一份源向量</text>
  <text x="650.0" y="307.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">组合逻辑复制</text>
  <polyline id="E01" points="360,270 485,270" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <rect x="1000" y="180" width="285" height="180" fill="#FFF8EB" stroke="#966017" stroke-width="1.8" rx="8" />
  <rect x="1003.0" y="183.0" width="279.0" height="57.0" fill="#966017" stroke="none" rx="5" />
  <text x="1142.5" y="230.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">3  按位 AND</text>
  <text x="1142.5" y="262.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">out[target][source]</text>
  <text x="1142.5" y="294.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">= src[source]</text>
  <text x="1142.5" y="326.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">&amp; mask[source][target]</text>
  <polyline id="E02" points="815,270 1000,270" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <polyline id="E03" points="1285,225 1415,225" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <polyline id="E04" points="1285,275 1415,275" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <polyline id="E05" points="1285,325 1415,325" fill="none" stroke="#28699B" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#m28699B)" />
  <text x="1435" y="231" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">target 0 → PLIC</text>
  <text x="1435" y="281" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">target 1… → 各 hart CLIC</text>
  <text x="1435" y="331" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">后续 target → 外部输出</text>
  <rect x="450" y="595" width="470" height="195" fill="#EFF8F3" stroke="#317E69" stroke-width="1.8" rx="8" />
  <rect x="453.0" y="598.0" width="464.0" height="64.5" fill="#317E69" stroke="none" rx="5" />
  <text x="685.0" y="652.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">4  irq_router_reg_top × 源</text>
  <text x="685.0" y="684.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">每源一个 IRQ_TARGET_MASK</text>
  <text x="685.0" y="716.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">地址低位 addr[15:2] 选择源</text>
  <text x="685.0" y="748.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">复位 mask = 1：仅 target 0</text>
  <text x="455" y="548" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">Regbus 请求 / 响应</text>
  <polyline id="E06" points="920,690 1140,690 1140,360" fill="none" stroke="#9C5B25" stroke-width="2.8" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m9C5B25)" />
  <text x="1170" y="536" font-family="WenQuanYi Zen Hei" font-size="23" fill="#9C5B25" text-anchor="start">掩码重排为目标 × 源</text>
  <text x="55" y="870" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">当前默认 / FPGA 为 0；Cfg.IrqRouter = 0 时：绕过掩码，原始源向量复制给各目标；模块没有 pending 或优先级队列。</text>
