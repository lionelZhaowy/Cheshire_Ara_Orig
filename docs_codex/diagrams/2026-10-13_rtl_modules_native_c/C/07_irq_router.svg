  <text x="1106.5" y="532.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="middle" font-weight="bold">E06</text>
  <text x="40" y="1000" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">E 编号对应图下连接表；总线双箭头合并请求/响应；单箭头含义以表为准。</text>
  <text x="40" y="1028" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">虚线连线表示控制/事件；虚线模块表示规划。交叉无圆点不连接。C：连续走线。</text>
