  <rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7" />
  <text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#214E79" text-anchor="start">15  CVA6 Trap：异步中断与同步异常在提交路径汇合</text>
  <rect x="40" y="165" width="330" height="180" fill="#EFF6FD" stroke="#346DA6" stroke-width="1.8" rx="8" />
  <rect x="43.0" y="168.0" width="324.0" height="57.0" fill="#346DA6" stroke="none" rx="5" />
  <text x="205.0" y="215.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">1  平台中断输入</text>
  <text x="205.0" y="247.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">PLIC：irq_i（M / S）</text>
  <text x="205.0" y="279.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">CLINT：time_irq_i / ipi_i</text>
  <text x="205.0" y="311.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">可选 CLIC 握手</text>
  <rect x="480" y="155" width="395" height="200" fill="#EFF8F3" stroke="#317E69" stroke-width="1.8" rx="8" />
  <rect x="483.0" y="158.0" width="389.0" height="51.0" fill="#317E69" stroke="none" rx="5" />
  <text x="677.5" y="199.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">2  csr_regfile</text>
  <text x="677.5" y="231.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">pending / enable / 委托</text>
  <text x="677.5" y="263.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">mip / mie / mstatus …</text>
  <text x="677.5" y="295.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">trap 状态：epc / cause / tval</text>
  <text x="677.5" y="327.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">trap_vector_base / eret</text>
  <polyline id="E01" points="370,245 480,245" fill="none" stroke="#765096" stroke-width="2.8" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m765096)" />
