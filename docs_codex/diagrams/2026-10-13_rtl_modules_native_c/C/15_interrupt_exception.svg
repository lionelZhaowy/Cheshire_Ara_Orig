  <text x="1145.0" y="633.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">执行 / 访存异常</text>
  <text x="1145.0" y="665.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">非法操作 / 访问故障等</text>
  <text x="1145.0" y="697.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">结果携带 exception_t</text>
