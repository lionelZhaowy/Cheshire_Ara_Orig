  <text x="1617.5" y="647.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">按提交顺序选异常</text>
  <text x="1617.5" y="679.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">阻止错误指令提交</text>
  <text x="1617.5" y="711.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ex_commit → CSR</text>
