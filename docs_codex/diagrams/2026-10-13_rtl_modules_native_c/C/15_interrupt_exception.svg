  <text x="1620.0" y="247.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">/ scoreboard</text>
  <text x="1620.0" y="279.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">指令与结果关联</text>
  <text x="1620.0" y="311.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">ex 随指令保存</text>
