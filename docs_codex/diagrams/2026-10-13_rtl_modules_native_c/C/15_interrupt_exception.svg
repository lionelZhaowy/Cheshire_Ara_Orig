  <text x="1205.0" y="199.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#FFFFFF" text-anchor="middle">3  decoder / id_stage</text>
  <text x="1205.0" y="231.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">结合特权级与 IRQ 控制</text>
  <text x="1205.0" y="263.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">选出可接受的中断</text>
  <text x="1205.0" y="295.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">或生成译码异常</text>
  <text x="1205.0" y="327.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">写入指令的 ex 信息</text>
