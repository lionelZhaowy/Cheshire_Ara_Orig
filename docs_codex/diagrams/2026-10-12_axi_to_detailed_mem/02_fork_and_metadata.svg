<polygon points="585,590 596.0,594.5 596.0,585.5" fill="#925021"/>
<text x="680" y="622" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">meta_ready</text>
<polyline points="585,810 1000,810" fill="none" stroke="#925021" stroke-width="2.4" stroke-linejoin="miter" stroke-dasharray="8 5"/>
<polygon points="1000,810 989.0,805.5 989.0,814.5" fill="#925021"/>
<text x="680" y="797" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">sel_valid</text>
