<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
<rect x="0" y="0" width="1600" height="1130" fill="#FFFFFF"/>
<text x="40" y="43" font-family="WenQuanYi Zen Hei" font-size="28" fill="#253447" text-anchor="start">② 一项访问分成三条握手支路：执行请求、保存元数据、保存响应选择</text>
<text x="40" y="85" font-family="WenQuanYi Zen Hei" font-size="23" fill="#536174" text-anchor="start">实线 = 数据字段；虚线 = valid / ready。i_fork 无数据端口。</text>
<rect x="300" y="170" width="285" height="715" fill="#FBF4E9" stroke="#253447" stroke-width="2"/>
<text x="442" y="216" font-family="WenQuanYi Zen Hei" font-size="28" fill="#253447" text-anchor="middle">i_fork</text>
<text x="442" y="249" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">N_OUP = 3</text>
<text x="442" y="325" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">输入状态寄存器</text>
<text x="442" y="362" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">+ 三路输出状态</text>
<text x="442" y="516" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">记住哪些支路</text>
<text x="442" y="551" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">已接收当前项</text>
<text x="442" y="730" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="middle">三路各接收一次后</text>
<text x="442" y="766" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="middle">才确认上游完成</text>
<text x="50" y="391" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">来自 i_ax_mux</text>
<polyline points="50,425 300,425" fill="none" stroke="#925021" stroke-width="2.4" stroke-linejoin="miter" stroke-dasharray="8 5"/>
<polygon points="300,425 289.0,420.5 289.0,429.5" fill="#925021"/>
<text x="70" y="414" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">arb_valid</text>
