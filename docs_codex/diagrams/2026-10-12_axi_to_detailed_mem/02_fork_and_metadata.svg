<polygon points="585,320 596.0,324.5 596.0,315.5" fill="#925021"/>
<text x="680" y="352" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">m2s_req_ready</text>
<polyline points="585,540 1000,540" fill="none" stroke="#925021" stroke-width="2.4" stroke-linejoin="miter" stroke-dasharray="8 5"/>
<polygon points="1000,540 989.0,535.5 989.0,544.5" fill="#925021"/>
<text x="680" y="527" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">meta_valid</text>
