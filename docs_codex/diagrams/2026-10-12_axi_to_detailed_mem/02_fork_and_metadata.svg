<text x="680" y="892" font-family="WenQuanYi Zen Hei" font-size="24" fill="#925021" text-anchor="start">sel_ready</text>
<rect x="1000" y="225" width="310" height="125" fill="#F1F5F9" stroke="#253447" stroke-width="2"/>
<text x="1155.0" y="259" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">i_stream_to_mem</text>
<text x="1155.0" y="291" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">执行本拍请求</text>
<text x="1155.0" y="323" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">内部见图③</text>
<text x="1155" y="160" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">m2s_req（图①）</text>
<polyline points="1155,178 1155,225" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1155,225 1159.5,214.0 1150.5,214.0" fill="#205F9C"/>
<rect x="1000" y="485" width="310" height="130" fill="#EEF5EE" stroke="#253447" stroke-width="2"/>
<text x="1155.0" y="517" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">i_meta_buf</text>
<text x="1155.0" y="548" font-family="WenQuanYi Zen Hei" font-size="22" fill="#253447" text-anchor="middle">meta_t；深度 2</text>
<rect x="1025" y="577" width="260" height="23" fill="#FFFFFF" stroke="#253447" stroke-width="2"/>
<polyline points="1155.0,577 1155.0,600" fill="none" stroke="#253447" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="1155" y="425" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">meta（图①）</text>
<polyline points="1155,443 1155,485" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1155,485 1159.5,474.0 1150.5,474.0" fill="#205F9C"/>
<polyline points="1310,545 1470,545" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1470,545 1459.0,540.5 1459.0,549.5" fill="#205F9C"/>
<text x="1330" y="526" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">meta_buf</text>
<text x="1328" y="585" font-family="WenQuanYi Zen Hei" font-size="23" fill="#536174" text-anchor="start">供响应字段构造</text>
<rect x="1000" y="755" width="310" height="130" fill="#EEF5EE" stroke="#253447" stroke-width="2"/>
<text x="1155.0" y="787" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">i_sel_buf</text>
<text x="1155.0" y="818" font-family="WenQuanYi Zen Hei" font-size="22" fill="#253447" text-anchor="middle">logic[1:0]；深度 2</text>
<rect x="1025" y="847" width="260" height="23" fill="#FFFFFF" stroke="#253447" stroke-width="2"/>
<polyline points="1155.0,847 1155.0,870" fill="none" stroke="#253447" stroke-width="1.5" stroke-linejoin="miter"/>
<text x="1155" y="684" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">{sel_b, sel_r}</text>
<polyline points="1155,702 1155,755" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1155,755 1159.5,744.0 1150.5,744.0" fill="#205F9C"/>
<polyline points="1310,815 1470,815" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1470,815 1459.0,810.5 1459.0,819.5" fill="#205F9C"/>
<text x="1328" y="776" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">sel_buf_b</text>
<text x="1328" y="803" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">sel_buf_r</text>
<text x="1328" y="855" font-family="WenQuanYi Zen Hei" font-size="23" fill="#536174" text-anchor="start">供 R / B 握手选择</text>
<text x="40" y="961" font-family="WenQuanYi Zen Hei" font-size="25" fill="#253447" text-anchor="start">sel_b = meta.write &amp; meta.last</text>
<text x="40" y="1004" font-family="WenQuanYi Zen Hei" font-size="25" fill="#253447" text-anchor="start">sel_r = ~meta.write | meta.atop[5]</text>
<text x="770" y="961" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">普通读：(B,R) = (0,1)</text>
<text x="770" y="1004" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">普通写中间拍：(0,0)；最后拍：(1,0)</text>
<text x="40" y="1081" font-family="WenQuanYi Zen Hei" font-size="24" fill="#536174" text-anchor="start">三条支路可以分不同周期接收；FIFO 均为 fall-through，不代表固定延迟两拍。</text>
</svg>