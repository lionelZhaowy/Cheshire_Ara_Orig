<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>启动、时钟、复位与 CDC：先建立可执行条件</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">11  启动、时钟、复位与 CDC：先建立可执行条件</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">已有 Platform ROM 方向；安全时钟、早期存储和 ready 前提不能互相等待。</text><rect id="clk" x="55" y="210" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-3" x="220.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">上电 / RefClk</text><text id="text-4" x="220.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">安全时钟与复位</text><rect id="rom" x="440" y="210" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-5" x="605.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Boot ROM / LLC SPM</text><text id="text-6" x="605.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">可执行代码与早期栈</text><rect id="config" x="825" y="210" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-7" x="990.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Platform ROM / 固件</text><text id="text-8" x="990.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">PLL、PAD、必要 IP</text><rect id="ready" x="1210" y="210" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-9" x="1375.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR 训练 / ready</text><text id="text-10" x="1375.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">成功后允许 DDR 访问</text><line id="boot0" x1="385" y1="270" x2="440" y2="270" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="boot1" x1="770" y1="270" x2="825" y2="270" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="boot2" x1="1155" y1="270" x2="1210" y2="270" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="app" x="1210" y="470" width="330" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-11" x="1375.0" y="518.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">加载应用 / 切换运行</text><text id="text-12" x="1375.0" y="548.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">MMIO、IRQ、异常入口</text><line id="ddr-app" x1="1375" y1="330" x2="1375" y2="470" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="safe" x="55" y="470" width="430" height="110" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-13" x="270.0" y="518.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">PLL 不锁 / 训练失败 / 超时</text><text id="text-14" x="270.0" y="548.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">保持安全状态并报告</text><polyline id="ready-fail" points="1375,330 1375,395 270,395 270,470" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><rect id="runtime" x="630" y="660" width="910" height="125" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-15" x="1085.0" y="715.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">运行时调整：停新请求 → 排空 → 安全切钟 / 重配置 → 确认 → 恢复</text><text id="text-16" x="1085.0" y="745.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">CDC 数据用握手 / 异步 FIFO；复位释放与队列状态按域审查</text><polyline id="runtime-config" points="630,720 550,720 550,360 990,360 990,330" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="app-runtime" x1="1375" y1="580" x2="1375" y2="660" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-17" x="60" y="750" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#52677B" text-anchor="start">启用钩子前关闭返回路径缺陷；</text><text id="text-18" x="60" y="785" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#52677B" text-anchor="start">C 栈对齐需单独复核。</text><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-19" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-20" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-21" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-22" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-23" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">11 / 13</text></svg>
