<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>实时预算：平均吞吐之外还要保证最长等待</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">09  实时预算：平均吞吐之外还要保证最长等待</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">输入是否可背压、ROI 峰值、维护和压缩最坏情况决定缓冲深度。</text><rect id="input" x="55" y="205" width="300" height="120" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-3" x="205.0" y="258.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">LVDS / ISP 输入</text><text id="text-4" x="205.0" y="288.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">像素率与突发峰值</text><rect id="fifo" x="495" y="205" width="300" height="120" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-5" x="645.0" y="258.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">输入 FIFO</text><text id="text-6" x="645.0" y="288.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">按最长无服务间隔定深</text><rect id="ddr" x="965" y="190" width="560" height="150" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-7" x="1245.0" y="243.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">GB bank / 四口前端 / DDR</text><text id="text-8" x="1245.0" y="273.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">共享排队、仲裁、刷新与编解码</text><text id="text-9" x="1245.0" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">不同瓶颈分别建预算</text><line id="input-fifo" x1="355" y1="265" x2="495" y2="265" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><line id="fifo-service" x1="795" y1="265" x2="965" y2="265" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="load" x="965" y="440" width="560" height="110" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-10" x="1245.0" y="488.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">竞争负载：LLC + GB 搬运 + 帧 / ROI</text><text id="text-11" x="1245.0" y="518.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">维护写回、元数据、不可压缩与部分写放大</text><line id="competition" x1="1245" y1="440" x2="1245" y2="340" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="output" x="55" y="440" width="300" height="110" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-12" x="205.0" y="488.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">LVDS TX / 消费者</text><text id="text-13" x="205.0" y="518.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">欠载策略与输出期限</text><rect id="outfifo" x="495" y="440" width="300" height="110" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-14" x="645.0" y="488.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">输出 FIFO</text><text id="text-15" x="645.0" y="518.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">接收 ROI 解码数据</text><polyline id="service-output" points="965,310 870,310 870,495 795,495" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><line id="output-consume" x1="495" y1="495" x2="355" y2="495" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="budget" x="55" y="660" width="1470" height="130" rx="12" fill="#F1F4F7" stroke="#9AABBA" stroke-width="2"/><text id="text-16" x="790.0" y="703.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">FIFO 余量 ≥ 最坏区间内累计到达 - 累计服务 + 安全余量</text><text id="text-17" x="790.0" y="733.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">GB：权重 + 激活 + 中间结果 + 并行搬运；DDR：有效负载 + 所有放大项</text><text id="text-18" x="790.0" y="763.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">持续记录：各源延迟 / 最长等待 / 队列峰值 / 每帧期限是否满足</text><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-19" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-20" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-21" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-22" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-23" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">09 / 13</text></svg>
