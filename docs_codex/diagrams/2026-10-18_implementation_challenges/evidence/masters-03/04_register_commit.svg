<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>配置寄存器：数量来自行为契约</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">04  配置寄存器：数量来自行为契约</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">C1～C16 是功能组；寄存器数量、偏移、复位值与生效规则仍待冻结。</text><rect id="sw" x="65" y="215" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-3" x="230.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">驱动写入</text><text id="text-4" x="230.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">地址 / 尺寸 / 模式</text><rect id="shadow" x="440" y="215" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-5" x="605.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">待生效配置</text><text id="text-6" x="605.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">完整参数与版本</text><rect id="commit" x="815" y="215" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-7" x="980.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">提交 / 边界切换</text><text id="text-8" x="980.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">合法性 + busy 检查</text><rect id="active" x="1190" y="215" width="330" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-9" x="1355.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">活动配置</text><text id="text-10" x="1355.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">本帧 / 本任务快照</text><line id="cfg-0" x1="395" y1="275" x2="440" y2="275" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="cfg-1" x1="770" y1="275" x2="815" y2="275" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="cfg-2" x1="1145" y1="275" x2="1190" y2="275" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="execute" x="1190" y="475" width="330" height="120" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-11" x="1355.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">执行单元</text><text id="text-12" x="1355.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">不可看到半套新参数</text><line id="active-execute" x1="1355" y1="335" x2="1355" y2="475" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-13" x="1450" y="414" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#8161A8" text-anchor="middle">约定边界生效</text><rect id="status" x="620" y="475" width="380" height="120" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-14" x="810.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">状态 / 错误 / 任务身份</text><text id="text-15" x="810.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">DONE、IRQ 与清源规则</text><line id="execute-status" x1="1190" y1="535" x2="1000" y2="535" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="status-software" points="620,535 230,535 230,335" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-16" x="420" y="520" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#347F7A" text-anchor="middle">查询 / 确认</text><rect id="reset" x="65" y="675" width="440" height="110" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-17" x="285.0" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">复位状态</text><text id="text-18" x="285.0" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">禁止误启动；有效位需定义</text><rect id="contract" x="620" y="675" width="900" height="110" rx="12" fill="#F1F4F7" stroke="#9AABBA" stroke-width="2"/><text id="text-19" x="1070.0" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">每个字段记录：位宽、访问属性、复位来源、合法范围</text><text id="text-20" x="1070.0" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">复位值 ≠ 推荐运行值；64 位分拆写 ≠ 自动原子生效</text><polyline id="reset-shadow" points="505,730 545,730 545,335" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-21" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-22" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-23" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-24" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-25" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">04 / 13</text></svg>
