<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>DDR–GB：跨层数据同步</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">02  DDR–GB：跨层数据同步</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">已有确认方向：软件显式交接 + 硬件范围维护；GB 是独立 SRAM。</text><rect id="rect-3" x="45" y="140" width="1510" height="265" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-4" x="65" y="172" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">数据面：CPU 缓存位于主 Xbar 上游；GB 的 M5 路径另见图 01</text><rect id="cpu" x="70" y="215" width="210" height="80" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-5" x="175.0" y="248.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">CVA6</text><text id="text-6" x="175.0" y="278.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">L1D / WT 写缓冲</text><rect id="ara" x="70" y="325" width="210" height="60" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-7" x="175.0" y="363.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Ara2 · S2</text><rect id="xbar" x="355" y="215" width="185" height="170" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-8" x="447.5" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">主 Xbar64</text><text id="text-9" x="447.5" y="323.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">M2 主存</text><rect id="cache" x="610" y="265" width="210" height="90" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-10" x="715.0" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">原子适配 → LLC</text><text id="text-11" x="715.0" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">F0</text><rect id="front" x="890" y="265" width="305" height="90" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-12" x="1042.5" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">共享压缩前端</text><text id="text-13" x="1042.5" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">四口统一格式</text><rect id="ddr" x="1260" y="265" width="255" height="90" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-14" x="1387.5" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">单 DDR Controller</text><text id="text-15" x="1387.5" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">DDR.S0～S3</text><rect id="dev" x="890" y="165" width="305" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-16" x="1042.5" y="205.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F1 · 搬运 ↔ GB / NPU</text><line id="cpu-xbar" x1="280" y1="255" x2="355" y2="255" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="ara-xbar" x1="280" y1="355" x2="355" y2="355" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="xbar-cache" x1="540" y1="310" x2="610" y2="310" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="cache-front" x1="820" y1="310" x2="890" y2="310" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="front-ddr" x1="1195" y1="310" x2="1260" y2="310" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="device-front" x1="1042" y1="230" x2="1042" y2="265" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><text id="text-17" x="1240" y="390" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="start">F2：帧写；F3：帧读</text><rect id="service" x="55" y="470" width="290" height="180" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-18" x="200.0" y="538.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">范围维护服务</text><text id="text-19" x="200.0" y="568.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">保存范围 / 身份</text><text id="text-20" x="200.0" y="598.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">窗口 + 完成 + 错误</text><polyline id="service-cache" points="200,470 200,425 715,425 715,355" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><polyline id="service-l1" points="55,510 30,510 30,255 70,255" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="in" x="425" y="440" width="1090" height="90" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-21" x="970.0" y="478.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">① 输入交设备</text><text id="text-22" x="970.0" y="508.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">生产者完成 → 上游排空 → LLC clean → 跨口可见</text><polyline id="sync-in" points="345,555 385,555 385,485 425,485" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="pre" x="425" y="560" width="1090" height="90" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-23" x="970.0" y="598.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">② 输出写前准备</text><text id="text-24" x="970.0" y="628.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">排空旧写 → clean + invalidate → 保护未覆盖字节</text><polyline id="sync-pre" points="345,555 385,555 385,605 425,605" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="post" x="425" y="680" width="1090" height="90" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-25" x="970.0" y="718.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">③ 输出交回 CPU</text><text id="text-26" x="970.0" y="748.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">设备写可见 → 旧读结束 → 最终 invalidate → 消费</text><polyline id="sync-post" points="345,555 385,555 385,725 425,725" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-27" x="55" y="805" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#B65353" text-anchor="start">命令接受 ≠ 整体完成；设备持有期保持所有权，旧脏写不能覆盖设备新结果。</text><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-28" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-29" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-30" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-31" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-32" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">02 / 13</text></svg>
