<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>算法与布局：计算正确和搬得动必须同时满足</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">10  算法与布局：计算正确和搬得动必须同时满足</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">算子、精度、图像格式、误差边界与驻留策略先形成可执行参考。</text><rect id="gold" x="55" y="195" width="330" height="115" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-3" x="220.0" y="245.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">参考模型 / 数据集</text><text id="text-4" x="220.0" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">固定输入与质量指标</text><rect id="quant" x="440" y="195" width="330" height="115" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-5" x="605.0" y="245.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">量化 / 定点规则</text><text id="text-6" x="605.0" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">舍入、饱和、溢出</text><rect id="layout" x="825" y="195" width="330" height="115" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-7" x="990.0" y="245.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">张量 / 像素布局</text><text id="text-8" x="990.0" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">stride、对齐、尾块</text><rect id="tiles" x="1210" y="195" width="330" height="115" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-9" x="1375.0" y="245.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">分块与驻留计划</text><text id="text-10" x="1375.0" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">GB 容量 / DDR 交换</text><line id="model0" x1="385" y1="252" x2="440" y2="252" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="model1" x1="770" y1="252" x2="825" y2="252" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="model2" x1="1155" y1="252" x2="1210" y2="252" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="cpu" x="130" y="440" width="320" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-11" x="290.0" y="490.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">CPU 标量</text><text id="text-12" x="290.0" y="520.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">控制 / 回退 / 后处理</text><rect id="ara" x="640" y="440" width="320" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="800.0" y="490.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Ara2 向量</text><text id="text-14" x="800.0" y="520.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">向量辅助算子</text><rect id="npu" x="1150" y="440" width="320" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-15" x="1310.0" y="490.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">NPU 阵列</text><text id="text-16" x="1310.0" y="520.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">选定加速算子</text><polyline id="tile-cpu" points="1375,310 1375,370 290,370 290,440" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><polyline id="tile-ara" points="1375,310 1375,370 800,370 800,440" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><polyline id="tile-npu" points="1375,310 1375,370 1310,370 1310,440" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="compare" x="475" y="675" width="650" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-17" x="800.0" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">结果检查：逐算子 → 子图 → 应用</text><text id="text-18" x="800.0" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">数值误差 + 质量指标 + 周期 / 流量</text><polyline id="cpu-check" points="290,555 290,625 800,625 800,675" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="ara-check" points="800,555 800,625 800,625 800,675" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="npu-check" points="1310,555 1310,625 800,625 800,675" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="gold-reference" points="55,252 30,252 30,730 475,730" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-19" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-20" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-21" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-22" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-23" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">10 / 13</text></svg>
