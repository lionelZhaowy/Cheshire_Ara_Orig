<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>真实工艺：宏语义、测试接管与物理签核</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">12  真实工艺：宏语义、测试接管与物理签核</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">FPGA 功能模型可作对照；宏的端口、时延、掩码和测试视图决定 ASIC 实现。</text><rect id="consumer" x="55" y="205" width="350" height="130" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-3" x="230.0" y="248.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">逻辑存储消费者</text><text id="text-4" x="230.0" y="278.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">CVA6 / Ara / LLC / GB</text><text id="text-5" x="230.0" y="308.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">读写与初始化假设</text><rect id="wrapper" x="570" y="205" width="420" height="130" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-6" x="780.0" y="248.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">宏适配与唯一实现选择</text><text id="text-7" x="780.0" y="278.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">时延 / 掩码 / 同址冲突</text><text id="text-8" x="780.0" y="308.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">有效位、复位与错误策略</text><rect id="macro" x="1155" y="205" width="390" height="130" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-9" x="1350.0" y="248.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">工艺 SRAM / ROM 宏</text><text id="text-10" x="1350.0" y="278.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">功能模型 + 时序 / 物理视图</text><text id="text-11" x="1350.0" y="308.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">PLL / IO / PHY 另行适配</text><line id="consumer-wrap" x1="405" y1="270" x2="570" y2="270" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="wrap-macro" x1="990" y1="270" x2="1155" y2="270" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="test" x="55" y="490" width="350" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-12" x="230.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Scan / MBIST / ATPG</text><text id="text-13" x="230.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">测试时钟、复位、隔离</text><text id="text-14" x="230.0" y="588.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">测试访问与功能模式互斥</text><polyline id="test-takeover" points="405,550 500,550 500,385 780,385 780,335" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="physical" x="570" y="490" width="420" height="120" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-15" x="780.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">综合 → 布局布线 → 提取</text><text id="text-16" x="780.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">宏摆放 / 时钟 / 供电</text><text id="text-17" x="780.0" y="588.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">真实库与 SDC</text><polyline id="macro-views" points="1350,335 1350,400 780,400 780,490" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="signoff" x="1155" y="490" width="390" height="120" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-18" x="1350.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">签核与交付证据</text><text id="text-19" x="1350.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">STA / 等价 / DRC / LVS</text><text id="text-20" x="1350.0" y="588.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">测试覆盖、IR / EM</text><line id="physical-signoff" x1="990" y1="550" x2="1155" y2="550" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="test-signoff" points="230,610 230,710 1350,710 1350,610" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-21" x="570" y="780" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">真实库的小设计试跑需早做；后端和 DFT 不宜等功能冻结才开始。</text><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-22" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-23" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-24" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-25" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-26" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">12 / 13</text></svg>
