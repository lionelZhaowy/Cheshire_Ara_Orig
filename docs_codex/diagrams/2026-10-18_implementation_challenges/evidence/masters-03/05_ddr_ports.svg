<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>四口 DDR：独立入口，共享物理存储</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">05  四口 DDR：独立入口，共享物理存储</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">四口是 v1 目标；实际供应商实例、跨口可见条件和服务保证待确认。</text><rect id="rect-3" x="505" y="145" width="460" height="455" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-4" x="525" y="177" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">一个共享前端：压缩 / 旁路 / 元数据</text><rect id="rect-5" x="1090" y="145" width="455" height="455" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-6" x="1110" y="177" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">一个 DDR Controller</text><rect id="src0" x="60" y="193" width="335" height="64" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-7" x="227.5" y="233.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">LLC 出口</text><rect id="f0" x="535" y="193" width="160" height="64" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-8" x="615.0" y="233.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F0</text><rect id="s0" x="1120" y="193" width="155" height="64" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-9" x="1197.5" y="233.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR.S0</text><line id="source-f0" x1="395" y1="225" x2="535" y2="225" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="f-s0" x1="695" y1="225" x2="1120" y2="225" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="s-memory0" points="1275,225 1310,225 1310,375 1345,375" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="src1" x="60" y="293" width="335" height="64" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-10" x="227.5" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR ↔ GB 搬运</text><rect id="f1" x="535" y="293" width="160" height="64" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-11" x="615.0" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F1</text><rect id="s1" x="1120" y="293" width="155" height="64" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-12" x="1197.5" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR.S1</text><line id="source-f1" x1="395" y1="325" x2="535" y2="325" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="f-s1" x1="695" y1="325" x2="1120" y2="325" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="s-memory1" points="1275,325 1310,325 1310,375 1345,375" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="src2" x="60" y="393" width="335" height="64" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="227.5" y="433.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">帧写 DMA</text><rect id="f2" x="535" y="393" width="160" height="64" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-14" x="615.0" y="433.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F2</text><rect id="s2" x="1120" y="393" width="155" height="64" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-15" x="1197.5" y="433.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR.S2</text><line id="source-f2" x1="395" y1="425" x2="535" y2="425" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="f-s2" x1="695" y1="425" x2="1120" y2="425" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><text id="text-16" x="785" y="413" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#52677B" text-anchor="start">AW / W →；B ←</text><polyline id="s-memory2" points="1275,425 1310,425 1310,375 1345,375" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="src3" x="60" y="493" width="335" height="64" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-17" x="227.5" y="533.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">二维帧读 DMA</text><rect id="f3" x="535" y="493" width="160" height="64" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-18" x="615.0" y="533.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F3</text><rect id="s3" x="1120" y="493" width="155" height="64" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-19" x="1197.5" y="533.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">DDR.S3</text><line id="source-f3" x1="395" y1="525" x2="535" y2="525" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="f-s3" x1="695" y1="525" x2="1120" y2="525" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><text id="text-20" x="785" y="513" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#52677B" text-anchor="start">AR →；R ←</text><polyline id="s-memory3" points="1275,525 1310,525 1310,375 1345,375" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="dram" x="1345" y="290" width="175" height="170" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-21" x="1432.5" y="353.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">队列 / 调度</text><text id="text-22" x="1432.5" y="383.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">PHY</text><text id="text-23" x="1432.5" y="413.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">同一 DDR</text><rect id="wa" x="60" y="680" width="380" height="100" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-24" x="250.0" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">端口 A 写地址 X</text><text id="text-25" x="250.0" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">数据 + 元数据提交</text><rect id="visible" x="595" y="680" width="410" height="100" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-26" x="800.0" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">满足跨口可见条件</text><text id="text-27" x="800.0" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">B 语义 / 额外同步待确认</text><rect id="rb" x="1155" y="680" width="385" height="100" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-28" x="1347.5" y="723.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">端口 B 随后读 X</text><text id="text-29" x="1347.5" y="753.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">必须取得新逻辑数据</text><line id="write-visible" x1="440" y1="730" x2="595" y2="730" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="visible-read" x1="1005" y1="730" x2="1155" y2="730" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-30" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-31" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-32" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-33" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-34" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">05 / 13</text></svg>
