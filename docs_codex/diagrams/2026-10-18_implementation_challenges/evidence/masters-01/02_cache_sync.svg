<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>DDR–GB：跨层数据同步</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">02  DDR–GB：跨层数据同步</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">已有确认方向：软件显式交接 + 硬件范围维护；GB 是独立 SRAM。</text><rect id="rect-3" x="45" y="140" width="1510" height="230" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-4" x="65" y="172" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">数据面：示意输入流；输出沿可写路径返回 DDR</text><rect id="cpu" x="70" y="215" width="210" height="95" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-5" x="175.0" y="255.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">CPU / Ara</text><text id="text-6" x="175.0" y="285.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">主 Xbar · M2</text><rect id="cache" x="350" y="215" width="240" height="95" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-7" x="470.0" y="255.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">L1D / 写缓冲</text><text id="text-8" x="470.0" y="285.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">LLC · F0</text><rect id="front" x="660" y="215" width="250" height="95" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-9" x="785.0" y="255.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">共享压缩前端</text><text id="text-10" x="785.0" y="285.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">同一逻辑地址解释</text><rect id="ddr" x="980" y="215" width="240" height="95" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-11" x="1100.0" y="255.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">单 DDR Controller</text><text id="text-12" x="1100.0" y="285.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">DDR.S0～S3</text><rect id="dev" x="1290" y="215" width="240" height="95" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="1410.0" y="255.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F1 搬运 ↔ GB</text><text id="text-14" x="1410.0" y="285.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">NPU 计算</text><polyline id="cpu-cache" points="280,262 350,262" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="cache-front" points="590,262 660,262" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="front-ddr" points="910,262 980,262" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="device-front" points="1410,215 1410,195 785,195 785,215" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><text id="text-15" x="1005" y="344" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="start">F2：帧写；F3：帧读</text><rect id="service" x="55" y="440" width="290" height="180" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-16" x="200.0" y="508.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">范围维护服务</text><text id="text-17" x="200.0" y="538.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">保存范围 / 身份</text><text id="text-18" x="200.0" y="568.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">窗口 + 完成 + 错误</text><polyline id="service-cache" points="200,440 200,405 470,405 470,310" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="in" x="425" y="405" width="1090" height="95" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-19" x="970.0" y="445.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">① 输入交设备</text><text id="text-20" x="970.0" y="475.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">生产者完成 → 上游排空 → LLC clean → 跨口可见</text><polyline id="sync-in" points="345,530 385,530 385,452 425,452" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="pre" x="425" y="535" width="1090" height="95" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-21" x="970.0" y="575.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">② 输出写前准备</text><text id="text-22" x="970.0" y="605.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">排空旧写 → clean + invalidate → 保护未覆盖字节</text><polyline id="sync-pre" points="345,530 385,530 385,582 425,582" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><rect id="post" x="425" y="665" width="1090" height="95" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-23" x="970.0" y="705.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">③ 输出交回 CPU</text><text id="text-24" x="970.0" y="735.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">设备写可见 → 旧读结束 → 最终 invalidate → 消费</text><polyline id="sync-post" points="345,530 385,530 385,712 425,712" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-25" x="55" y="805" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#B65353" text-anchor="start">命令接受 ≠ 整体完成；设备持有期保持所有权，旧脏写不能覆盖设备新结果。</text><polyline id="legend-data" points="55,858 103,858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-26" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><polyline id="legend-control" points="340,858 388,858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-27" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><polyline id="legend-done" points="625,858 673,858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-28" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><polyline id="legend-error" points="910,858 958,858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-29" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-30" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">02 / 13</text></svg>
