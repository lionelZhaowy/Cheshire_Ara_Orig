<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>AXI 适配：五个通道分别保持语义</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">08  AXI 适配：五个通道分别保持语义</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">同一模块要处理位宽、ID、字节选通、顺序、背压与错误归属。</text><rect id="rect-3" x="50" y="155" width="365" height="580" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-4" x="70" y="187" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">上游发起端</text><rect id="rect-5" x="565" y="155" width="470" height="580" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-6" x="585" y="187" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">适配 / 队列 / CDC（按实际边界）</text><rect id="rect-7" x="1185" y="155" width="365" height="580" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-8" x="1205" y="187" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">下游接收端</text><rect id="up-AW" x="75" y="235" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-9" x="232.5" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">AW  请求发送</text><rect id="adapt-AW" x="590" y="235" width="420" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-10" x="800.0" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">地址 / ID / burst</text><rect id="down-AW" x="1210" y="235" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-11" x="1367.5" y="275.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">AW  请求接收</text><polyline id="AW0" points="390,267 590,267" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="AW1" points="1010,267 1210,267" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="up-W" x="75" y="330" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-12" x="232.5" y="370.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">W  请求发送</text><rect id="adapt-W" x="590" y="330" width="420" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="800.0" y="370.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">数据 / WSTRB / LAST</text><rect id="down-W" x="1210" y="330" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-14" x="1367.5" y="370.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">W  请求接收</text><polyline id="W0" points="390,362 590,362" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="W1" points="1010,362 1210,362" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="up-B" x="75" y="425" width="315" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-15" x="232.5" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">B  响应接收</text><rect id="adapt-B" x="590" y="425" width="420" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-16" x="800.0" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">ID / BRESP</text><rect id="down-B" x="1210" y="425" width="315" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-17" x="1367.5" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">B  响应发送</text><polyline id="B0" points="590,457 390,457" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="B1" points="1210,457 1010,457" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="up-AR" x="75" y="520" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-18" x="232.5" y="560.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">AR  请求发送</text><rect id="adapt-AR" x="590" y="520" width="420" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-19" x="800.0" y="560.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">地址 / ID / burst</text><rect id="down-AR" x="1210" y="520" width="315" height="65" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-20" x="1367.5" y="560.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">AR  请求接收</text><polyline id="AR0" points="390,552 590,552" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="AR1" points="1010,552 1210,552" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="up-R" x="75" y="615" width="315" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-21" x="232.5" y="655.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">R  响应接收</text><rect id="adapt-R" x="590" y="615" width="420" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-22" x="800.0" y="655.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">数据 / ID / RRESP / LAST</text><rect id="down-R" x="1210" y="615" width="315" height="65" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-23" x="1367.5" y="655.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">R  响应发送</text><polyline id="R0" points="590,647 390,647" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="R1" points="1210,647 1010,647" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-24" x="70" y="790" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">每通道 VALID/READY 独立；AW/W 不保证同拍，背压时载荷保持，响应回到正确来源。</text><polyline id="legend-data" points="55,858 103,858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-25" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><polyline id="legend-control" points="340,858 388,858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-26" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><polyline id="legend-done" points="625,858 673,858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-27" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><polyline id="legend-error" points="910,858 958,858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-28" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-29" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">08 / 13</text></svg>
