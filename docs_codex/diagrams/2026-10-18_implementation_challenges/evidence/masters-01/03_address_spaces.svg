<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>设备地址体系：先定义地址，再选择翻译机制</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">03  设备地址体系：先定义地址，再选择翻译机制</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">CPU VA、CPU PA、设备 DMA 地址、GB 偏移需要独立类型与生命周期。</text><rect id="rect-3" x="45" y="145" width="1510" height="235" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-4" x="65" y="177" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">CPU / Ara 既有路径</text><rect id="va" x="75" y="225" width="260" height="90" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-5" x="205.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">CPU 虚拟地址 VA</text><text id="text-6" x="205.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">进程 / 页表上下文</text><rect id="mmu" x="475" y="225" width="350" height="90" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-7" x="650.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">CVA6 MMU → CPU PA</text><text id="text-8" x="650.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">Ara 使用专用 MMU 交互</text><rect id="pa" x="1165" y="225" width="350" height="90" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-9" x="1340.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">系统地址译码</text><text id="text-10" x="1340.0" y="293.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">DDR / GB 窗口</text><polyline id="va-mmu" points="335,270 475,270" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="mmu-pa" points="825,270 1165,270" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="rect-11" x="45" y="415" width="1510" height="295" rx="16" fill="#F1F4F7" stroke="#B7C4D0" stroke-width="2"/><text id="text-12" x="65" y="447" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="start">新增独立发起端：GB 搬运、帧 DMA、eMMC DMA</text><rect id="driver" x="75" y="500" width="280" height="100" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-13" x="215.0" y="543.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">驱动管理缓冲</text><text id="text-14" x="215.0" y="573.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">映射 / 固定生命周期</text><rect id="dma" x="480" y="500" width="300" height="100" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-15" x="630.0" y="543.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">提交设备 DMA 地址</text><text id="text-16" x="630.0" y="573.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">能力与范围检查</text><rect id="iommu" x="900" y="485" width="270" height="130" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2" stroke-dasharray="9 6"/><text id="text-17" x="1035.0" y="528.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">可选 IOMMU</text><text id="text-18" x="1035.0" y="558.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">IOVA → 系统 PA</text><text id="text-19" x="1035.0" y="588.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">尚未选定</text><rect id="target" x="1270" y="500" width="245" height="100" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-20" x="1392.5" y="543.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">内存目标</text><text id="text-21" x="1392.5" y="573.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">按设备可达范围</text><polyline id="map-submit" points="355,550 480,550" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><polyline id="dma-optional" points="780,530 900,530" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="iommu-target" points="1170,530 1270,530" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="direct-bus" points="780,575 830,575 830,655 1392,655 1392,600" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-22" x="1080" y="690" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#3575A6" text-anchor="middle">不启用翻译时：按已定义总线映射直接访问</text><polyline id="target-decode" points="1392,500 1392,380 1340,380 1340,315" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="gb-offset" x="75" y="755" width="600" height="65" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-23" x="375.0" y="795.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">NPU / ISP 本地 GB 偏移 → GB bank / 范围</text><text id="text-24" x="735" y="795" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">压缩块地址映射与 VA→PA 翻译是不同机制。</text><polyline id="legend-data" points="55,858 103,858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-25" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><polyline id="legend-control" points="340,858 388,858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-26" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><polyline id="legend-done" points="625,858 673,858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-27" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><polyline id="legend-error" points="910,858 958,858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-28" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-29" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">03 / 13</text></svg>
