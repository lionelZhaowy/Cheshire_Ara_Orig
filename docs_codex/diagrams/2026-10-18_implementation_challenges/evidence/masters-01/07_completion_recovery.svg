<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>完成与回收：区分五个时间点</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">07  完成与回收：区分五个时间点</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">超时表示软件等待结束；旧事务是否还能写内存，需要另行确认。</text><rect id="phase0" x="55" y="220" width="230" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-3" x="170.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">命令已接受</text><text id="text-4" x="170.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">上下文已保存</text><rect id="phase1" x="370" y="220" width="230" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-5" x="485.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">执行结束</text><text id="text-6" x="485.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">数据尚可在途</text><rect id="phase2" x="685" y="220" width="230" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-7" x="800.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">数据已可见</text><text id="text-8" x="800.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">含元数据提交</text><rect id="phase3" x="1000" y="220" width="230" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-9" x="1115.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">交接完成</text><text id="text-10" x="1115.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">消费者获准使用</text><rect id="phase4" x="1315" y="220" width="230" height="110" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-11" x="1430.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">安全释放</text><text id="text-12" x="1430.0" y="298.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">所有使用者退出</text><polyline id="phase-edge0" points="285,275 370,275" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="phase-edge1" points="600,275 685,275" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="phase-edge2" points="915,275 1000,275" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="phase-edge3" points="1230,275 1315,275" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="fail" x="65" y="485" width="285" height="115" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-13" x="207.5" y="535.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">错误 / 超时</text><text id="text-14" x="207.5" y="565.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">保存任务与范围</text><rect id="isolate" x="455" y="485" width="285" height="115" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-15" x="597.5" y="535.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">停止新提交</text><text id="text-16" x="597.5" y="565.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">缓冲保持隔离</text><rect id="drain" x="845" y="485" width="285" height="115" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-17" x="987.5" y="535.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">排空 / 受控复位</text><text id="text-18" x="987.5" y="565.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">证明旧访问终止</text><rect id="rebuild" x="1235" y="485" width="285" height="115" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-19" x="1377.5" y="535.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">废弃部分结果</text><text id="text-20" x="1377.5" y="565.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">可靠输入重建</text><polyline id="recover0" points="350,543 455,543" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><polyline id="recover1" points="740,543 845,543" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><polyline id="recover2" points="1130,543 1235,543" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><polyline id="failure-branch" points="800,330 800,405 210,405 210,485" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><polyline id="rebuild-free" points="1380,485 1380,400 1430,400 1430,330" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="still-active" points="985,600 985,730 595,730 595,600" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-21" x="810" y="770" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#B65353" text-anchor="middle">仍可能访问旧地址：保持隔离，上报平台故障</text><text id="text-22" x="65" y="805" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">epoch / token 可识别迟到事件，但不能阻止迟到写；复位也不会补齐部分结果。</text><polyline id="legend-data" points="55,858 103,858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-23" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><polyline id="legend-control" points="340,858 388,858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-24" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><polyline id="legend-done" points="625,858 673,858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-25" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><polyline id="legend-error" points="910,858 958,858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-26" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-27" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">07 / 13</text></svg>
