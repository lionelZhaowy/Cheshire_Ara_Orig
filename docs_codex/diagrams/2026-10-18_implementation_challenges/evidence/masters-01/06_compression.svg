<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>共享压缩前端：算法之外的事务系统</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">06  共享压缩前端：算法之外的事务系统</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">同一逻辑地址的格式、元数据和完成条件必须对四个入口一致。</text><rect id="ports" x="55" y="195" width="260" height="100" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-3" x="185.0" y="238.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">F0～F3 请求</text><text id="text-4" x="185.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">AR / AW / W</text><rect id="route" x="425" y="195" width="410" height="100" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-5" x="630.0" y="238.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">区域 / 块映射 / 事务上下文</text><text id="text-6" x="630.0" y="268.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">锁定冲突块；保留 ID 与长度</text><polyline id="ports-route" points="315,245 425,245" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="meta" x="1010" y="180" width="500" height="120" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-7" x="1260.0" y="233.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">共享元数据与发布状态</text><text id="text-8" x="1260.0" y="263.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">格式 / 位置 / 长度 / 有效性</text><polyline id="route-meta" points="835,245 1010,245" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)" marker-start="url(#arrow-control)"/><rect id="raw" x="55" y="415" width="350" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-9" x="230.0" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">普通区旁路</text><text id="text-10" x="230.0" y="495.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">原样 W / R</text><rect id="write" x="425" y="415" width="350" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-11" x="600.0" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">压缩写 / 部分写合并</text><text id="text-12" x="600.0" y="495.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">旧块 + WSTRB → 新块</text><rect id="read" x="850" y="415" width="350" height="115" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="1025.0" y="465.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">读块 + 解压</text><text id="text-14" x="1025.0" y="495.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">恢复逻辑字节 / 拍数</text><polyline id="route-raw" points="490,295 490,350 230,350 230,415" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="route-write" points="630,295 630,415" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="route-read" points="770,295 770,350 1025,350 1025,415" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><rect id="down" x="1270" y="405" width="265" height="140" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-15" x="1402.5" y="453.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">四个下游接口</text><text id="text-16" x="1402.5" y="483.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">数据 / 元数据</text><text id="text-17" x="1402.5" y="513.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">经已有口路由</text><polyline id="raw-down" points="230,530 230,590 1400,590 1400,545" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="write-down" points="600,530 600,590 1400,590 1400,545" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><polyline id="read-down" points="1025,530 1025,590 1400,590 1400,545" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><polyline id="metadata-io" points="1400,300 1400,405" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)" marker-start="url(#arrow-control)"/><rect id="aggregate" x="850" y="675" width="685" height="115" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-18" x="1192.5" y="725.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">子事务与响应汇合</text><text id="text-19" x="1192.5" y="755.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">R：重组返回；B：汇合写结果 / 错误</text><polyline id="down-result" points="1495,545 1495,675" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="complete" x="55" y="675" width="640" height="115" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-20" x="375.0" y="725.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">向原 F 口返回 R / B</text><text id="text-21" x="375.0" y="755.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">成功须覆盖所需数据及元数据操作</text><polyline id="reply-aggregate" points="850,730 695,730" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><polyline id="legend-data" points="55,858 103,858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-22" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><polyline id="legend-control" points="340,858 388,858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-23" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><polyline id="legend-done" points="625,858 673,858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-24" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><polyline id="legend-error" points="910,858 958,858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-25" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-26" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">06 / 13</text></svg>
