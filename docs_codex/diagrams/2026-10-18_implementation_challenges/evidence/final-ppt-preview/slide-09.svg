="middle">共享排队、仲裁、刷新与编解码</text><text x="1245.0" y="302.99997000374947" font-family="Microsoft YaHei" font-size="21.999999999999996" font-weight="normal" fill="#263E53" text-anchor="middle">不同瓶颈分别建预算</text><line x1="354.99999999999994" y1="265.0" x2="494.99999999999994" y2="265.0" fill="none" stroke="#3575A6" stroke-width="2.9999999999999996" marker-end="url(#m12end)"/><line x1="794.9999999999999" y1="265.0" x2="964.9999999999999" y2="265.0" fill="none" stroke="#3575A6" stroke-width="2.9999999999999996" marker-end="url(#m13end)"/><rect x="964.9999999999999" y="439.99999999999994" width="560.0" height="109.99999999999999" rx="11.999899999999998" fill="#E6F0FA" stroke="#3575A6" stroke-width="1.9999999999999998"/><text x="1245.0000624921884" y="487.99997000374947" font-family="Microsoft YaHei" font-size="21.999999999999996" font-weight="bold" fill="#263E53" text-anchor="middle">竞争负载：LLC + GB 搬运 + 帧 / ROI</text><text x="1245.0" y="517.9999700037495" font-family="Microsoft YaHei" font-size="21.999999999999996" font-weight="normal" fill="#263E53" text-anchor="middle">维护写回、元数据、不可压缩与部分写放大</text><line x1="1244.9999999999998" y1="439.99999999999994" x2="1244.9999999999998" y2="339.99999999999994" fill="none" stroke="#3575A6" stroke-width="2.9999999999999996" marker-end="url(#m17end)"/><rect x="54.99999999999999" y="439.99999999999994" width="299.99999999999994" height="109.99999999999999" rx="11.999899999999998" fill="#E6F0FA" stroke="#3575A6" stroke-width="1.9999999999999998"/><text x="205.00006249218845" y="487.99997000374947" font-family="Microsoft YaHei" font-size="21.999999999999996" font-weight="bold" fill="#263E53" text-anchor="middle">LVDS TX / 消费者</text><text x="204.99999999999997" y="517.9999700037495" font-family="Microsoft YaHei" font-size="21.999999999999996" font-weight="normal" fill="#263E53" text-anchor="middle">欠载策略与输出期限</text><rect x="494.99999999999994" y="439.99999999999994" width="299.99999999999994" height="109.99999999999999" rx="11.999899999999998" fill