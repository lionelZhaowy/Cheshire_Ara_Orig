<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>验证与调试：从故障触发到可追溯证据</title><defs><marker id="arrow-data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#3575A6"/></marker><marker id="arrow-control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8161A8"/></marker><marker id="arrow-done" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#347F7A"/></marker><marker id="arrow-error" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#B65353"/></marker></defs><rect id="background" width="1600" height="900" fill="#FFFFFF" stroke="none"/><text id="text-1" x="50" y="57" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#263E53" text-anchor="start">13  验证与调试：从故障触发到可追溯证据</text><text id="text-2" x="50" y="99" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">源码发现、动态复现、修复回归、系统通过是四种不同状态。</text><rect id="stim" x="55" y="205" width="350" height="120" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-3" x="230.0" y="243.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">激励 / 故障注入</text><text id="text-4" x="230.0" y="273.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">并发、背压、错误响应</text><text id="text-5" x="230.0" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">迟到事件、复位边界</text><rect id="dut" x="610" y="205" width="380" height="120" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-6" x="800.0" y="243.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">被测模块 / SoC</text><text id="text-7" x="800.0" y="273.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">固定配置与依赖版本</text><text id="text-8" x="800.0" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">实际 RTL 或 FPGA</text><rect id="observe" x="1185" y="205" width="350" height="120" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-9" x="1360.0" y="243.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">观测点 / 断言 / 计数</text><text id="text-10" x="1360.0" y="273.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">请求、完成、数据版本</text><text id="text-11" x="1360.0" y="303.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">任务身份与错误阶段</text><line id="stim-dut" x1="405" y1="265" x2="610" y2="265" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><line id="dut-observe" x1="990" y1="265" x2="1185" y2="265" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="gold" x="55" y="490" width="350" height="115" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-12" x="230.0" y="525.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">独立参考 / 期望行为</text><text id="text-13" x="230.0" y="555.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">算法、字节和生命周期</text><text id="text-14" x="230.0" y="585.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">不从 DUT 输出自证</text><rect id="check" x="610" y="490" width="380" height="115" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-15" x="800.0" y="525.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">检查器 / 覆盖矩阵</text><text id="text-16" x="800.0" y="555.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">结果、顺序、进展</text><text id="text-17" x="800.0" y="585.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">部分结果与失败不得成功</text><rect id="evidence" x="1185" y="490" width="350" height="115" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-18" x="1360.0" y="525.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">证据与关闭记录</text><text id="text-19" x="1360.0" y="555.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">版本 / 命令 / 日志</text><text id="text-20" x="1360.0" y="585.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">未通过和未测项</text><line id="reference-check" x1="405" y1="547" x2="610" y2="547" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><polyline id="observe-check" points="1360,325 1360,400 800,400 800,490" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="check-evidence" x1="990" y1="547" x2="1185" y2="547" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><rect id="defects" x="55" y="710" width="1480" height="90" rx="12" fill="#FBEAEA" stroke="#B65353" stroke-width="2"/><text id="text-21" x="795.0" y="748.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">已登记：Platform ROM / C 栈 / LLC R-B 错误 / Ara B 错误 / iDMA 控制宽度</text><text id="text-22" x="795.0" y="778.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">按触发条件定向复现和关闭；HelloWorld 或文档检查不证明这些项目通过。</text><polyline id="defect-stim" points="55,755 30,755 30,265 55,265" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-23" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-24" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-25" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-26" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-27" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">13 / 13</text></svg>
