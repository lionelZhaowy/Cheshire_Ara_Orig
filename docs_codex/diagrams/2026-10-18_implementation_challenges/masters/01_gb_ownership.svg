idth="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="ara" x="75" y="320" width="220" height="70" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-6" x="185.0" y="363.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">Ara2 · S2</text><line id="ara-xbar" x1="295" y1="355" x2="380" y2="355" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="emmc" x="75" y="430" width="220" height="70" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-7" x="185.0" y="473.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">eMMC DMA · S7</text><line id="emmc-xbar" x1="295" y1="465" x2="380" y2="465" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="xbar" x="380" y="200" width="220" height="310" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-8" x="490.0" y="333.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">主 Xbar64</text><text id="text-9" x="490.0" y="363.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">共享 M5</text><text id="text-10" x="490.0" y="393.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">GB 请求 / 返回</text><rect id="local" x="690" y="165" width="340" height="90" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-11" x="860.0" y="203.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">NPU / ISP / GB 搬运器</text><text id="text-12" x="860.0" y="233.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">本地服务入口</text><rect id="adapt" x="690" y="335" width="340" height="110" rx="12" fill="#E6F0FA" stroke="#3575A6" stroke-width="2"/><text id="text-13" x="860.0" y="383.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">访问适配 + 来源检查</text><text id="text-14" x="860.0" y="413.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">范围 / 操作 / 所有权</text><line id="m5-gb" x1="600" y1="390" x2="690" y2="390" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><line id="local-gb" x1="860" y1="255" x2="860" y2="335" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="banks" x="1160" y="320" width="370" height="140" rx="12" fill="#FFF1DE" stroke="#9AABBA" stroke-width="2"/><text id="text-15" x="1345.0" y="368.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">仲裁 → bank / SRAM</text><text id="text-16" x="1345.0" y="398.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">按物理端口服务</text><text id="text-17" x="1345.0" y="428.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">冲突排队与有界等待</text><line id="access-bank" x1="1030" y1="390" x2="1160" y2="390" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)" marker-start="url(#arrow-data)"/><rect id="policy" x="1150" y="165" width="380" height="85" rx="12" fill="#F0EAF7" stroke="#8161A8" stroke-width="2"/><text id="text-18" x="1340.0" y="200.5" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">软件分配 / 交接状态</text><text id="text-19" x="1340.0" y="230.5" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">硬件隔离能力待定</text><polyline id="policy-check" points="1150,207 1080,207 1080,295 930,295 930,335" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-20" x="75" y="580" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#52677B" text-anchor="start">同一范围：可多读的条件需定义；任何写者与旧读写活动必须隔离。</text><rect id="produce" x="75" y="640" width="300" height="100" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-21" x="225.0" y="683.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">生产者持有</text><text id="text-22" x="225.0" y="713.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">写入参数 / 结果</text><rect id="visible" x="445" y="640" width="300" height="100" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-23" x="595.0" y="683.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">写入达到 GB 可见</text><text id="text-24" x="595.0" y="713.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">发布范围与长度</text><rect id="consume" x="815" y="640" width="300" height="100" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-25" x="965.0" y="683.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">消费者持有</text><text id="text-26" x="965.0" y="713.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">全部读者退出</text><rect id="free" x="1185" y="640" width="300" height="100" rx="12" fill="#E6F3ED" stroke="#347F7A" stroke-width="2"/><text id="text-27" x="1335.0" y="683.0" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#263E53" text-anchor="middle">在途访问终止</text><text id="text-28" x="1335.0" y="713.0" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#263E53" text-anchor="middle">区间可复用</text><line id="handoff-0" x1="375" y1="690" x2="445" y2="690" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="handoff-1" x1="745" y1="690" x2="815" y2="690" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="handoff-2" x1="1115" y1="690" x2="1185" y2="690" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><line id="legend-data" x1="55" y1="858" x2="103" y2="858" fill="none" stroke="#3575A6" stroke-width="3" marker-end="url(#arrow-data)"/><text id="text-29" x="118" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#3575A6" text-anchor="start">数据 / 请求</text><line id="legend-control" x1="340" y1="858" x2="388" y2="858" fill="none" stroke="#8161A8" stroke-width="3" marker-end="url(#arrow-control)"/><text id="text-30" x="403" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#8161A8" text-anchor="start">配置 / 控制</text><line id="legend-done" x1="625" y1="858" x2="673" y2="858" fill="none" stroke="#347F7A" stroke-width="3" marker-end="url(#arrow-done)"/><text id="text-31" x="688" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#347F7A" text-anchor="start">完成 / 交接</text><line id="legend-error" x1="910" y1="858" x2="958" y2="858" fill="none" stroke="#B65353" stroke-width="3" marker-end="url(#arrow-error)"/><text id="text-32" x="973" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#B65353" text-anchor="start">故障 / 恢复</text><text id="text-33" x="1535" y="865" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#52677B" text-anchor="end">01 / 13</text></svg>
