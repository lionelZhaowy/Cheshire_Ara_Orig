<rect x="975" y="240" width="200" height="390" fill="#f9f5ff" stroke="#b9a6d4" stroke-width="2"/>
<text x="994" y="315" class="h">内部 Arbiter</text>
<text x="994" y="359" class="sub">可配置优先级</text>
<text x="994" y="394" class="sub">轮询 / QoS</text>
<text x="994" y="470" class="sub">页命中限制</text>
<text x="994" y="510" class="small">端口请求仲裁</text>
<path d="M1175 435 H1210" fill="none" stroke="#8094a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1210" y="345" width="230" height="190" fill="#e8f2fe" stroke="#96b9df" stroke-width="2"/>
<text x="1227" y="383" class="sub">Controller Core</text>
<text x="1227" y="423">内部命令队列</text>
<text x="1227" y="467" class="sub">FR-FCFS 调度</text>
<text x="1227" y="508" class="sub">遵守 DRAM 时序</text>
<path d="M1440 435 H1490" fill="none" stroke="#8094a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1490" y="394" width="160" height="82" fill="#fff" stroke="#bccbd8" stroke-width="2"/>
<text x="1510" y="428" class="h">PHY</text>
<text x="1510" y="457" class="sub">+ SDRAM</text>
<rect x="30" y="696" width="1620" height="168" fill="#fff" stroke="#cbd9e4" stroke-width="2"/>
<text x="48" y="728" class="h">依据与待确认边界</text>
<text x="48" y="762" class="sub">Datasheet V2.1：p8 最多 8 个 AXI 端口；p10 仲裁特性；p13 每端口 QoS；p17–18 内部结构与命令调度。</text>
<text x="48" y="794" class="sub">p14：独立 AXI Urgent 接口不支持。优先级 / QoS 的具体寄存器、映射规则、带宽保底和最坏延迟仍需用户手册确认。</text>
<text x="48" y="826" class="sub">多端口不会自动保证共享缓存一致性或旁路写的 AMO/LRSC 语义；RT 是否需要添加，后续结合控制器能力评估。</text>
</svg>
