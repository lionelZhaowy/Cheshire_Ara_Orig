<rect x="795" y="240" width="140" height="90" fill="#fff" stroke="#bccbd8" stroke-width="2"/>
<text x="810" y="275" class="h">AXI S0</text>
<text x="810" y="308" class="small">SoC 外存流量</text>
<path d="M935 285 H975" fill="none" stroke="#8094a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="390" width="140" height="90" fill="#fff" stroke="#bccbd8" stroke-width="2"/>
<text x="810" y="425" class="h">AXI S1</text>
<text x="810" y="458" class="small">ISP 写入</text>
<path d="M935 435 H975" fill="none" stroke="#8094a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="540" width="140" height="90" fill="#fff" stroke="#bccbd8" stroke-width="2"/>
<text x="810" y="575" class="h">AXI S2</text>
<text x="810" y="608" class="small">NPU 读 / 写</text>
