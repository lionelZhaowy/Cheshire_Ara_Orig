  <text fill="#50667a" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" id="text-070" x="48" y="794" xml:space="preserve">p14：独立 AXI Urgent 接口不支持。优先级 / QoS 的具体寄存器、映射规则、带宽保底和最坏延迟仍需用户手册确认。</text>
  <text fill="#50667a" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" id="text-071" x="48" y="826" xml:space="preserve">多端口不会自动保证共享缓存一致性或旁路写的 AMO/LRSC 语义；RT 是否需要添加，后续结合控制器能力评估。</text>
