<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <title>从复位到应用返回的程序执行流程</title>
  <defs>
    <marker id="a314D66" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#314D66" />
    </marker>
    <marker id="a187C78" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#187C78" />
    </marker>
    <marker id="aB96043" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#B96043" />
    </marker>
    <marker id="a765489" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#765489" />
    </marker>
    <marker id="a93939D" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse">
      <polygon points="0,0 3,1.5 0,3" fill="#93939D" />
    </marker>
  </defs>
  <rect x="0" y="0" width="2400" height="1350" fill="#FFFFFF" stroke="none" stroke-width="2" id="background" />
  <text x="45" y="65" font-family="Microsoft YaHei" font-size="43" fill="#29292D" font-weight="bold" text-anchor="start" id="o2">从复位到应用返回的程序执行流程</text>
  <text x="48" y="112" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="start" id="o3">SPI NOR 自主启动：boot_mode=2 · PlatformRom=0 · 根 SDK CRT0</text>
  <rect x="60" y="190" width="740" height="1030" fill="#D8E8F4" stroke="#29292D" stroke-width="2" id="rom-domain" />
  <text x="430.0" y="233" font-family="Microsoft YaHei" font-size="30" fill="#29292D" font-weight="bold" text-anchor="middle" id="o5">片上 Boot ROM 镜像</text>
  <rect x="850" y="190" width="740" height="1030" fill="#D9EEE8" stroke="#29292D" stroke-width="2" id="payload-domain" />
  <text x="1220.0" y="233" font-family="Microsoft YaHei" font-size="30" fill="#29292D" font-weight="bold" text-anchor="middle" id="o7">SPM 中的应用 / ZSL 镜像</text>
  <rect x="1640" y="190" width="700" height="1030" fill="#E8DFED" stroke="#29292D" stroke-width="2" id="state-domain" />
  <text x="1990.0" y="233" font-family="Microsoft YaHei" font-size="30" fill="#29292D" font-weight="bold" text-anchor="middle" id="o9">完成后的状态与观察</text>
  <rect x="100" y="280" width="660" height="100" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="reset" />
  <text x="430.0" y="322.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o11">复位释放 → ROM _start</text>
  <text x="430.0" y="356.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o12">cheshire_bootrom.S @ ROM</text>
  <rect x="100" y="450" width="660" height="150" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="early" />
  <text x="430.0" y="500.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o14">早期环境与 LLC 初始化</text>
  <text x="430.0" y="534.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o15">等待 BIST · 配置 SPM / 栈</text>
  <text x="430.0" y="568.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o16">PlatformRom=0：跳过平台钩子</text>
  <rect x="100" y="670" width="660" height="150" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="rom-main" />
  <text x="430.0" y="720.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o18">cheshire_bootrom.c · main</text>
  <text x="430.0" y="754.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o19">boot_mode / RTC 测频</text>
  <text x="430.0" y="788.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o20">boot_spi_s25fs512s 初始化 SPI</text>
  <rect x="100" y="890" width="660" height="110" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="gpt-load" />
  <text x="430.0" y="937.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o22">gpt_boot_part_else_raw</text>
  <text x="430.0" y="971.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o23">镜像字节 → SPM 的 code_buf</text>
  <rect x="100" y="1080" width="660" height="95" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="handoff" />
  <text x="430.0" y="1120.36" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o25">boot_next_stage</text>
  <text x="430.0" y="1154.36" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o26">jalr ra, 0(t0)</text>
  <rect x="890" y="280" width="660" height="100" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="payload-start" />
  <text x="1220.0" y="322.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o28">载荷 _start @ 镜像起点</text>
  <text x="1220.0" y="356.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o29">由 sw/lib/crt0.S 提供</text>
  <rect x="890" y="450" width="660" height="160" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="runtime" />
  <text x="1220.0" y="505.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o31">CRT0：应用运行环境</text>
  <text x="1220.0" y="539.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o32">sp / gp、mtvec、BSS、FP</text>
  <text x="1220.0" y="573.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o33">保存进入应用的 ra；call main</text>
  <rect x="890" y="710" width="660" height="170" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="app" />
  <text x="1220.0" y="770.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o35">载荷自己的 main()</text>
  <text x="1220.0" y="804.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o36">执行任务</text>
  <text x="1220.0" y="838.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o37">不返回则继续按程序运行</text>
  <rect x="890" y="1030" width="660" height="145" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="exit" />
  <text x="1220.0" y="1078.36" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o39">应用 CRT0 · _exit</text>
  <text x="1220.0" y="1112.36" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o40">scratch2 = (返回值 &lt;&lt; 1) | 1</text>
  <text x="1220.0" y="1146.36" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o41">恢复栈上 sp / gp / ra，然后 ret</text>
  <rect x="1680" y="280" width="620" height="220" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="running" />
  <text x="1990.0" y="365.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o43">return 不会自动停机</text>
  <text x="1990.0" y="399.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o44">不自动复位 / 断电 / 换权限</text>
  <text x="1990.0" y="433.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o45">CPU 仍由时钟驱动并继续取指</text>
  <rect x="1680" y="660" width="620" height="300" fill="#F1D7D9" stroke="#29292D" stroke-width="2" id="rom-return" />
  <text x="1990.0" y="751.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o47">当前 ROM 的调用后返回点</text>
  <text x="1990.0" y="785.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o48">boot_next_stage：jalr 后为 ret</text>
  <text x="1990.0" y="819.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o49">未保存上一层 ra</text>
  <text x="1990.0" y="853.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o50">可形成 ret 自循环（源码推导）</text>
  <text x="1990.0" y="887.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o51">不是按设计进入 ROM _exit</text>
  <rect x="1680" y="1040" width="620" height="150" fill="#FFFFFF" stroke="#29292D" stroke-width="2" id="observer" />
  <text x="1990.0" y="1090.86" font-family="Microsoft YaHei" font-size="29" fill="#29292D" font-weight="bold" text-anchor="middle" id="o53">仿真 / 调试器等外部观察者</text>
  <text x="1990.0" y="1124.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o54">读取 scratch2 完成标志</text>
  <text x="1990.0" y="1158.86" font-family="Microsoft YaHei" font-size="24" fill="#606773" font-weight="normal" text-anchor="middle" id="o55">TB 可结束仿真；不等于 CPU 停机</text>
  <line fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a314D66)" x1="430" y1="380" x2="430" y2="450" id="rom-step0" />
  <line fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a314D66)" x1="430" y1="600" x2="430" y2="670" id="rom-step1" />
  <line fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a314D66)" x1="430" y1="820" x2="430" y2="890" id="rom-step2" />
  <line fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a314D66)" x1="430" y1="1000" x2="430" y2="1080" id="rom-step3" />
  <text x="555" y="644" font-family="Microsoft YaHei" font-size="22" fill="#314D66" font-weight="normal" text-anchor="middle" id="o60">call main</text>
  <polyline fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a187C78)" points="760,1127 820,1127 820,330 890,330" id="jalr-entry" />
  <text x="818" y="1280" font-family="Microsoft YaHei" font-size="24" fill="#187C78" font-weight="normal" text-anchor="middle" id="o62">jalr：转入载荷入口</text>
  <line fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a187C78)" x1="1220" y1="380" x2="1220" y2="450" id="start-runtime" />
  <line fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a187C78)" x1="1220" y1="610" x2="1220" y2="710" id="runtime-main" />
  <text x="1390" y="666" font-family="Microsoft YaHei" font-size="23" fill="#187C78" font-weight="normal" text-anchor="middle" id="o65">call</text>
  <line fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a187C78)" x1="1220" y1="880" x2="1220" y2="1030" id="main-exit" />
  <text x="1390" y="967" font-family="Microsoft YaHei" font-size="23" fill="#187C78" font-weight="normal" text-anchor="middle" id="o67">main 正常返回</text>
  <polyline fill="none" stroke="#B96043" stroke-width="3" stroke-linejoin="miter" marker-end="url(#aB96043)" points="1550,1102 1600,1102 1600,810 1680,810" id="return-rom" />
  <text x="1610" y="780" font-family="Microsoft YaHei" font-size="22" fill="#B96043" font-weight="normal" text-anchor="middle" id="o69">ret</text>
  <polyline fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#a314D66)" points="1550,1152 1620,1152 1620,1115 1680,1115" id="observe" />
  <polyline fill="none" stroke="#B96043" stroke-width="3" stroke-linejoin="miter" marker-end="url(#aB96043)" points="2300,810 2320,810 2320,610 2100,610 2100,660" id="ret-loop" />
  <text x="2100" y="585" font-family="Microsoft YaHei" font-size="23" fill="#B96043" font-weight="normal" text-anchor="middle" id="o72">可能 ret 自循环</text>
  <line fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#a314D66)" x1="55" y1="1305" x2="120" y2="1305" id="legend0" />
  <text x="135" y="1313" font-family="Microsoft YaHei" font-size="22" fill="#314D66" font-weight="normal" text-anchor="start" id="o74">ROM 流程 / 观察</text>
  <line fill="none" stroke="#187C78" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#a187C78)" x1="585" y1="1305" x2="650" y2="1305" id="legend1" />
  <text x="665" y="1313" font-family="Microsoft YaHei" font-size="22" fill="#187C78" font-weight="normal" text-anchor="start" id="o76">载荷执行</text>
  <line fill="none" stroke="#B96043" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#aB96043)" x1="1115" y1="1305" x2="1180" y2="1305" id="legend2" />
  <text x="1195" y="1313" font-family="Microsoft YaHei" font-size="22" fill="#B96043" font-weight="normal" text-anchor="start" id="o78">当前返回路径缺口</text>
</svg>