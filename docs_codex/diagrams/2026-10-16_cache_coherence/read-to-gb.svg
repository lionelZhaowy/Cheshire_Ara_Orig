<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>DDR 地址数据搬入 GB：最新版本从哪里来</title>
<defs>
<marker id="data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#314D66"/></marker>
<marker id="control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#765489"/></marker>
<marker id="local" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#187C78"/></marker>
</defs>
<rect id="background" x="0" y="0" width="1920" height="1080" fill="#FFFFFF" stroke="none"/>
<text x="50" y="54" font-family="WenQuanYi Zen Hei" font-size="36" font-weight="700" text-anchor="start" fill="#29292D">DDR 地址数据搬入 GB：最新版本从哪里来</text>
<text x="50" y="96" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#606773">先发布输入并协调目标行，再由 DDR 或持有最新数据的缓存供数</text>
<rect id="row-0" x="40" y="150" width="1840" height="250" fill="#F7F9FA" stroke="#29292D" stroke-width="1.7"/>
<text x="65" y="190" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="start" fill="#29292D">A  DDR 已最新，无冲突在途事务</text>
<rect id="r0-0" x="70" y="222" width="380" height="110" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="260.0" y="270.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r0-0">DDR</text>
<text x="260.0" y="305.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r0-0">最新版本可读</text>
<rect id="r0-1" x="570" y="222" width="380" height="110" fill="#E8DFED" stroke="#29292D" stroke-width="1.7"/>
<text x="760.0" y="270.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r0-1">设备一致性入口</text>
<text x="760.0" y="305.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r0-1">确认 DDR 版本已最新</text>
<rect id="r0-2" x="1070" y="222" width="350" height="110" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="1245.0" y="270.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r0-2">搬运器</text>
<text x="1245.0" y="305.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r0-2">接收本次读取结果</text>
<rect id="r0-3" x="1550" y="222" width="290" height="110" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="1695.0" y="270.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r0-3">GB（经共享代理）</text>
<text x="1695.0" y="305.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r0-3">写入后发布 ready</text>
<polyline id="r0-flow-0" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="450,277 570,277"/>
<polyline id="r0-flow-1" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="950,277 1070,277"/>
<polyline id="r0-flow-2" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" points="1420,277 1550,277"/>
<text x="70" y="372" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#606773">DDR 已保存最新版本，L1D / LLC 的干净副本可以继续使用。</text>
<rect id="row-1" x="40" y="435" width="1840" height="250" fill="#F7F9FA" stroke="#29292D" stroke-width="1.7"/>
<text x="65" y="475" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="start" fill="#29292D">B  LLC 持有最新脏数据</text>
<rect id="r1-0" x="70" y="507" width="380" height="110" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="260.0" y="555.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r1-0">LLC 脏行</text>
<text x="260.0" y="590.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r1-0">比 DDR 更新</text>
<rect id="r1-1" x="570" y="507" width="380" height="110" fill="#E8DFED" stroke="#29292D" stroke-width="1.7"/>
<text x="760.0" y="555.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r1-1">设备一致性入口</text>
<text x="760.0" y="590.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r1-1">取得缓存数据</text>
<rect id="r1-2" x="1070" y="507" width="350" height="110" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="1245.0" y="555.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r1-2">搬运器</text>
<text x="1245.0" y="590.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r1-2">接收最新版本</text>
<rect id="r1-3" x="1550" y="507" width="290" height="110" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="1695.0" y="555.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r1-3">GB（经共享代理）</text>
<text x="1695.0" y="590.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r1-3">保存本次读取版本</text>
<polyline id="r1-flow-0" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="450,562 570,562"/>
<polyline id="r1-flow-1" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="950,562 1070,562"/>
<polyline id="r1-flow-2" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" points="1420,562 1550,562"/>
<text x="70" y="657" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#606773">缓存可直接供数（候选）；采用 DDR 供数路径时，先 clean 到 DDR 再读取。</text>
<rect id="row-2" x="40" y="720" width="1840" height="250" fill="#F7F9FA" stroke="#29292D" stroke-width="1.7"/>
<text x="65" y="760" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="start" fill="#29292D">C  CPU 有按顺序必须先完成的写</text>
<rect id="r2-0" x="70" y="792" width="380" height="110" fill="#F1D7D9" stroke="#29292D" stroke-width="1.7"/>
<text x="260.0" y="840.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r2-0">CPU 写缓冲</text>
<text x="260.0" y="875.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r2-0">建立发布顺序 / 排空</text>
<rect id="r2-1" x="570" y="792" width="380" height="110" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="760.0" y="840.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r2-1">LLC / 共享点</text>
<text x="760.0" y="875.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r2-1">接收已排序的更新</text>
<rect id="r2-2" x="1070" y="792" width="350" height="110" fill="#E8DFED" stroke="#29292D" stroke-width="1.7"/>
<text x="1245.0" y="840.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r2-2">协调后搬运</text>
<text x="1245.0" y="875.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r2-2">等待先行写可见</text>
<rect id="r2-3" x="1550" y="792" width="290" height="110" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="1695.0" y="840.0" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="700" text-anchor="middle" fill="#29292D" data-owner="r2-3">GB（经共享代理）</text>
<text x="1695.0" y="875.0" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="middle" fill="#29292D" data-owner="r2-3">数据完整后才 ready</text>
<polyline id="r2-flow-0" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="450,847 570,847"/>
<polyline id="r2-flow-1" fill="none" stroke="#314D66" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#data)" points="950,847 1070,847"/>
<polyline id="r2-flow-2" fill="none" stroke="#187C78" stroke-width="2.8" stroke-linejoin="miter" marker-end="url(#local)" points="1420,847 1550,847"/>
<text x="70" y="942" font-family="WenQuanYi Zen Hei" font-size="24" font-weight="400" text-anchor="start" fill="#606773">CPU 先发布输入；协调点等待相关写完成，并处理同址回填与替换。</text>
<text x="55" y="1030" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="400" text-anchor="start" fill="#29292D">GB 保存本次搬入的数据版本；后续计算需要更新后的源数据时，重新搬运。</text>
</svg>
