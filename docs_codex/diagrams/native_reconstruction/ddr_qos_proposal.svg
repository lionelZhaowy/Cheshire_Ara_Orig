  <text fill="#50667a" stroke="none" stroke-width="1" font-family="Microsoft YaHei" font-size="19" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="text-002" x="30" y="90" xml:space="preserve">工程建议，当前 RTL 尚未集成供应商 IP；Crossbar 原有结构沿用，ISP/NPU 数据直接进入控制器的不同 AXI Slave。</text>
  <rect fill="#e8f4ed" stroke="#b4d5c2" stroke-width="2" font-family="Arial" font-size="16" font-weight="normal" font-style="normal" text-anchor="start" stroke-dasharray="none" marker-start="none" marker-end="none" id="rect-002" x="30" y="112" width="1620" height="51" rx="0.0" ry="0.0" />
