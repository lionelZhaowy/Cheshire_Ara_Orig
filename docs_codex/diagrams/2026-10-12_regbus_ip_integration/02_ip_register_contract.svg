<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="970" viewBox="0 0 1800 970">
<rect x="0" y="0" width="1800" height="970" fill="#FFFFFF"/>
<text x="35" y="45" font-family="WenQuanYi Zen Hei" font-size="30" fill="#253447" text-anchor="start">② 自有 IP：需要实现的寄存器接口（建议结构，尚未接入）</text>
<text x="35" y="90" font-family="WenQuanYi Zen Hei" font-size="24" fill="#536174" text-anchor="start">本图采用同 clk_i 域示例；配置访问完成与 IP 运算完成是两个事件。</text>
<rect x="340" y="170" width="1040" height="635" fill="#FFFFFF" stroke="#253447" stroke-width="2" stroke-dasharray="8 5"/>
<text x="365" y="209" font-family="WenQuanYi Zen Hei" font-size="25" fill="#253447" text-anchor="start">IP 寄存器封装：可手写，或使用现有 reggen 生成</text>
<text x="35" y="294" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">reg_ext_slv_req_o[k]</text>
<text x="35" y="329" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">addr / write / wdata</text>
<text x="35" y="364" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">wstrb / valid</text>
<polyline points="45,390 410,390" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="410,390 399.0,385.5 399.0,394.5" fill="#205F9C"/>
<rect x="410" y="260" width="310" height="185" fill="#F8F0E6" stroke="#253447" stroke-width="2"/>
<text x="565.0" y="294" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">地址译码与访问控制</text>
<text x="565.0" y="326" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">offset = addr - BASE</text>
<text x="565.0" y="358" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">fire = valid &amp; ready</text>
<text x="565.0" y="390" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">wr_en = fire &amp; write</text>
<text x="565.0" y="422" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">按译码 / wstrb 写入</text>
<rect x="960" y="270" width="360" height="130" fill="#EDF5EB" stroke="#253447" stroke-width="2"/>
<text x="1140.0" y="304" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">配置 / 命令寄存器</text>
<text x="1140.0" y="336" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">参数、地址低位 / 高位</text>
<text x="1140.0" y="368" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">写 START 时提交命令</text>
<polyline points="720,340 960,340" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="960,340 949.0,335.5 949.0,344.5" fill="#205F9C"/>
<text x="745" y="316" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">写使能 / 写数据</text>
<rect x="1470" y="280" width="290" height="415" fill="#F1F5F9" stroke="#253447" stroke-width="2"/>
<text x="1615" y="320" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">IP 工作逻辑</text>
<text x="1615" y="400" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">接受命令</text>
<text x="1615" y="450" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">计算 / 搬运 / 接收</text>
<text x="1615" y="535" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">维护 busy / done / error</text>
<text x="1615" y="620" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">数据口另接 AXI / 流接口</text>
<polyline points="1320,340 1470,340" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1470,340 1459.0,335.5 1459.0,344.5" fill="#205F9C"/>
<text x="1340" y="320" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">配置 / 启动</text>
<rect x="1080" y="625" width="270" height="110" fill="#EDF5EB" stroke="#253447" stroke-width="2"/>
<text x="1215.0" y="659" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">状态 / 中断状态</text>
<text x="1215.0" y="691" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">busy / done / error</text>
<text x="1215.0" y="723" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">建议写 1 清除事件位</text>
<polyline points="1470,675 1350,675" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="1350,675 1361.0,679.5 1361.0,670.5" fill="#205F9C"/>
<text x="1390" y="649" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">状态</text>
<rect x="490" y="575" width="350" height="170" fill="#F1F5F9" stroke="#253447" stroke-width="2"/>
<text x="665.0" y="609" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">读数据选择与访问响应</text>
<text x="665.0" y="641" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">rdata = 选中寄存器值</text>
<text x="665.0" y="673" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">ready = 本次访问可完成</text>
<text x="665.0" y="705" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="middle">error = 地址 / 权限等错误</text>
<polyline points="570,445 570,575" fill="none" stroke="#925021" stroke-width="2.4" stroke-linejoin="miter" stroke-dasharray="8 5"/>
<polygon points="570,575 574.5,564.0 565.5,564.0" fill="#925021"/>
<text x="594" y="515" font-family="WenQuanYi Zen Hei" font-size="23" fill="#925021" text-anchor="start">offset / 访问属性</text>
<polyline points="1120,400 1120,480 900,480 900,620 840,620" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="840,620 851.0,624.5 851.0,615.5" fill="#205F9C"/>
<text x="950" y="462" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">配置回读</text>
<polyline points="1080,685 840,685" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="840,685 851.0,689.5 851.0,680.5" fill="#205F9C"/>
<text x="901" y="666" font-family="WenQuanYi Zen Hei" font-size="23" fill="#253447" text-anchor="start">状态回读</text>
<polyline points="1215,772 1215,735" fill="none" stroke="#925021" stroke-width="2.4" stroke-linejoin="miter" stroke-dasharray="8 5"/>
<polygon points="1215,735 1210.5,746.0 1219.5,746.0" fill="#925021"/>
<text x="1070" y="797" font-family="WenQuanYi Zen Hei" font-size="23" fill="#925021" text-anchor="start">合法 W1C 写生成清除使能</text>
<polyline points="490,655 45,655" fill="none" stroke="#205F9C" stroke-width="2.4" stroke-linejoin="miter"/>
<polygon points="45,655 56.0,659.5 56.0,650.5" fill="#205F9C"/>
<text x="35" y="599" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">reg_ext_slv_rsp_i[k]</text>
<text x="35" y="634" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">rdata / error / ready</text>
<text x="40" y="862" font-family="WenQuanYi Zen Hei" font-size="24" fill="#253447" text-anchor="start">短寄存器访问及时应答；长任务用 busy / done 或中断报告，不让 ready 一直等到任务完成。</text>
<text x="40" y="909" font-family="WenQuanYi Zen Hei" font-size="24" fill="#536174" text-anchor="start">中断另接 SoC 中断输入；跨时钟时，事务或配置/状态传递必须有明确的 CDC 与复位方案。</text>
</svg>