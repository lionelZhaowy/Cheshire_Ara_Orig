<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<title>DMA 与 LLC/SPM 的死锁结构、形成过程及 AW 解耦位置</title>
<defs>
<marker id="blue" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#2E75A6"/></marker>
<marker id="purple" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#8060A4"/></marker>
<marker id="red" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#BA4548"/></marker>
<marker id="green" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#2F8068"/></marker>
</defs>
<rect id="box1" x="0" y="0" width="1600" height="1160" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text id="text2" x="50" y="55" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#243746" text-anchor="start">DMA—LLC/SPM：死锁结构与解耦位置</text>
<text id="text3" x="50" y="100" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#243746" text-anchor="start">同一 SPM 内搬运，源/目的不重叠；默认 DECOUPLE_AW = 0</text>
<polyline id="arrow4" points="910,94 950,94" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<text id="text5" x="960" y="102" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#8060A4" text-anchor="start">地址/描述符</text>
<polyline id="arrow6" points="1140,94 1180,94" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text7" x="1190" y="102" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#2E75A6" text-anchor="start">数据方向</text>
<polyline id="arrow8" points="1350,94 1390,94" fill="none" stroke="#BA4548" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#red)"/>
<text id="text9" x="1400" y="102" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="start">阻塞/因果</text>
<rect id="box10" x="50" y="150" width="380" height="520" rx="10" fill="#EDF4FC" stroke="#567082" stroke-width="2"/>
<rect id="box11" x="690" y="150" width="860" height="520" rx="10" fill="#F3F7F4" stroke="#567082" stroke-width="2"/>
<text id="text12" x="75" y="185" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#243746" text-anchor="start">iDMA</text>
<text id="text13" x="715" y="185" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#243746" text-anchor="start">同一个 LLC / SPM</text>
<rect id="box14" x="90" y="210" width="300" height="85" rx="10" fill="#EEE6F6" stroke="#8060A4" stroke-width="2"/>
<text id="text15" x="240" y="243" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#243746" text-anchor="middle">AR 发出 / AW 耦合</text>
<text id="text16" x="240" y="278" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#8060A4" text-anchor="middle">AW 等对应 R 首拍</text>
<polyline id="arrow17" points="390,230 720,230" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<text id="text18" x="535" y="217" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#8060A4" text-anchor="middle">AR：源读地址</text>
<polyline id="arrow19" points="390,275 650,275 650,277 720,277" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<text id="text20" x="535" y="309" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#8060A4" text-anchor="middle">AW：目的写地址</text>
<rect id="box21" x="720" y="210" width="790" height="85" rx="10" fill="#F5EFF8" stroke="#8060A4" stroke-width="2"/>
<text id="text22" x="740" y="237" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#8060A4" text-anchor="start">共享描述符流水线</text>
<rect id="box23" x="750" y="250" width="280" height="35" rx="5" fill="#FCE9E8" stroke="#BA4548" stroke-width="2"/>
<text id="text24" x="890" y="276" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">后到：写（等前方释放）</text>
<rect id="box25" x="1170" y="250" width="310" height="35" rx="5" fill="#FCE9E8" stroke="#BA4548" stroke-width="2"/>
<text id="text26" x="1325" y="276" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">前方：读（未完成）</text>
<polyline id="arrow27" points="1030,267 1170,267" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<text id="text28" x="1100" y="247" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#8060A4" text-anchor="middle">前进方向</text>
<polyline id="arrow29" points="1510,255 1530,255 1530,325 1135,325 1135,355" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<polyline id="arrow30" points="1530,325 1530,640 1135,640 1135,610" fill="none" stroke="#BA4548" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#red)"/>
<text id="text31" x="1310" y="634" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="middle">写描述符未能送达</text>
<rect id="box32" x="1030" y="355" width="210" height="90" rx="10" fill="#E8F0FA" stroke="#567082" stroke-width="2"/>
<text id="text33" x="1135" y="389" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#243746" text-anchor="middle">读单元</text>
<text id="text34" x="1135" y="425" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="middle">当前读未完成</text>
<rect id="box35" x="730" y="355" width="210" height="90" rx="10" fill="#FCE9E8" stroke="#BA4548" stroke-width="2"/>
<text id="text36" x="835" y="390" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#243746" text-anchor="middle">R 返回 FIFO</text>
<text id="text37" x="835" y="425" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">满，无法继续存入</text>
<rect id="box38" x="1280" y="355" width="230" height="255" rx="10" fill="#E6F0E3" stroke="#567082" stroke-width="2"/>
<text id="text39" x="1395" y="389" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#243746" text-anchor="middle">SPM 存储阵列</text>
<rect id="box40" x="1300" y="410" width="190" height="65" rx="10" fill="#F7FAF4" stroke="#567082" stroke-width="2"/>
<text id="text41" x="1395" y="450" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#243746" text-anchor="middle">源区域</text>
<rect id="box42" x="1300" y="520" width="190" height="65" rx="10" fill="#F7FAF4" stroke="#567082" stroke-width="2"/>
<text id="text43" x="1395" y="560" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#243746" text-anchor="middle">目的区域</text>
<polyline id="arrow44" points="1300,440 1260,440 1260,400 1240,400" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<polyline id="arrow45" points="1030,400 940,400" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text46" x="985" y="381" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#2E75A6" text-anchor="middle">读出</text>
<rect id="box47" x="90" y="365" width="300" height="100" rx="10" fill="#FCE9E8" stroke="#BA4548" stroke-width="2"/>
<text id="text48" x="240" y="403" font-family="Microsoft YaHei" font-size="27" font-weight="bold" fill="#BA4548" text-anchor="middle">数据 FIFO 已满</text>
<text id="text49" x="240" y="441" font-family="Microsoft YaHei" font-size="26" font-weight="normal" fill="#BA4548" text-anchor="middle">RREADY = 0</text>
<polyline id="arrow50" points="730,400 390,400" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text51" x="560" y="380" font-family="Microsoft YaHei" font-size="23" font-weight="normal" fill="#2E75A6" text-anchor="middle">R：LLC → DMA</text>
<text id="text52" x="560" y="436" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#BA4548" text-anchor="middle">读返回暂停</text>
<rect id="box53" x="90" y="535" width="300" height="75" rx="10" fill="#E8F0FA" stroke="#567082" stroke-width="2"/>
<text id="text54" x="240" y="567" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#243746" text-anchor="middle">DMA 写数据通路</text>
<text id="text55" x="240" y="598" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="middle">等待 W 握手</text>
<polyline id="arrow56" points="240,465 240,535" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text57" x="260" y="505" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="start">不能出队</text>
<rect id="box58" x="730" y="520" width="210" height="90" rx="10" fill="#FCE9E8" stroke="#BA4548" stroke-width="2"/>
<text id="text59" x="835" y="555" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#243746" text-anchor="middle">W 数据 FIFO</text>
<text id="text60" x="835" y="591" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#BA4548" text-anchor="middle">数据排不出去</text>
<rect id="box61" x="1030" y="520" width="210" height="90" rx="10" fill="#FFF1E1" stroke="#567082" stroke-width="2"/>
<text id="text62" x="1135" y="555" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#243746" text-anchor="middle">写单元</text>
<text id="text63" x="1135" y="591" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">空闲，等描述符</text>
<polyline id="arrow64" points="390,570 730,570" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text65" x="560" y="549" font-family="Microsoft YaHei" font-size="23" font-weight="normal" fill="#2E75A6" text-anchor="middle">W：DMA → LLC</text>
<text id="text66" x="560" y="601" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#BA4548" text-anchor="middle">WREADY = 0</text>
<polyline id="arrow67" points="940,565 1030,565" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<polyline id="arrow68" points="1240,555 1300,555" fill="none" stroke="#2E75A6" stroke-width="3" marker-end="url(#blue)"/>
<text id="text69" x="560" y="654" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#567082" text-anchor="middle">中间互连及缓冲合并表示</text>
<text id="text70" x="50" y="725" font-family="Microsoft YaHei" font-size="29" font-weight="bold" fill="#243746" text-anchor="start">形成过程：读请求先行 → 写被挡住 → 反压形成循环</text>
<rect id="box71" x="50" y="780" width="260" height="100" rx="10" fill="#FCEEEE" stroke="#BA4548" stroke-width="2"/>
<text id="text72" x="180" y="820" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#243746" text-anchor="middle">① 写描述符被阻挡</text>
<text id="text73" x="180" y="856" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">LLC 无法消耗 W 数据</text>
<polyline id="arrow74" points="310,830 360,830" fill="none" stroke="#BA4548" stroke-width="3" marker-end="url(#red)"/>
<rect id="box75" x="360" y="780" width="260" height="100" rx="10" fill="#FCEEEE" stroke="#BA4548" stroke-width="2"/>
<text id="text76" x="490" y="820" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#243746" text-anchor="middle">② DMA FIFO 填满</text>
<text id="text77" x="490" y="856" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">写不出，读入占满空间</text>
<polyline id="arrow78" points="620,830 670,830" fill="none" stroke="#BA4548" stroke-width="3" marker-end="url(#red)"/>
<rect id="box79" x="670" y="780" width="260" height="100" rx="10" fill="#FCEEEE" stroke="#BA4548" stroke-width="2"/>
<text id="text80" x="800" y="820" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#243746" text-anchor="middle">③ DMA 停止接收 R</text>
<text id="text81" x="800" y="856" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">RREADY 拉低为 0</text>
<polyline id="arrow82" points="930,830 980,830" fill="none" stroke="#BA4548" stroke-width="3" marker-end="url(#red)"/>
<rect id="box83" x="980" y="780" width="260" height="100" rx="10" fill="#FCEEEE" stroke="#BA4548" stroke-width="2"/>
<text id="text84" x="1110" y="820" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#243746" text-anchor="middle">④ LLC 返回 FIFO 满</text>
<text id="text85" x="1110" y="856" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">前面的读请求停住</text>
<polyline id="arrow86" points="1240,830 1290,830" fill="none" stroke="#BA4548" stroke-width="3" marker-end="url(#red)"/>
<rect id="box87" x="1290" y="780" width="260" height="100" rx="10" fill="#FCEEEE" stroke="#BA4548" stroke-width="2"/>
<text id="text88" x="1420" y="820" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#243746" text-anchor="middle">⑤ 共享流水线停住</text>
<text id="text89" x="1420" y="856" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#BA4548" text-anchor="middle">后面的写仍无法前进</text>
<polyline id="arrow90" points="1420,880 1420,935 180,935 180,880" fill="none" stroke="#BA4548" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#red)"/>
<text id="text91" x="800" y="970" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#BA4548" text-anchor="middle">循环中的反压本身合理，但没有任何一方能再释放空间</text>
<rect id="box92" x="50" y="1010" width="1500" height="105" rx="10" fill="#E5F3EC" stroke="#2F8068" stroke-width="2"/>
<text id="text93" x="75" y="1049" font-family="Microsoft YaHei" font-size="27" font-weight="bold" fill="#2F8068" text-anchor="start">原对齐用例：DECOUPLE_AW = 1 可避开上述循环</text>
<text id="text94" x="75" y="1089" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#2F8068" text-anchor="start">提前发 AW</text>
<polyline id="arrow95" points="260,1080 335,1080" fill="none" stroke="#2F8068" stroke-width="3" marker-end="url(#green)"/>
<text id="text96" x="355" y="1089" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#2F8068" text-anchor="start">写请求更早进入</text>
<polyline id="arrow97" points="580,1080 655,1080" fill="none" stroke="#2F8068" stroke-width="3" marker-end="url(#green)"/>
<text id="text98" x="675" y="1089" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#2F8068" text-anchor="start">W 数据排出 / FIFO 腾空</text>
<polyline id="arrow99" points="1000,1080 1075,1080" fill="none" stroke="#2F8068" stroke-width="3" marker-end="url(#green)"/>
<text id="text100" x="1095" y="1089" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#2F8068" text-anchor="start">DMA 继续接收 R</text>
<polyline id="read-first-event" points="125,365 125,295" fill="none" stroke="#8060A4" stroke-width="3" marker-end="url(#purple)"/>
<text id="read-first-label" x="150" y="337" font-family="Microsoft YaHei" font-size="20" fill="#8060A4">R 首拍握手事件</text>
<text id="aw-already-sent" x="560" y="338" font-family="Microsoft YaHei" font-size="20" fill="#BA4548" text-anchor="middle">首条已发，但入队偏晚</text>
</svg>
