<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="50" y="34" width="7" height="50" fill="#218078" stroke="none"/><text x="74" y="66.6" font-family="Microsoft YaHei" font-size="40" font-weight="bold" fill="#193047">SPI NAND：改选 3 V 系列，Quad SDR / 100 MHz 待验证</text><text x="74" y="109.62" font-family="Microsoft YaHei" font-size="23" font-weight="normal" fill="#53677B">适配 3.3 V PAD：改评估 W25N-LV；原 W25N-MW 为 1.8 V 方案，不再作为直接连接候选。</text><rect x="50" y="126" width="1500" height="44" fill="#DFEAF2" stroke="none"/><text x="66" y="156.5" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#163B56">候选：W25N08LV，8 Gbit（1 GiB）、3 V 档  |  10 MHz 联调 → 50 MHz 验证 → 条件满足后评估 100 MHz</text><g transform="translate(0 180)"><defs xmlns="http://www.w3.org/2000/svg"><marker id="arrow-blue" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#246DA0" /></marker><marker id="arrow-teal" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#218078" /></marker></defs><rect xmlns="http://www.w3.org/2000/svg" id="d1" x="50" y="38" width="465" height="147" rx="6" fill="#E8F1FA" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d2" x="70" y="66" font-family="Microsoft YaHei" font-size="23" font-weight="bold" text-anchor="start" fill="#193047">片外 SPI NAND：按页读取，器件内纠错</text><rect xmlns="http://www.w3.org/2000/svg" id="d3" x="70" y="84" width="115" height="80" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d4" x="127.5" y="115" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">NAND</text><text xmlns="http://www.w3.org/2000/svg" id="d5" x="127.5" y="146" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">参数阵列</text><rect xmlns="http://www.w3.org/2000/svg" id="d6" x="225" y="84" width="110" height="80" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d7" x="280.0" y="115" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">ECC</text><text xmlns="http://www.w3.org/2000/svg" id="d8" x="280.0" y="146" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">纠错状态</text><rect xmlns="http://www.w3.org/2000/svg" id="d9" x="375" y="84" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d10" x="435.0" y="115" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">页缓存</text><text xmlns="http://www.w3.org/2000/svg" id="d11" x="435.0" y="146" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">串行输出</text><polyline xmlns="http://www.w3.org/2000/svg" id="d12" points="185,125 225,125" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><polyline xmlns="http://www.w3.org/2000/svg" id="d13" points="335,125 375,125" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect xmlns="http://www.w3.org/2000/svg" id="d14" x="680" y="84" width="180" height="80" rx="6" fill="#FFF1DD" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d15" x="770" y="114" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">I/O PAD</text><text xmlns="http://www.w3.org/2000/svg" id="d16" x="770" y="145" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#193047">3.3 V / 采样</text><polyline xmlns="http://www.w3.org/2000/svg" id="d17" points="495,125 680,125" fill="none" stroke="#246DA0" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d18" x="590" y="99" font-family="Microsoft YaHei" font-size="18" font-weight="normal" text-anchor="middle" fill="#193047">SCK / CS# / IO</text><rect xmlns="http://www.w3.org/2000/svg" id="d19" x="975" y="84" width="180" height="80" rx="6" fill="#E0EFE9" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d20" x="1065" y="114" font-family="Microsoft YaHei" font-size="26" font-weight="bold" text-anchor="middle" fill="#193047">SPI Host</text><text xmlns="http://www.w3.org/2000/svg" id="d21" x="1065" y="145" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">现有 RTL / FIFO</text><polyline xmlns="http://www.w3.org/2000/svg" id="d22" points="860,125 975,125" fill="none" stroke="#246DA0" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" /><rect xmlns="http://www.w3.org/2000/svg" id="d23" x="1245" y="84" width="150" height="80" rx="6" fill="#EEE8F6" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d24" x="1320" y="114" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">CPU 驱动</text><text xmlns="http://www.w3.org/2000/svg" id="d25" x="1320" y="145" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">读出并搬运</text><polyline xmlns="http://www.w3.org/2000/svg" id="d26" points="1155,125 1245,125" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d27" x="1200" y="99" font-family="Microsoft YaHei" font-size="19" font-weight="normal" text-anchor="middle" fill="#193047">MMIO</text><polyline xmlns="http://www.w3.org/2000/svg" id="d28" points="1320,84 1320,17 1065,17 1065,84" fill="none" stroke="#218078" stroke-width="2.8" marker-end="url(#arrow-teal)" stroke-dasharray="7 5" /><text xmlns="http://www.w3.org/2000/svg" id="d29" x="1190" y="8" font-family="Microsoft YaHei" font-size="19" font-weight="normal" text-anchor="middle" fill="#218078">配置 / 命令</text><rect xmlns="http://www.w3.org/2000/svg" id="d30" x="1470" y="84" width="80" height="80" rx="6" fill="#FFF1DD" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d31" x="1510" y="129" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">DDR</text><polyline xmlns="http://www.w3.org/2000/svg" id="d32" points="1395,125 1470,125" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d33" x="800" y="216" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#53677B">候选读取路径；当前 SPI Host 无独立 DMA 口。片内 ECC 不等于 eMMC 式完整介质管理。</text></g><rect x="50" y="422" width="735" height="34" fill="#163B56" stroke="none"/><text x="62" y="448.56" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">接口与协议：SPI 命令 + NAND 页访问</text><rect x="50" y="456" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="484.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">信号 / 模式</text><text x="190" y="482.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">CS#、SCK：主机输出；IO[3:0]：按事务改变方向。</text><text x="190" y="507.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">Quad 为四线数据阶段，不等于所有命令均为四线。</text><rect x="50" y="514" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="542.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">一次页读取</text><text x="190" y="540.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">发页地址 / 读页命令 → 等待就绪并检查 ECC。</text><text x="190" y="565.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">再发读缓存命令，按列地址 / dummy 周期接收数据。</text><rect x="50" y="572" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="600.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">软件职责</text><text x="190" y="598.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">识别器件、配置 ECC / Quad、管理坏块与预留块。</text><text x="190" y="623.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">检查不可纠错错误；CPU 排空 FIFO 并写入 DDR。</text><rect x="50" y="630" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="658.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">候选容量</text><text x="190" y="656.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">8 Gbit = 1 GiB；页为 4096 B + 256 B 备用区。</text><text x="190" y="681.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">双份 500 MiB 仅余 24 MiB，坏块预留空间过紧。</text><rect x="810" y="422" width="740" height="34" fill="#163B56" stroke="none"/><text x="822" y="448.56" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">频率、I/O 与系统吞吐：复用存在约束</text><rect x="810" y="456" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="484.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">工作频率</text><text x="950" y="482.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">10 / 50 MHz 逐步联调，Quad 100 MHz 为目标。</text><text x="950" y="507.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">LV 系列标称 STR 最高 133 MHz，非系统保证。</text><rect x="810" y="514" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="542.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">时钟前提</text><text x="950" y="540.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">当前 SCK = clk_i / [2 × (CLKDIV + 1)]。</text><text x="950" y="565.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">100 MHz SCK 要求 clk_i ≥200 MHz 且分频匹配。</text><rect x="810" y="572" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="600.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">物理实现</text><text x="950" y="598.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">LV 系列确认 3 V 档；8 Gbit 后缀电气表待确认。</text><text x="950" y="623.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">按 3.3 V PAD / WB 评估；100 MHz 须校核裕量。</text><rect x="810" y="630" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="658.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">主要风险</text><text x="950" y="656.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">现有控制器无独立 DMA；Regbus / CPU 可能限速。</text><text x="950" y="681.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">不能只换 Flash：需 NAND 驱动与错误 / 掉电验证。</text><rect x="50" y="701" width="1500" height="37" fill="#163B56" stroke="none"/><text x="59" y="727.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#FFFFFF">方案 / 建议数据模式</text><text x="379" y="727.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#FFFFFF">纯线速（不含开销）</text><text x="674" y="727.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#FFFFFF">500 MiB 线速下限</text><text x="989" y="727.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#FFFFFF">评估结论</text><rect x="50" y="738" width="1500" height="37" fill="#E9F1EC" stroke="none"/><text x="59" y="763.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">eMMC · 8-bit SDR 50 MHz</text><text x="379" y="763.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">50 MB/s ≈ 47.7 MiB/s</text><text x="674" y="763.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">约 10.5 秒</text><text x="989" y="763.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">优先评估：新增主机 / DMA 与 I/O</text><rect x="50" y="775" width="1500" height="37" fill="#FFFFFF" stroke="none"/><text x="59" y="800.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">SPI NAND · Quad SDR 100 MHz</text><text x="379" y="800.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">50 MB/s ≈ 47.7 MiB/s</text><text x="674" y="800.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">约 10.5 秒</text><text x="989" y="800.74" font-family="Microsoft YaHei" font-size="21" font-weight="normal" fill="#193047">备选：时钟、页读取、软件搬运须达标</text><text x="50" y="834.8" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#9B6828">验收口径：完整 500 MiB 初始化 + 加载 + 校验 ≤30 秒；SPI Quad 50 MHz 仅 23.8 MiB/s 线速，低于 25 MiB/s 设计目标。</text><rect x="50" y="839" width="1500" height="1" fill="#CAD5DF" stroke="none"/><a href="https://www.winbond.com/hq/product/code-storage-flash/qspi-nand/w25n-lv/?__locale=en"><text x="50" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">Winbond W25N-LV：3 V / 8 Gbit</text></a><a href="https://winbond.com/hq/product/code-storage-flash/qspi-nand/w25n-lv/?__locale=en&amp;partNo=W25N04LVCEIG"><text x="505" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">同系列 4 Gbit：2.7–3.6 V 详情</text></a><a href="https://www.micron.com/products/storage/nand-flash/choosing-the-right-nand"><text x="955" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">NAND 管理职责：Micron</text></a><text x="50" y="893.04" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#53677B">公开资料选型示例；频率为建议评估值，非当前工程已达标结果。  |  2026-10-13 · 修订 3</text><text x="1490" y="893.04" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#53677B">2/2</text></svg>