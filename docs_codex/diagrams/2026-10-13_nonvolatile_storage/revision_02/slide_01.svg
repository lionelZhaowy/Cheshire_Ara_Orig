<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="50" y="34" width="7" height="50" fill="#218078" stroke="none"/><text x="74" y="66.6" font-family="Microsoft YaHei" font-size="40" font-weight="bold" fill="#193047">eMMC 方案：8-bit SDR / 50 MHz，优先评估</text><text x="74" y="109.62" font-family="Microsoft YaHei" font-size="23" font-weight="normal" fill="#53677B">目标：约 500 MiB 校正参数断电保存，开机加载到 DDR；允许 30 秒，NOR 继续承担启动。</text><rect x="50" y="126" width="1500" height="44" fill="#DFEAF2" stroke="none"/><text x="66" y="156.5" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#163B56">建议配置：4 GB 工业级 eMMC 5.1  |  1-bit、≤400 kHz 初始化  →  8-bit High Speed SDR、50 MHz</text><g transform="translate(0 180)"><defs xmlns="http://www.w3.org/2000/svg"><marker id="arrow-blue" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#246DA0" /></marker><marker id="arrow-teal" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#218078" /></marker></defs><rect xmlns="http://www.w3.org/2000/svg" id="d1" x="50" y="38" width="430" height="147" rx="6" fill="#E8F1FA" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d2" x="70" y="66" font-family="Microsoft YaHei" font-size="23" font-weight="bold" text-anchor="start" fill="#193047">eMMC 器件：NAND + 管理控制器</text><rect xmlns="http://www.w3.org/2000/svg" id="d3" x="68" y="84" width="130" height="80" rx="6" fill="#D6E7F5" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d4" x="133" y="115" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">NAND</text><text xmlns="http://www.w3.org/2000/svg" id="d5" x="133" y="146" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#193047">参数存储</text><rect xmlns="http://www.w3.org/2000/svg" id="d6" x="235" y="84" width="225" height="80" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d7" x="347" y="115" font-family="Microsoft YaHei" font-size="24" font-weight="bold" text-anchor="middle" fill="#193047">介质管理 / ECC</text><text xmlns="http://www.w3.org/2000/svg" id="d8" x="347" y="146" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">坏块、磨损、地址映射</text><polyline xmlns="http://www.w3.org/2000/svg" id="d9" points="198,125 235,125" fill="none" stroke="#246DA0" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" /><rect xmlns="http://www.w3.org/2000/svg" id="d10" x="685" y="84" width="220" height="80" rx="6" fill="#FFF1DD" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d11" x="795" y="114" font-family="Microsoft YaHei" font-size="22" font-weight="bold" text-anchor="middle" fill="#193047">I/O PAD + 收发时序</text><text xmlns="http://www.w3.org/2000/svg" id="d12" x="795" y="145" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#193047">电平、驱动、采样</text><polyline xmlns="http://www.w3.org/2000/svg" id="d13" points="460,125 685,125" fill="none" stroke="#246DA0" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d14" x="580" y="99" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#193047">CLK / CMD / DAT</text><text xmlns="http://www.w3.org/2000/svg" id="d15" x="580" y="154" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#193047">单端数字接口</text><rect xmlns="http://www.w3.org/2000/svg" id="d16" x="1035" y="84" width="260" height="80" rx="6" fill="#E0EFE9" stroke="#193047" stroke-width="1.6" stroke-dasharray="8 5" /><text xmlns="http://www.w3.org/2000/svg" id="d17" x="1165" y="113" font-family="Microsoft YaHei" font-size="25" font-weight="bold" text-anchor="middle" fill="#193047">SoC eMMC 主机</text><text xmlns="http://www.w3.org/2000/svg" id="d18" x="1165" y="145" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">命令 / CRC / FIFO / DMA</text><polyline xmlns="http://www.w3.org/2000/svg" id="d19" points="905,125 1035,125" fill="none" stroke="#246DA0" stroke-width="2.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d20" x="970" y="99" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#193047">片内接口</text><rect xmlns="http://www.w3.org/2000/svg" id="d21" x="1085" y="3" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#218078" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d22" x="1165" y="32" font-family="Microsoft YaHei" font-size="22" font-weight="bold" text-anchor="middle" fill="#193047">CPU 配置</text><polyline xmlns="http://www.w3.org/2000/svg" id="d23" points="1165,47 1165,84" fill="none" stroke="#218078" stroke-width="2.8" marker-end="url(#arrow-teal)" stroke-dasharray="7 5" /><rect xmlns="http://www.w3.org/2000/svg" id="d24" x="1425" y="84" width="125" height="80" rx="6" fill="#EEE8F6" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d25" x="1487" y="116" font-family="Microsoft YaHei" font-size="27" font-weight="bold" text-anchor="middle" fill="#193047">DDR</text><text xmlns="http://www.w3.org/2000/svg" id="d26" x="1487" y="146" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">运行参数</text><polyline xmlns="http://www.w3.org/2000/svg" id="d27" points="1295,125 1425,125" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d28" x="1360" y="99" font-family="Microsoft YaHei" font-size="20" font-weight="normal" text-anchor="middle" fill="#193047">AXI 写入</text><text xmlns="http://www.w3.org/2000/svg" id="d29" x="800" y="216" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#53677B">双箭头合并总线交互；读参数方向为左 → 右。主机控制器与 eMMC 内部管理控制器职责不同。</text></g><rect x="50" y="422" width="735" height="34" fill="#163B56" stroke="none"/><text x="62" y="448.56" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">接口与协议：命令、响应、数据分开传输</text><rect x="50" y="456" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="484.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">信号 / 引脚</text><text x="190" y="482.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">CLK：主机输出；CMD：双向命令与响应。</text><text x="190" y="507.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">DAT[7:0]：双向数据；RST_n：按器件配置使用。</text><rect x="50" y="514" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="542.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">数据规则</text><text x="190" y="540.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">按逻辑块读写；主机检查响应、CRC 与超时。</text><text x="190" y="565.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">DAT0 可指示忙；无 AXI 式逐拍 VALID / READY。</text><rect x="50" y="572" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="600.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">初始化</text><text x="190" y="598.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">识别器件 → 读取能力 → CMD6 配置总线与模式。</text><text x="190" y="623.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">先低速初始化，再切 8-bit / High Speed 并提高 CLK。</text><rect x="50" y="630" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="658.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">连续读取</text><text x="190" y="656.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">CMD18 多块读 → 接收数据 → DMA 写 DDR。</text><text x="190" y="681.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">命令响应 ≠ 搬运完成；检查错误后校验参数包。</text><rect x="50" y="688" width="735" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="60" y="716.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">模式边界</text><text x="190" y="714.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">当前建议 SDR：每周期每根数据线传 1 bit。</text><text x="190" y="739.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">DS 用于 HS400；本建议模式不使用 DS 采样。</text><rect x="810" y="422" width="740" height="34" fill="#163B56" stroke="none"/><text x="822" y="448.56" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">器件选型与 ASIC 实现：控制器、I/O、时序分层</text><rect x="810" y="456" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="484.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">候选器件</text><text x="950" y="482.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">Kingston E04GS14DXI：4 GB、MLC、-40～85°C。</text><text x="950" y="507.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">8 GB 备选 EMMC08G-WV28；均为公开选型示例。</text><rect x="810" y="514" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="542.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">频率 / 带宽</text><text x="950" y="540.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">50 MHz × 8 bit = 50 MB/s ≈ 47.7 MiB/s 线速。</text><text x="950" y="565.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">SDR 规格上限 52 MHz；50 MHz 是建议工作点。</text><rect x="810" y="572" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="600.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">电气 / PHY</text><text x="950" y="598.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">单端数字接口；必须配置匹配 VCCQ 的 I/O PAD。</text><text x="950" y="623.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">评估 1.8 V I/O；VCC、VCCQ 与电源时序按料号。</text><rect x="810" y="630" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="658.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">实现边界</text><text x="950" y="656.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">SDR 可评估数字收发 + I/O；仍须完成时序收敛。</text><text x="950" y="681.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">HS200/HS400 常需调谐、DLL/延迟线等 PHY 功能。</text><rect x="810" y="688" width="740" height="58" fill="#FFFFFF" stroke="#CAD5DF"/><text x="820" y="716.68" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#246DA0">工程改动</text><text x="950" y="714.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">新增主机 / DMA、驱动及 I/O；需确认 IP 交付边界。</text><text x="950" y="739.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">确认 PAD、采样、PCB 裕量后，实测完整加载时间。</text><rect x="50" y="760" width="1500" height="64" fill="#E0EFE9" stroke="none"/><text x="66" y="788.62" font-family="Microsoft YaHei" font-size="23" font-weight="bold" fill="#218078">预算：500 MiB ÷ 30 s = 16.7 MiB/s 下限；建议有效搬运 ≥25 MiB/s，20 s 搬运 + 约 10 s 初始化 / 校验。</text><text x="66" y="817.68" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#193047">容量：可建议 A/B 两份参数（约 1000 MiB），保留增长余量；更新须完成落盘、校验与版本切换，并验证掉电恢复。</text><rect x="50" y="839" width="1500" height="1" fill="#CAD5DF" stroke="none"/><a href="https://media.kingston.com/pdfs/emmc/itemp-emmc_flyer_en.pdf?_=v1"><text x="50" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">器件：Kingston 工业级 eMMC</text></a><a href="https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/791/JESD84_2D00_B51-_2800_1_2900_.pdf"><text x="450" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">协议：JEDEC 5.1（TI 托管）</text></a><a href="https://www.synopsys.com/designware-ip/interface-ip/mobile-storage/sd-emmc-phy.html"><text x="880" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">PHY：Synopsys 实现示例</text></a><a href="https://www.micron.com/products/storage/managed-nand/emmc"><text x="1270" y="867.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#246DA0">Micron eMMC</text></a><text x="50" y="893.04" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#53677B">公开资料选型示例；频率为建议评估值，非当前工程已达标结果。  |  2026-10-13 · 修订 2</text><text x="1490" y="893.04" font-family="Microsoft YaHei" font-size="16" font-weight="normal" fill="#53677B">1/2</text></svg>