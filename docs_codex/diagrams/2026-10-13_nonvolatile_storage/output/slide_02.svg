<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7F9FC"/><rect x="60" y="43" width="8" height="58" fill="#218078" stroke="none"/><text x="88" y="81.24" font-family="Microsoft YaHei" font-size="46" font-weight="bold" fill="#193047">SPI NAND：复用 SPI Host 的扩容候选</text><text x="88" y="134.32" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#53677B">W25N-MW 示例：最高 8 Gbit = 1 GiB；NAND 驱动需新增，NOR 驱动不能直接复用。</text><g transform="translate(0 158)"><defs xmlns="http://www.w3.org/2000/svg"><marker id="arrow-blue" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#246DA0" /></marker><marker id="arrow-teal" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#218078" /></marker></defs><rect xmlns="http://www.w3.org/2000/svg" id="d1" x="60" y="58" width="600" height="202" rx="6" fill="#EAF3FA" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d2" x="82" y="93" font-family="Microsoft YaHei" font-size="26" font-weight="bold" text-anchor="start" fill="#193047">片外 SPI NAND · 断电保存参数</text><rect xmlns="http://www.w3.org/2000/svg" id="d3" x="85" y="122" width="155" height="107" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d4" x="162.5" y="164" font-family="Microsoft YaHei" font-size="26" font-weight="bold" text-anchor="middle" fill="#193047">NAND 阵列</text><text xmlns="http://www.w3.org/2000/svg" id="d5" x="162.5" y="203" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">按页读取</text><rect xmlns="http://www.w3.org/2000/svg" id="d6" x="290" y="122" width="125" height="107" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d7" x="352.5" y="164" font-family="Microsoft YaHei" font-size="26" font-weight="bold" text-anchor="middle" fill="#193047">ECC</text><text xmlns="http://www.w3.org/2000/svg" id="d8" x="352.5" y="203" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">器件内纠错</text><rect xmlns="http://www.w3.org/2000/svg" id="d9" x="465" y="122" width="165" height="107" rx="6" fill="#FFFFFF" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d10" x="547.5" y="164" font-family="Microsoft YaHei" font-size="26" font-weight="bold" text-anchor="middle" fill="#193047">页缓存</text><text xmlns="http://www.w3.org/2000/svg" id="d11" x="547.5" y="203" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">串行输出</text><polyline xmlns="http://www.w3.org/2000/svg" id="d12" points="240,177 290,177" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><polyline xmlns="http://www.w3.org/2000/svg" id="d13" points="415,177 465,177" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><rect xmlns="http://www.w3.org/2000/svg" id="d14" x="755" y="122" width="200" height="107" rx="6" fill="#E4F2ED" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d15" x="855" y="164" font-family="Microsoft YaHei" font-size="29" font-weight="bold" text-anchor="middle" fill="#193047">SPI Host</text><text xmlns="http://www.w3.org/2000/svg" id="d16" x="855" y="203" font-family="Microsoft YaHei" font-size="24" font-weight="normal" text-anchor="middle" fill="#193047">接收 FIFO</text><polyline xmlns="http://www.w3.org/2000/svg" id="d17" points="630,177 755,177" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d18" x="704" y="152" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">Quad</text><rect xmlns="http://www.w3.org/2000/svg" id="d19" x="1055" y="122" width="230" height="107" rx="6" fill="#F0ECF7" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d20" x="1170" y="164" font-family="Microsoft YaHei" font-size="28" font-weight="bold" text-anchor="middle" fill="#193047">CPU / 驱动</text><text xmlns="http://www.w3.org/2000/svg" id="d21" x="1170" y="203" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">读 FIFO、写 DDR</text><polyline xmlns="http://www.w3.org/2000/svg" id="d22" points="955,177 1055,177" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d23" x="1005" y="152" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#193047">MMIO</text><polyline xmlns="http://www.w3.org/2000/svg" id="d24" points="1170,122 1170,38 855,38 855,122" fill="none" stroke="#218078" stroke-width="2.8" marker-end="url(#arrow-teal)" stroke-dasharray="7 5" /><text xmlns="http://www.w3.org/2000/svg" id="d25" x="1015" y="25" font-family="Microsoft YaHei" font-size="22" font-weight="normal" text-anchor="middle" fill="#218078">配置 / 读命令</text><rect xmlns="http://www.w3.org/2000/svg" id="d26" x="1400" y="122" width="140" height="107" rx="6" fill="#FFF0D9" stroke="#193047" stroke-width="1.6" /><text xmlns="http://www.w3.org/2000/svg" id="d27" x="1470" y="165" font-family="Microsoft YaHei" font-size="30" font-weight="bold" text-anchor="middle" fill="#193047">DDR</text><text xmlns="http://www.w3.org/2000/svg" id="d28" x="1470" y="204" font-family="Microsoft YaHei" font-size="23" font-weight="normal" text-anchor="middle" fill="#193047">参数副本</text><polyline xmlns="http://www.w3.org/2000/svg" id="d29" points="1285,177 1400,177" fill="none" stroke="#246DA0" stroke-width="2.8" marker-end="url(#arrow-blue)" /><text xmlns="http://www.w3.org/2000/svg" id="d30" x="1342" y="152" font-family="Microsoft YaHei" font-size="21" font-weight="normal" text-anchor="middle" fill="#193047">存储写入</text><text xmlns="http://www.w3.org/2000/svg" id="d31" x="800" y="293" font-family="Microsoft YaHei" font-size="24" font-weight="normal" text-anchor="middle" fill="#53677B">候选路径：复用 SPI Host，新增 NAND 驱动；未假设现有 SPI 已具备 DMA 搬运。</text></g><rect x="60" y="478" width="1480" height="47" fill="#163B56" stroke="none"/><text x="75" y="510.44" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#FFFFFF">比较项</text><text x="340" y="510.44" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#FFFFFF">eMMC</text><text x="925" y="510.44" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#FFFFFF">SPI NAND</text><rect x="60" y="525" width="1480" height="47" fill="#FFFFFF" stroke="none"/><text x="75" y="556.5" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#193047">容量选择</text><text x="340" y="556.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">建议 4 GB / 8 GB，方便扩展</text><text x="925" y="556.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">示例 1 GiB；双份 500 MiB 余量紧</text><rect x="60" y="572" width="1480" height="47" fill="#EDF2F6" stroke="none"/><text x="75" y="603.5" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#193047">硬件与软件</text><text x="340" y="603.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">新增主机 / DMA；器件管理介质</text><text x="925" y="603.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">评估复用 SPI；驱动处理页、ECC、坏块</text><rect x="60" y="619" width="1480" height="47" fill="#FFFFFF" stroke="none"/><text x="75" y="650.5" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#193047">性能验收</text><text x="340" y="650.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">测量主机 DMA 至 DDR 有效吞吐</text><text x="925" y="650.5" font-family="Microsoft YaHei" font-size="25" font-weight="normal" fill="#193047">核对 Quad、时钟、FIFO 与软件搬运</text><rect x="60" y="686" width="1480" height="90" fill="#E3F0EA" stroke="none"/><text x="82" y="724.26" font-family="Microsoft YaHei" font-size="29" font-weight="bold" fill="#218078">带宽下限：500 ÷ 30 = 16.7 MiB/s     建议有效搬运目标：≥25 MiB/s</text><text x="82" y="762.56" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#193047">25 MiB/s 对应约 20 秒搬运，另留约 10 秒初始化与校验；器件标称速度不等于系统吞吐。</text><text x="60" y="821.32" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#193047">选择建议：优先评估 eMMC；SPI NAND 在 Quad 读取与端到端性能达标后，可作为备选。</text><rect x="60" y="849" width="1480" height="1" fill="#CAD5DF" stroke="none"/><a href="https://www.winbond.com/hq/product/code-storage-flash/qspi-nand/w25n-mw/index.html?__locale=en"><text x="60" y="879.86" font-family="Microsoft YaHei" font-size="19" font-weight="normal" fill="#246DA0">官方资料：Winbond W25N-MW  ·  点击打开规格与文档</text></a><text x="1200" y="878.92" font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#53677B">方案评估 · 2026.10.13   2/2</text></svg>