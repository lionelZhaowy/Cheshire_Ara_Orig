<text x="40" y="1039" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">RegExtNumSlv / RegExtNumRules；RegExtRegionStart / End / Idx 定义扩展。</text>
<text x="40" y="1070" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">gen_axi_out + gen_reg_out 生成两级规则；默认外部端口数为 0，开启后需顶层接线。</text>
<text x="40" y="1101" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">请求：addr[47:0] / write / wdata[31:0] / wstrb[3:0] / valid；响应：rdata[31:0] / error / ready。</text>
<text x="40" y="1132" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">同域可直连；异域需 reg_cdc。图像/权重等批量搬运使用独立数据接口。</text>
<text x="40" y="1236" font-family="WenQuanYi Zen Hei" font-size="24" fill="#606773" text-anchor="start">配对端口表示图示连接；已有/规划状态见模块和连接表。方向与 A 版一致。虚线模块表示规划。</text>
