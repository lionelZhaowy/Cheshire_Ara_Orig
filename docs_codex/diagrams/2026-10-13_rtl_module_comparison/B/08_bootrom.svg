<rect x="0" y="0" width="2400" height="963" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="40" y="46" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start" font-weight="bold">08  BootROM：组合 ROM 内容与 Regbus 应答延迟</text>
<text x="40" y="90" font-family="WenQuanYi Zen Hei" font-size="25" fill="#606773" text-anchor="start">B  工业端口图：同一 E 编号的两端相连；完整信号组、方向与用途见共用连接表。</text>
<rect x="40" y="145" width="730" height="320" fill="#D8E8F4" stroke="#29292D" stroke-width="1.7"/>
<text x="58" y="174" font-family="WenQuanYi Zen Hei" font-size="22" fill="#606773" text-anchor="start">N01  内部工作逻辑</text>
<text x="405" y="209" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="middle" font-weight="bold">1  reg_to_mem</text>
<text x="405" y="241" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">地址截为 16-bit</text>
<text x="405" y="273" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">req / we / addr</text>
<text x="405" y="305" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">gnt = req</text>
<text x="405" y="337" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">rvalid / rerror 返回</text>
<rect x="55" y="368" width="700" height="83" fill="#FFFFFF" stroke="#B8BDC5" stroke-width="1"/>
<polyline id="E01-target" points="25,393 76,393" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)" marker-start="url(#m314D66)"/>
<text x="89" y="401" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="start">E01 ↔ P01</text>
<polyline id="E05-target" points="25,428 76,428" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="89" y="436" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="start">E05 ← N03</text>
<polyline id="E02-source" points="734,393 785,393" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="720" y="401" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="end">E02 → N02</text>
<polyline id="E04-source" points="734,428 785,428" fill="none" stroke="#765489" stroke-width="2.5" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m765489)"/>
<text x="720" y="436" font-family="WenQuanYi Zen Hei" font-size="23" fill="#765489" text-anchor="end">E04 → N03</text>
<rect x="835" y="145" width="730" height="285" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="853" y="174" font-family="WenQuanYi Zen Hei" font-size="22" fill="#606773" text-anchor="start">N02  状态/存储</text>
<text x="1200" y="209" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="middle" font-weight="bold">2  cheshire_bootrom</text>
<text x="1200" y="241" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">word = addr / 4</text>
<text x="1200" y="273" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">case(word) → data[31:0]</text>
<text x="1200" y="305" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">当前生成内容：2048 words</text>
<text x="1200" y="337" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">组合查表；clk / rst 未用</text>
<rect x="850" y="368" width="700" height="48" fill="#FFFFFF" stroke="#B8BDC5" stroke-width="1"/>
<polyline id="E02-target" points="820,393 871,393" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="884" y="401" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="start">E02 ← N01</text>
<polyline id="E03-source" points="1529,393 1580,393" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="1515" y="401" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="end">E03 → N03</text>
<rect x="835" y="470" width="730" height="157" fill="#F5E1C9" stroke="#29292D" stroke-width="1.7"/>
<text x="853" y="499" font-family="WenQuanYi Zen Hei" font-size="22" fill="#606773" text-anchor="start">P01  外部/组边界</text>
<text x="1200" y="534" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="middle" font-weight="bold">Regbus 32</text>
<rect x="850" y="565" width="700" height="48" fill="#FFFFFF" stroke="#B8BDC5" stroke-width="1"/>
<polyline id="E01-source" points="1529,590 1580,590" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)" marker-start="url(#m314D66)"/>
<text x="1515" y="598" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="end">E01 ↔ N01</text>
<rect x="1630" y="145" width="730" height="288" fill="#D9EEE8" stroke="#29292D" stroke-width="1.7"/>
<text x="1648" y="174" font-family="WenQuanYi Zen Hei" font-size="22" fill="#606773" text-anchor="start">N03  状态/存储</text>
<text x="1995" y="209" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="middle" font-weight="bold">3  FF 延迟对齐</text>
<text x="1995" y="241" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">data_q ← data</text>
<text x="1995" y="273" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">req_q ← req</text>
<text x="1995" y="305" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">we_q ← we</text>
<rect x="1645" y="336" width="700" height="83" fill="#FFFFFF" stroke="#B8BDC5" stroke-width="1"/>
<polyline id="E03-target" points="1615,361 1666,361" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="1679" y="369" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="start">E03 ← N02</text>
<polyline id="E04-target" points="1615,396 1666,396" fill="none" stroke="#765489" stroke-width="2.5" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m765489)"/>
<text x="1679" y="404" font-family="WenQuanYi Zen Hei" font-size="23" fill="#765489" text-anchor="start">E04 ← N01</text>
<polyline id="E05-source" points="2324,361 2375,361" fill="none" stroke="#314D66" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m314D66)"/>
<text x="2310" y="369" font-family="WenQuanYi Zen Hei" font-size="23" fill="#314D66" text-anchor="end">E05 → N01</text>
<text x="40" y="677" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">Cfg.Bootrom 生成分支；clk_i / rst_ni</text>
<text x="40" y="708" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">Regbus 32</text>
<text x="40" y="739" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">req / we 同步延迟</text>
<text x="40" y="770" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">rdata = data_q；rvalid = req_q；rerror = we_q</text>
<text x="40" y="801" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">软件源 .S / .c → 链接与 ROM 生成脚本 → cheshire_bootrom.sv 常量内容</text>
<text x="40" y="832" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">写访问返回错误；16-bit 接口窗口不等于 64 KiB 唯一 ROM 内容。</text>
<text x="40" y="936" font-family="WenQuanYi Zen Hei" font-size="24" fill="#606773" text-anchor="start">配对端口表示图示连接；已有/规划状态见模块和连接表。方向与 A 版一致。虚线模块表示规划。</text>
</svg>