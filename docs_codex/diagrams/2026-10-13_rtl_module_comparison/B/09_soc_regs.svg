<text x="1200" y="273" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">reg_we / reg_re</text>
<text x="1200" y="305" font-family="WenQuanYi Zen Hei" font-size="23" fill="#23354B" text-anchor="middle">字节写使能 / 未命中错误</text>
