<text x="40" y="1172" font-family="WenQuanYi Zen Hei" font-size="24" fill="#606773" text-anchor="start">配对端口表示图示连接；已有/规划状态见模块和连接表。方向与 A 版一致。虚线模块表示规划。</text>
