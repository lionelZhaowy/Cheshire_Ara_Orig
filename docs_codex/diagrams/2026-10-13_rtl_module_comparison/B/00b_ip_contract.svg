<text x="40" y="975" font-family="WenQuanYi Zen Hei" font-size="23" fill="#606773" text-anchor="start">合法 Regbus 写握手与 wstrb 共同定义写使能；是否使用 addr - BASE 由 IP 封装约定。</text>
