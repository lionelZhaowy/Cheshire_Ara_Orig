<text x="1172.5" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  serial_link_data_link</text>
<text x="1172.5" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">接收缓冲 / 流控</text>
<text x="1172.5" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">payload 拆分 / 重组</text>
<text x="1172.5" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">raw mode 支路</text>
<polyline id="E02" points="865,280 1000,280" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m28699B)" marker-start="url(#m28699B)"/>
