<text x="735.0" y="692.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">Regbus → 可选 reg_cdc → 配置</text>
<text x="735.0" y="724.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">TX clk_div / raw mode / FIFO 控制</text>
<text x="735.0" y="756.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">当前 SoC 的三路逻辑时钟都接 clk_i</text>
<polyline id="E06" points="1005,695 1260,695" fill="none" stroke="#9C5B25" stroke-width="2.5" stroke-linejoin="miter" stroke-dasharray="8 5" marker-end="url(#m9C5B25)"/>
