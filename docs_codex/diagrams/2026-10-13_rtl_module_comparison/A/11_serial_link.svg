<rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">11  Serial Link：AXI 通道编码、流控与源同步物理传输</text>
<rect x="40" y="185" width="335" height="190" fill="#EAF1F8" stroke="#23354B" stroke-width="1.7"/>
<text x="207.5" y="224.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  SoC 外层适配</text>
<text x="207.5" y="256.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">出站地址 domain / mask</text>
<text x="207.5" y="288.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">axi_id_remap</text>
<text x="207.5" y="320.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AMO 标记适配</text>
<text x="207.5" y="352.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">对端入站 → 本地 AXI</text>
<rect x="500" y="185" width="365" height="190" fill="#EAF1F8" stroke="#23354B" stroke-width="1.7"/>
<text x="682.5" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  serial_link_network</text>
<text x="682.5" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AXI AW / W / B / AR / R</text>
<text x="682.5" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">通道仲裁 / 封装 / 还原</text>
<text x="682.5" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AXI ↔ payload stream</text>
<polyline id="E01" points="375,280 500,280" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m28699B)" marker-start="url(#m28699B)"/>
