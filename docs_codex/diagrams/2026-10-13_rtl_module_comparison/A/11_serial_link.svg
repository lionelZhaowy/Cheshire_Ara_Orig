<text x="1600.0" y="240.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">4  channel_allocator</text>
<text x="1600.0" y="272.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">NumChannels &gt; 1 时</text>
<text x="1600.0" y="304.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">分配与还原通道</text>
<text x="1600.0" y="336.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">单通道直接连接</text>
