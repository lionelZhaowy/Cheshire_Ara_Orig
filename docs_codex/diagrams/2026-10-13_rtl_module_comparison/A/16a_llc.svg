<text x="680.0" y="235.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">2  axi_llc_hit_miss</text>
<text x="680.0" y="267.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">tag_store / valid / dirty</text>
<text x="680.0" y="299.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">锁定与同 ID 顺序约束</text>
