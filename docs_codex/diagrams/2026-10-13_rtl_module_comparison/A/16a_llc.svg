<rect x="0" y="0" width="1800" height="1040" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="40" y="49" font-family="WenQuanYi Zen Hei" font-size="32" fill="#23354B" text-anchor="start">16A  LLC：描述符命中 / 缺失路径与共享数据 SRAM</text>
<rect x="35" y="185" width="340" height="180" fill="#EAF1F8" stroke="#23354B" stroke-width="1.7"/>
<text x="205.0" y="235.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">1  isolate / demux</text>
<text x="205.0" y="267.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">入口隔离与 bypass</text>
<text x="205.0" y="299.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">chan_splitter / 仲裁</text>
<text x="205.0" y="331.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">AW / AR → 描述符</text>
