<text x="1177.5" y="235.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">3  evict → refill</text>
<text x="1177.5" y="267.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">必要时写回脏行</text>
<text x="1177.5" y="299.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">从外存补入 cache line</text>
