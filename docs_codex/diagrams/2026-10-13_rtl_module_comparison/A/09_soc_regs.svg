<text x="1004.5" y="240.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E02</text>
<rect x="979.0" y="523.5" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="1003.5" y="544.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E03</text>
<rect x="1029.0" y="638.5" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="1053.5" y="659.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E04</text>
<rect x="699.0" y="491.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="723.5" y="512.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#9C5B25" text-anchor="middle" font-weight="bold">E05</text>
<rect x="312.5" y="679.0" width="49" height="27" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="337.0" y="700.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#28699B" text-anchor="middle" font-weight="bold">E06</text>
<text x="40" y="1000" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="start">E 编号对应图下连接表；总线双箭头合并请求/响应；单箭头含义以表为准。</text>
<text x="40" y="1028" font-family="WenQuanYi Zen Hei" font-size="22" fill="#56697F" text-anchor="start">虚线连线表示控制/事件；虚线模块表示规划。交叉无圆点不连接。A：连续走线。</text>
</svg>