<rect x="0" y="0" width="1800" height="1030" fill="#FFFFFF" stroke="none" stroke-width="1.7"/>
<text x="35" y="45" font-family="WenQuanYi Zen Hei" font-size="30" fill="#23354B" text-anchor="start">② 自有 IP：需要实现的寄存器接口（建议结构，尚未接入）</text>
<text x="35" y="90" font-family="WenQuanYi Zen Hei" font-size="24" fill="#536174" text-anchor="start">本图采用同 clk_i 域示例；配置访问完成与 IP 运算完成是两个事件。</text>
<rect x="340" y="170" width="1040" height="635" fill="#FFFFFF" stroke="#23354B" stroke-width="1.7" stroke-dasharray="8 5"/>
<text x="365" y="209" font-family="WenQuanYi Zen Hei" font-size="25" fill="#23354B" text-anchor="start">IP 寄存器封装：可手写，或使用现有 reggen 生成</text>
<text x="35" y="294" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">reg_ext_slv_req_o[k]</text>
<text x="35" y="329" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">addr / write / wdata</text>
<text x="35" y="364" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">wstrb / valid</text>
<polyline id="E01" points="45,390 410,390" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m28699B)"/>
<rect x="410" y="260" width="310" height="185" fill="#F8F0E6" stroke="#23354B" stroke-width="1.7" stroke-dasharray="8 5"/>
<text x="565.0" y="296.5" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">地址译码与访问控制</text>
<text x="565.0" y="328.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">offset = addr - BASE</text>
<text x="565.0" y="360.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">fire = valid &amp; ready</text>
<text x="565.0" y="392.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">wr_en = fire &amp; write</text>
<text x="565.0" y="424.5" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">按译码 / wstrb 写入</text>
