<text x="1070" y="797" font-family="WenQuanYi Zen Hei" font-size="23" fill="#925021" text-anchor="start">合法 W1C 写从访问译码生成清除使能</text>
<polyline id="E09" points="490,655 45,655" fill="none" stroke="#28699B" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#m28699B)"/>
<text x="35" y="599" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">reg_ext_slv_rsp_i[k]</text>
<text x="35" y="634" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">rdata / error / ready</text>
<text x="40" y="862" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="start">短寄存器访问及时应答；长任务用 busy / done 或中断报告，不让 ready 一直等到任务完成。</text>
<text x="40" y="909" font-family="WenQuanYi Zen Hei" font-size="24" fill="#536174" text-anchor="start">中断另接 SoC 中断输入；跨时钟时，事务或配置/状态传递必须有明确的 CDC 与复位方案。</text>
