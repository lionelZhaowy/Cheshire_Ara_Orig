<text x="1140.0" y="311.0" font-family="WenQuanYi Zen Hei" font-size="24" fill="#23354B" text-anchor="middle">配置 / 命令寄存器</text>
<text x="1140.0" y="343.0" font-family="WenQuanYi Zen Hei" font-size="22" fill="#23354B" text-anchor="middle">参数、地址低位 / 高位</text>
