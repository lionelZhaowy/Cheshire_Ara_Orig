<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
<title>一次推理任务：控制、计算与数据交接</title>
<defs>
<marker id="control" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#765489"/></marker>
<marker id="data" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#314D66"/></marker>
<marker id="vector" markerUnits="strokeWidth" markerWidth="3" markerHeight="3" viewBox="0 0 3 3" refX="3" refY="1.5" orient="auto-start-reverse"><polygon points="0,0 3,1.5 0,3" fill="#187C78"/></marker>
</defs>
<rect id="page" x="0" y="0" width="2400" height="1350" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="1200.0" y="68" font-family="WenQuanYi Zen Hei" font-size="43" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="">一次推理任务：控制、计算与数据交接</text>
<text x="1200.0" y="115" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#606773" text-anchor="middle" data-owner="">未来 NPU / GB 场景的逻辑职责；不是冻结的 RTL 拓扑，也不引入 CPU 直访 GB</text>
<rect id="control-region" x="50" y="200" width="2300" height="235" fill="#F0EAF6" stroke="#645C5D" stroke-width="2"/>
<text x="75" y="233" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="start" data-owner="">控制与完成</text>
<rect id="app" x="80" y="255" width="420" height="130" fill="#FFFFFF" stroke="#29292D" stroke-width="2"/>
<text x="290.0" y="312.0" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="app">CVA6 应用 / 运行时</text>
<text x="290.0" y="349.0" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="app">分词 / 执行计划 / 采样</text>
<rect id="driver" x="650" y="255" width="450" height="130" fill="#FFFFFF" stroke="#29292D" stroke-width="2"/>
<text x="875.0" y="312.0" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="driver">驱动 / OS 适配</text>
<text x="875.0" y="349.0" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="driver">发布 / 提交 / 等待 / 恢复</text>
<rect id="task" x="1320" y="255" width="440" height="130" fill="#FFFFFF" stroke="#29292D" stroke-width="2" stroke-dasharray="10 6"/>
<text x="1540.0" y="312.0" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="task">NPU 任务控制（候选）</text>
<text x="1540.0" y="349.0" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="task">协调搬运与计算状态</text>
<rect id="done" x="1930" y="255" width="350" height="130" fill="#FFFFFF" stroke="#29292D" stroke-width="2" stroke-dasharray="10 6"/>
<text x="2105.0" y="312.0" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="done">完成与错误状态</text>
<text x="2105.0" y="349.0" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="done">按任务契约交付</text>
<polyline id="app-driver" points="500,320 650,320" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)"/>
<text x="575" y="298" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">请求</text>
<polyline id="driver-task" points="1100,320 1320,320" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)"/>
<text x="1210" y="298" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">有序提交</text>
<polyline id="task-done" points="1760,320 1930,320" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)"/>
<text x="1845" y="298" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">状态汇总</text>
<polyline id="completion" points="2105,255 2105,175 875,175 875,255" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)"/>
<text x="1510" y="158" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">状态 / IRQ 通知；驱动核实结果可见与错误</text>
<rect id="data-region" x="50" y="540" width="2300" height="595" fill="#F4F7F8" stroke="#645C5D" stroke-width="2"/>
<text x="1100" y="580" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="start" data-owner="">数据与计算资源</text>
<rect id="ddr" x="80" y="680" width="380" height="180" fill="#D8E8F4" stroke="#29292D" stroke-width="2"/>
<text x="270.0" y="743.5" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="ddr">DDR 主存</text>
<text x="270.0" y="780.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="ddr">权重 / KV / 输入</text>
<text x="270.0" y="817.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="ddr">需回主存的结果</text>
<rect id="mover" x="650" y="680" width="400" height="180" fill="#F5E1C9" stroke="#29292D" stroke-width="2" stroke-dasharray="10 6"/>
<text x="850.0" y="743.5" font-family="WenQuanYi Zen Hei" font-size="28" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="mover">DDR ↔ GB 搬运职责</text>
<text x="850.0" y="780.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="mover">候选实现</text>
<text x="850.0" y="817.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="mover">地址 / 长度 / 同步 / 错误</text>
<rect id="gb" x="1250" y="680" width="400" height="180" fill="#D9EEE8" stroke="#29292D" stroke-width="2" stroke-dasharray="10 6"/>
<text x="1450.0" y="743.5" font-family="WenQuanYi Zen Hei" font-size="28" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="gb">GB：独立片上 SRAM</text>
<text x="1450.0" y="780.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="gb">需求已确认，尚待实现</text>
<text x="1450.0" y="817.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="gb">分块就绪 / 所有权 / 复用</text>
<rect id="npu" x="1900" y="680" width="380" height="180" fill="#F1D7D9" stroke="#29292D" stroke-width="2" stroke-dasharray="10 6"/>
<text x="2090.0" y="743.5" font-family="WenQuanYi Zen Hei" font-size="29" font-weight="bold" fill="#29292D" text-anchor="middle" data-owner="npu">NPU 计算单元</text>
<text x="2090.0" y="780.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="npu">候选算子后端</text>
<text x="2090.0" y="817.5" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="npu">读取输入 / 写入结果</text>
<polyline id="cpu-memory" points="290,385 290,680" fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)"/>
<text x="310" y="482" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#314D66" text-anchor="start" data-owner="">经现有普通内存路径</text>
<text x="310" y="518" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#314D66" text-anchor="start" data-owner="">含 L1D / 写缓冲 / LLC</text>
<polyline id="move-control" points="1430,385 1430,475 850,475 850,680" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)"/>
<text x="1120" y="459" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">搬运命令 / 状态</text>
<polyline id="compute-control" points="1550,385 1550,490 2090,490 2090,680" fill="none" stroke="#765489" stroke-width="3" stroke-linejoin="miter" marker-end="url(#control)" marker-start="url(#control)"/>
<text x="1820" y="474" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#765489" text-anchor="middle" data-owner="">计算命令 / 状态</text>
<polyline id="ddr-move" points="460,770 650,770" fill="none" stroke="#314D66" stroke-width="3" stroke-linejoin="miter" marker-end="url(#data)" marker-start="url(#data)"/>
<text x="555" y="739" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#314D66" text-anchor="middle" data-owner="">旁路数据</text>
<polyline id="move-gb" points="1050,770 1250,770" fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#vector)" marker-start="url(#vector)"/>
<text x="1150" y="739" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#187C78" text-anchor="middle" data-owner="">显式搬运</text>
<polyline id="gb-npu" points="1650,770 1900,770" fill="none" stroke="#187C78" stroke-width="3" stroke-linejoin="miter" marker-end="url(#vector)" marker-start="url(#vector)"/>
<text x="1775" y="739" font-family="WenQuanYi Zen Hei" font-size="25" font-weight="normal" fill="#187C78" text-anchor="middle" data-owner="">计算读 / 写</text>
<text x="100" y="963" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="bold" fill="#29292D" text-anchor="start" data-owner="">① 发布输入</text>
<text x="100" y="1009" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">顺序与可见性成立后交给设备</text>
<text x="100" y="1051" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">同步措施依平台一致性契约</text>
<text x="880" y="963" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="bold" fill="#29292D" text-anchor="start" data-owner="">② 分块执行</text>
<text x="880" y="1009" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">GB 就绪后计算；结果按需搬回 DDR</text>
<text x="880" y="1051" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">不得把 GB 当作透明缓存</text>
<text x="1640" y="963" font-family="WenQuanYi Zen Hei" font-size="30" font-weight="bold" fill="#29292D" text-anchor="start" data-owner="">③ 交付结果</text>
<text x="1640" y="1009" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">计算结束 ≠ 结果可消费</text>
<text x="1640" y="1051" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="start" data-owner="">写回、同步与错误检查满足任务契约</text>
<text x="1200" y="1200" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#29292D" text-anchor="middle" data-owner="">紫：控制与状态    蓝灰：主存访问    绿：GB 数据    虚线：候选或尚待实现的职责</text>
<text x="1200" y="1260" font-family="WenQuanYi Zen Hei" font-size="27" font-weight="normal" fill="#606773" text-anchor="middle" data-owner="">OS 负责组织任务和资源；平台负责兑现地址、缓存与完成语义。算子分工及具体连接仍待验证。</text>
</svg>
