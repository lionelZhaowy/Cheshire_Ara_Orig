<text x="407.5" y="473.0" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="normal" text-anchor="middle" fill="#20334A">MMIO 提交 / 完成轮询</text>
<polyline points="495,445 648,445 648,350" fill="none" stroke="#3574A8" stroke-width="3" marker-end="url(#data)" marker-start="url(#data)"/>
<rect x="805" y="115" width="205" height="85" rx="8" fill="#E8F1F8" stroke="#3574A8" stroke-width="2"/>
<text x="907.5" y="157.5" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="bold" text-anchor="middle" fill="#20334A">原子适配 + LLC</text>
<text x="907.5" y="185.5" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="normal" text-anchor="middle" fill="#20334A">LLC / SPM 共用 SRAM</text>
<polyline points="740,156 805,156" fill="none" stroke="#3574A8" stroke-width="3" marker-end="url(#data)" marker-start="url(#data)"/>
<rect x="1080" y="115" width="305" height="85" rx="8" fill="#E8F1F8" stroke="#3574A8" stroke-width="2"/>
<text x="1232.5" y="157.5" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="bold" text-anchor="middle" fill="#20334A">现有平台外存</text>
<text x="1232.5" y="185.5" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="normal" text-anchor="middle" fill="#20334A">FPGA DDR4 / 仿真存储模型</text>
<polyline points="1010,156 1080,156" fill="none" stroke="#3574A8" stroke-width="3" marker-end="url(#data)" marker-start="url(#data)"/>
<rect x="805" y="265" width="205" height="85" rx="8" fill="#E8F1F8" stroke="#3574A8" stroke-width="2"/>
<text x="907.5" y="307.5" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="bold" text-anchor="middle" fill="#20334A">Regbus / 中断</text>
<text x="907.5" y="335.5" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="normal" text-anchor="middle" fill="#20334A">Boot ROM / PLIC / CLINT</text>
<polyline points="740,307 805,307" fill="none" stroke="#7955A0" stroke-width="3" marker-end="url(#control)" marker-start="url(#control)"/>
<rect x="1080" y="265" width="305" height="85" rx="8" fill="#FFF1E1" stroke="#BE7127" stroke-width="2" stroke-dasharray="9 5"/>
<text x="1232.5" y="307.5" font-family="WenQuanYi Zen Hei" font-size="21" font-weight="bold" text-anchor="middle" fill="#20334A">LVDS / ISP / NPU / 独立 GB</text>
<text x="1232.5" y="335.5" font-family="WenQuanYi Zen Hei" font-size="16" font-weight="normal" text-anchor="middle" fill="#20334A">当前顶层尚无接入</text>
<text x="45" y="525" font-family="WenQuanYi Zen Hei" font-size="17" font-weight="normal" text-anchor="start" fill="#20334A">实线：当前 RTL 路径（启用条件见报告）    虚线框：待实现对象；无实线表示尚未接通</text>
</svg>
