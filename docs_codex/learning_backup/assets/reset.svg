<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title"><title id="title">reset 到 Boot ROM、crt0、main 的 JTAG 启动时序教学示意</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker></defs><rect width="1000" height="720" fill="white"/><text x="25" y="32" font-size="21" fill="#173749">JTAG 直载启动时序 · 时间向下，间隔不按比例</text><rect x="13" y="58" width="224" height="46" rx="7" fill="#eaf2f6" stroke="#b5ccd7"/><text x="125" y="87" text-anchor="middle" font-size="17" fill="#193e50">CVA6 / PC</text><path d="M125 104V620" stroke="#b9cbd5" stroke-dasharray="5 5"/><rect x="263" y="58" width="224" height="46" rx="7" fill="#eaf2f6" stroke="#b5ccd7"/><text x="375" y="87" text-anchor="middle" font-size="17" fill="#193e50">Boot ROM / 存储</text><path d="M375 104V620" stroke="#b9cbd5" stroke-dasharray="5 5"/><rect x="513" y="58" width="224" height="46" rx="7" fill="#eaf2f6" stroke="#b5ccd7"/><text x="625" y="87" text-anchor="middle" font-size="17" fill="#193e50">主机 VIP / JTAG</text><path d="M625 104V620" stroke="#b9cbd5" stroke-dasharray="5 5"/><rect x="763" y="58" width="224" height="46" rx="7" fill="#eaf2f6" stroke="#b5ccd7"/><text x="875" y="87" text-anchor="middle" font-size="17" fill="#193e50">应用 crt0 / main</text><path d="M875 104V620" stroke="#b9cbd5" stroke-dasharray="5 5"/><path d="M125 143H375" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="250.0" y="134" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">reset → 取指 0x02000000</text><path d="M375 185h45v20h-45" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="371" y="196" text-anchor="end" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">等 BIST；全 SPM；设置栈</text><path d="M625 264H375" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="255" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">轮询 LLC SPM 配置标志</text><path d="M625 321H125" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="375.0" y="312" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">halt hart0</text><path d="M625 378H375" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="369" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">SBA 写入 ELF 的 PT_LOAD</text><path d="M625 435H125" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="375.0" y="426" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">写 DPC = ELF entry；resume</text><path d="M125 493H875" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="484" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">执行应用 _start</text><path d="M875 531h45v20h-45" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="871" y="542" text-anchor="end" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">栈 / gp / BSS / FS → call main</text><path d="M875 609H625" fill="none" stroke="#12836f" stroke-width="2" marker-end="url(#a)"/><text x="750.0" y="600" text-anchor="middle" font-size="14" fill="#126b60" stroke="white" stroke-width="4" paint-order="stroke">main 返回；scratch2 结束码</text><text x="25" y="657" font-size="14" fill="#4b6779">箭头为控制先后 / 操作说明；存储写入和结束码读取实际经过调试、AXI 与 MMIO 路径。</text><text x="25" y="684" font-size="14" fill="#4b6779">教学示意，非真实波形。Flash/GPT 与 serial link 的入口交接见正文，不套用此 JTAG 时序。</text></svg>