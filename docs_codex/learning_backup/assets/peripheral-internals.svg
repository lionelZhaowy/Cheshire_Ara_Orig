<text x="416" y="676" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#236bad">配置</text>
<polyline points="835,690 885,690" fill="none" stroke="#147a72" stroke-width="2.2" marker-end="url(#data)"/>
<text x="836" y="676" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#147a72">字节/位</text>
<text x="45" y="776" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">观察顺序：MMIO handshake → FIFO level / ready → FSM → 引脚协议 → 接收数据 / 错误状态 / IRQ</text>
<text x="30" y="870" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#263e50">蓝：配置/控制   绿：数据事务   橙虚线：中断/异常   紫虚线：时钟/复位   灰：阶段或说明</text></svg>
