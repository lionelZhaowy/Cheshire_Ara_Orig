<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="890" viewBox="0 0 1300 890" role="img" aria-labelledby="title desc"><title id="title">低速外设内部：软件写的是队列和状态，不是瞬时引脚电平</title><desc id="desc">教学示意。带文字的箭头分别表示数据、配置、事件与时钟复位；不是布局图或仿真波形。</desc><defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147a72"/></marker>
<marker id="ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#236bad"/></marker>
<marker id="irq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34a31"/></marker>
<marker id="clock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b55a6"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657887"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#263e50" font-weight="700">低速外设内部：软件写的是队列和状态，不是瞬时引脚电平</text>
<text x="30" y="65" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">教学示意 · 据本地 RTL 整理 · 控制/数据箭头表示请求或事件方向，AXI 响应沿反向返回</text>
<rect x="20" y="90" width="1260" height="200" rx="12" fill="#f5f8fa" stroke="#abbfcc" stroke-dasharray="7 4"/>
<text x="35" y="116" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#263e50" font-weight="700">UART · 所有寄存器偏移见对应章节与离线索引</text>
<rect x="45" y="145" width="370" height="100" rx="8" fill="#fff" stroke="#236bad" stroke-width="2"/>
<text x="57" y="171" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#236bad" font-weight="700">Reg32 → APB</text>
<text x="57" y="195" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">DLAB 地址别名 / LCR</text>
<rect x="465" y="145" width="370" height="100" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="477" y="171" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">TX FIFO → uart_transmitter</text>
<text x="477" y="195" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">分频 / 起始位 / 数据 / 停止位</text>
<rect x="885" y="145" width="370" height="100" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="897" y="171" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">uart_receiver → RX FIFO</text>
<text x="897" y="195" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">采样 / 奇偶/帧错误 / IIR</text>
<polyline points="415,190 465,190" fill="none" stroke="#236bad" stroke-width="2.2" marker-end="url(#ctrl)"/>
<text x="416" y="176" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#236bad">配置</text>
<polyline points="835,190 885,190" fill="none" stroke="#147a72" stroke-width="2.2" marker-end="url(#data)"/>
<text x="836" y="176" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#147a72">字节/位</text>
<text x="45" y="276" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">观察顺序：MMIO handshake → FIFO level / ready → FSM → 引脚协议 → 接收数据 / 错误状态 / IRQ</text>
<rect x="20" y="340" width="1260" height="200" rx="12" fill="#f5f8fa" stroke="#abbfcc" stroke-dasharray="7 4"/>
<text x="35" y="366" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#263e50" font-weight="700">I2C · 所有寄存器偏移见对应章节与离线索引</text>
<rect x="45" y="395" width="370" height="100" rx="8" fill="#fff" stroke="#236bad" stroke-width="2"/>
