<text x="836" y="426" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#147a72">字节/位</text>
<text x="45" y="526" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">观察顺序：MMIO handshake → FIFO level / ready → FSM → 引脚协议 → 接收数据 / 错误状态 / IRQ</text>
<rect x="20" y="590" width="1260" height="200" rx="12" fill="#f5f8fa" stroke="#abbfcc" stroke-dasharray="7 4"/>
<text x="35" y="616" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#263e50" font-weight="700">SPI host · 所有寄存器偏移见对应章节与离线索引</text>
<rect x="45" y="645" width="370" height="100" rx="8" fill="#fff" stroke="#236bad" stroke-width="2"/>
<text x="57" y="671" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#236bad" font-weight="700">CONFIGOPTS / CSID</text>
<text x="57" y="695" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">分频 / CPOL / CPHA / CS 时序</text>
<rect x="465" y="645" width="370" height="100" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="477" y="671" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">命令 FIFO / 控制状态机</text>
<text x="477" y="695" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">direction/speed/LEN/CSAAT</text>
<rect x="885" y="645" width="370" height="100" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="897" y="671" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">TX/RX FIFO + 移位器</text>
<text x="897" y="695" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">SCK / CSB / SD[3:0]</text>
