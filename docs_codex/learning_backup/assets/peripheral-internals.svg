<text x="477" y="421" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">i2c_core / i2c_fsm</text>
<text x="477" y="445" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">SCL/SDA 开漏 / ACK / stretch</text>
