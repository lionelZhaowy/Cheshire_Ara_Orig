<text x="897" y="421" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">RX / ACQ / TX FIFO</text>
<text x="897" y="445" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">host 接收 / target 请求与响应</text>
