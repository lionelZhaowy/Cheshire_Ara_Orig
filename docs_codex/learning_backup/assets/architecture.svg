<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">当前 Cheshire–CVA6–Ara 功能关系</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">当前 Cheshire–CVA6–Ara 功能关系</text><rect x="25" y="75" width="260" height="95" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="155.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">CVA6</text><text x="155.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">标量 / CSR / MMU / L1</text><text x="155.0" y="146" text-anchor="middle" font-size="14" fill="#193e50">复位后取指</text><rect x="365" y="75" width="260" height="95" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="495.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">Ara</text><text x="495.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">向量寄存器 / lanes / VLSU</text><text x="495.0" y="146" text-anchor="middle" font-size="14" fill="#193e50">不独立取指</text><rect x="730" y="75" width="245" height="95" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="852.5" y="100" text-anchor="middle" font-size="16" fill="#193e50">iDMA / Debug</text><text x="852.5" y="123" text-anchor="middle" font-size="14" fill="#193e50">其他 AXI 发起者</text><rect x="235" y="260" width="530" height="58" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="285" text-anchor="middle" font-size="16" fill="#193e50">Cheshire AXI crossbar · 地址路由</text><rect x="40" y="395" width="270" height="70" rx=