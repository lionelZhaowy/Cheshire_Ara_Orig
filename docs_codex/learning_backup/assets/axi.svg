 x="744" y="413" font-size="15" fill="#193e50">—</text><rect x="845" y="384" width="113" height="46" fill="#fff" stroke="#d5e1e8"/><text x="857" y="413" font-size="15" fill="#193e50">—</text><text x="25" y="465" font-size="15" fill="#4b6779">绿色格：本通道完成一次握手。AW 接受不表示写完成；等全部 W 与最后的 B。</text><text x="25" y="495" font-size="15" fill="#4b6779">t1 的 W / R 被回压，发送端保持 VALID、数据与 LAST 到 t2；AW 与 W 独立。</text><text x="25" y="525" font-size="15" fill="#4b6779">读：AR（地址）→ R（数据/响应）；写：AW（地址）+ W（数据）→ B（响应）。</text><text x="25" y="555" font-size="15" fill="#4b6779">教学示意，不是真实仿真波形；两个事务独立，真实返回延迟、ID 与突发长度可不同。</text></svg>