<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img"><title>配置如何改变结构：UART 与 Ara 两个独立维度</title><rect width="1240" height="800" fill="#f5f8fc"/><defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#245fc7"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#16806b"/></marker>
<marker id="irq" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94b29"/></marker>
<marker id="clock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#8251af"/></marker>
</defs><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="40" font-size="25" fill="#20334c">配置如何改变结构：UART 与 Ara 两个独立维度</text>
<text x="32" y="73" font-size="16" fill="#20334c">编号是数组索引；地址是路由规则；中断号又是另一张表。</text>
<rect x="35" y="120" width="550" height="130" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="50" y="149" font-size="18" fill="#245fc7">DefaultCfg：6个发起端</text>
<text x="50" y="176" font-size="15" fill="#20334c">CPU0 / Debug1 / DMA2</text>
<text x="50" y="198" font-size="15" fill="#20334c">Link3 / VGA4 / USB5</text>
<rect x="650" y="120" width="550" height="130" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="665" y="149" font-size="18" fill="#245fc7">Ara=1：7个发起端</text>
<text x="665" y="176" font-size="15" fill="#20334c">CPU0 / Debug1 / Ara2 / DMA3</text>
<text x="665" y="198" font-size="15" fill="#20334c">Link4 / VGA5 / USB6</text>
<polyline points="585,180 638,180" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="35" y="300" width="550" height="165" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="50" y="329" font-size="18" fill="#245fc7">Reg默认索引</text>
<text x="50" y="356" font-size="15" fill="#20334c">err0 / CLINT1 / PLIC2 / regs3</text>
<text x="50" y="378" font-size="15" fill="#20334c">BootROM4 / LLC5 / UART6 / I2C7</text>
<text x="50" y="400" font-size="15" fill="#20334c">UART=0x03002000；I2C=0x03003000</text>
<rect x="650" y="300" width="550" height="165" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="665" y="329" font-size="18" fill="#245fc7">仅关闭UART</text>
<text x="665" y="356" font-size="15" fill="#20334c">UART实例与规则消失，输出/IRQ绑零</text>
<text x="665" y="378" font-size="15" fill="#20334c">I2C索引变为6，地址仍0x03003000</text>
<text x="665" y="400" font-size="15" fill="#20334c">第一层Reg大窗口仍在</text>
<polyline points="585,380 638,380" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="35" y="510" width="1165" height="145" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="50" y="539" font-size="18" fill="#245fc7">两层译码：以UART关闭后的访问为例</text>
<text x="50" y="566" font-size="15" fill="#20334c">0x03002000 → AXI目标Reg桥 → Reg无匹配 → Reg错误目标</text>
<text x="50" y="588" font-size="15" fill="#20334c">0x03003000 → AXI目标Reg桥 → I2C新索引6 → I2C寄存器</text>
<text x="50" y="610" font-size="15" fill="#20334c">Ara加入不改变UART地址；ID位宽：6→7仍加3位，9个来源才加4位</text>
<text x="32" y="695" font-size="16" fill="#20334c">三个生成函数分别维护发起端、AXI目标、Reg目标；多个地址窗口可指向同一目标。</text>
<text x="32" y="778" font-size="14" fill="#20334c">教学示意 · 蓝：数据/请求  绿：控制/响应  橙：中断/错误  紫：时钟/复位 · 未标拍数不代表零延迟</text>
</g></svg>
