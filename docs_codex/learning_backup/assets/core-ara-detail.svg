<text x="367" y="711" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">i_vlsu</text>
<text x="367" y="735" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">addrgen / load unit / store unit；MMU 请求；处理长度、对齐与异常</text>
<text x="367" y="758" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">数据走独立 AXI，经 Cheshire 适配到 xbar / LLC / SPM / DDR</text>
<polyline points="800,635 800,685" fill="none" stroke="#147a72" stroke-width="2.2" marker-end="url(#data)"/>
<text x="808" y="627" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#147a72">向量元素数据</text>
<rect x="45" y="860" width="1265" height="70" rx="8" fill="#fff" stroke="#657887" stroke-width="2"/>
<text x="57" y="886" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#657887" font-weight="700">验证三件事</text>
<text x="57" y="910" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">反汇编确有 vsetvli/vle32/vadd/vse32；运行轨迹确实执行；输出逐元素正确。前两者不能替代第三者，静态图不能提供周期数。</text>
<text x="30" y="960" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#263e50">蓝：配置/控制   绿：数据事务   橙虚线：中断/异常   紫虚线：时钟/复位   灰：阶段或说明</text></svg>
