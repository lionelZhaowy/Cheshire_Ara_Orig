<text x="367" y="556" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#236bad" font-weight="700">ara_sequencer</text>
<text x="367" y="580" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">PE 工作分发 / 依赖管理</text>
<text x="367" y="603" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">指令完成汇聚</text>
