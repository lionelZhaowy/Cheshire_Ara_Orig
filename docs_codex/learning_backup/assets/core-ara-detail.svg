<rect x="660" y="530" width="275" height="105" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="672" y="556" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">gen_lanes[i].i_lane</text>
<text x="672" y="580" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">VRF bank / operand queues</text>
<text x="672" y="603" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#263e50">ALU / MFPU / store operands</text>
<rect x="985" y="530" width="325" height="105" rx="8" fill="#fff" stroke="#147a72" stroke-width="2"/>
<text x="997" y="556" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#147a72" font-weight="700">masku / sldu</text>
