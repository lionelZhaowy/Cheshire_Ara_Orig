<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">CPU / Ara / DMA：共享总线不等于共享缓存</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">CPU / Ara / DMA：共享总线不等于共享缓存</text><rect x="25" y="75" width="275" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="162.5" y="100" text-anchor="middle" font-size="16" fill="#193e50">CPU L1 D-cache</text><text x="162.5" y="123" text-anchor="middle" font-size="14" fill="#193e50">WB 标量 / WT 向量 profile</text><text x="162.5" y="146" text-anchor="middle" font-size="14" fill="#193e50">命中可不去下游</text><rect x="365" y="75" width="275" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="502.5" y="100" text-anchor="middle" font-size="16" fill="#193e50">Ara VLSU</text><text x="502.5" y="123" text-anchor="middle" font-size="14" fill="#193e50">写路径 axi_inval_filter</text><text x="502.5" y="146" text-anchor="middle" font-size="14" fill="#193e50">acc_cons_en 控制失效通知</text><rect x="705" y="75" width="270" height="80" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="840.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">iDMA</text><text x="840.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">独立读写通路</text><text x="840.0" y="146" text-anchor="middle" font-size="14" fill="#193e50">不自动经过 Ara 的 filter</text><rect x="290" y="265" width="420" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="290" text-anchor="middle" font-size="16" fill="#193e50">AXI crossbar → 原子适配器</text><text x="500.0" y="313" text-anchor="middle" font-size="14" fill="#193e50">原子适配器仅观察经过它的事务</text><rect x="290" y="400" width="420" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="425" text-anchor="middle" font-size="16" fill="#193e50">LLC / SPM → 外部存储</text><text x="500.0" y="448" text-anchor="middle" font-size="14" fill="#193e50">cache 可能保留数据与脏行</text><polyline points="160,155 160,300 290,300" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="178" y="235" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">miss / 写事务</text><polyline points="500,155 500,265" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="550" y="220" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">向量访存</text><polyline points="840,155 840,300 710,300" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="840" y="235" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">DMA 事务</text><polyline points="365,110 300,110" fill="none" stroke="#9656b4" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#irq)"/><text x="333" y="96" text-anchor="middle" font-size="13" fill="#9656b4" stroke="white" stroke-width="5" paint-order="stroke">L1 失效</text><polyline points="500,340 500,400" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="577" y="372" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">主存 / SPM 数据</text><path d="M25 511h38" stroke="#136fa1" stroke-width="2" marker-end="url(#data)"/><text x="73" y="516" font-size="13" fill="#506777">数据 / 事务</text><path d="M225 511h38" stroke="#12836f" stroke-width="2" marker-end="url(#control)"/><text x="273" y="516" font-size="13" fill="#506777">控制 / 步骤</text><path d="M440 511h38" stroke="#9656b4" stroke-width="2" marker-end="url(#irq)"/><text x="488" y="516" font-size="13" fill="#506777">中断 / 失效通知</text><text x="25" y="543" font-size="12" fill="#647681">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</text></svg>