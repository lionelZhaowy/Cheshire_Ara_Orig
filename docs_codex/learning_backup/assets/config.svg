<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">配置生效：不存在一个开关替你修改所有层</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">配置生效：不存在一个开关替你修改所有层</text><rect x="25" y="70" width="270" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="160.0" y="95" text-anchor="middle" font-size="16" fill="#193e50">源文件与宏 · RTL 编译</text><text x="160.0" y="118" text-anchor="middle" font-size="14" fill="#193e50">唯一 CVA6 profile / decoder</text><text x="160.0" y="141" text-anchor="middle" font-size="14" fill="#193e50">ARA / NR_LANES / VLEN</text><rect x="365" y="70" width="270" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="95" text-anchor="middle" font-size="16" fill="#193e50">SoC 参数 · RTL 展开</text><text x="500.0" y="118" text-anchor="middle" font-size="14" fill="#193e50">SELCFG → Cfg.Ara / lanes</text><text x="500.0" y="141" text-anchor="middle" font-size="14" fill="#193e50">gen_cva6_cfg → build_config</text><rect x="705" y="70" width="270" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="840.0" y="95" text-anchor="middle" font-size="16" fill="#193e50">生成源与产物</text><text x="840.0" y="118" text-anchor="middle" font-size="14" fill="#193e50">HJSON → RTL + C 头</text><text x="840.0" y="141" text-anchor="middle" font-size="14" fill="#193e50">PLIC / CLINT / DMA 等</text><rect x="25" y="265" width="270" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><