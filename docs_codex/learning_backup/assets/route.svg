<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">学习路线：先解释，再动手，再证明</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">学习路线：先解释，再动手，再证明</text><rect x="30" y="80" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="160.0" y="105" text-anchor="middle" font-size="16" fill="#193e50">01 架构 + 02 基础</text><text x="160.0" y="128" text-anchor="middle" font-size="14" fill="#193e50">能画出 printf / load 的路径</text><rect x="370" y="80" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="105" text-anchor="middle" font-size="16" fill="#193e50">03 配置</text><text x="500.0" y="128" text-anchor="middle" font-size="14" fill="#193e50">分清编译、展开、运行时</text><rect x="710" y="80" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="840.0" y="105" text-anchor="middle" font-size="16" fill="#193e50">04 C → ELF → main</text><text x="840.0" y="128" text-anchor="middle" font-size="14" fill="#193e50">看懂入口、段、栈和退出</text><rect x="710" y="265" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="840.0" y="290" text-anchor="middle" font-size="16" fill="#193e50">05 仿真 + 实验 0—3</text><text x="840.0" y="313" text-anchor="middle" font-size="14" fill="#193e50">Hello / 数组 / ELF 检查</text><rect x="370" y="265" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="500.0" y="290" text-anchor="middle" font-size="16" fill="#193e50">06 访存 + 实验 4—7</text><text x="500.0" y="313" text-anchor="middle" font-size="14" fill="#193e50">MMIO / timer / DMA / RVV</text><rect x="30" y="265" width="260" height="75" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="160.0" y="290" text-anchor="middle" font-size="16" fill="#193e50">07 进阶导读</text><text x="160.0" y="313" text-anchor="middle" font-size="14" fill="#193e50">固定工程 / ASIC / AI 预算</text><polyline points="290,117 370,117" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="330" y="104" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">概念 → 配置</text><polyline points="630,117 710,117" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="670" y="104" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">匹配软件</text><polyline points="840,155 840,265" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="840" y="213" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">编译产物 → 运行</text><polyline points="710,302 630,302" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="670" y="289" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">可重复闭环</text><polyline points="370,302 290,302" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="330" y="289" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">带着证据扩展</text><path d="M25 386h38" stroke="#136fa1" stroke-width="2" marker-end="url(#data)"/><text x="73" y="391" font-size="13" fill="#506777">数据 / 事务</text><path d="M225 386h38" stroke="#12836f" stroke-width="2" marker-end="url(#control)"/><text x="273" y="391" font-size="13" fill="#506777">控制 / 步骤</text><path d="M440 386h38" stroke="#9656b4" stroke-width="2" marker-end="url(#irq)"/><text x="488" y="391" font-size="13" fill="#506777">中断 / 失效通知</text><text x="25" y="418" font-size="12" fill="#647681">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</text></svg>