<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img"><title>Crossbar 2×2：分流与汇聚的组合</title><rect width="1240" height="900" fill="#f5f8fc"/><defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#245fc7"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#16806b"/></marker>
<marker id="irq" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94b29"/></marker>
<marker id="clock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#8251af"/></marker>
</defs><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="40" font-size="25" fill="#20334c">Crossbar 2×2：分流与汇聚的组合</text>
<text x="32" y="73" font-size="16" fill="#20334c">省略cut与逐位通道；B/R沿响应路径回到原输入。</text>
<rect x="25" y="130" width="180" height="125" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="40" y="159" font-size="18" fill="#245fc7">CPU：原ID=1</text>
<text x="40" y="186" font-size="15" fill="#20334c">发起者</text>
<text x="40" y="208" font-size="15" fill="#20334c">接xbar slave端</text>
<rect x="260" y="130" width="270" height="150" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="275" y="159" font-size="18" fill="#245fc7">输入侧 decode + demux</text>
<text x="275" y="186" font-size="15" fill="#20334c">AW/AR分别译码</text>
<text x="275" y="208" font-size="15" fill="#20334c">ID→目标、在途计数</text>
<text x="275" y="230" font-size="15" fill="#20334c">W目标选择</text>
<polyline points="205,192 248,192" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<rect x="25" y="380" width="180" height="125" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="40" y="409" font-size="18" fill="#245fc7">DMA：原ID=1</text>
<text x="40" y="436" font-size="15" fill="#20334c">发起者</text>
<text x="40" y="458" font-size="15" fill="#20334c">接xbar slave端</text>
<rect x="260" y="380" width="270" height="150" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="275" y="409" font-size="18" fill="#245fc7">输入侧 decode + demux</text>
<text x="275" y="436" font-size="15" fill="#20334c">AW/AR分别译码</text>
<text x="275" y="458" font-size="15" fill="#20334c">ID→目标、在途计数</text>
<text x="275" y="480" font-size="15" fill="#20334c">W目标选择</text>
<polyline points="205,442 248,442" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<rect x="750" y="130" width="265" height="150" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="765" y="159" font-size="18" fill="#245fc7">目标侧 mux</text>
<text x="765" y="186" font-size="15" fill="#20334c">AW/AR仲裁 + ID前缀</text>
<text x="765" y="208" font-size="15" fill="#20334c">W来源FIFO</text>
<text x="765" y="230" font-size="15" fill="#20334c">B/R按来源返回</text>
<rect x="1060" y="130" width="155" height="125" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="1075" y="159" font-size="18" fill="#245fc7">Reg桥</text>
<text x="1075" y="186" font-size="15" fill="#20334c">目标</text>
<text x="1075" y="208" font-size="15" fill="#20334c">接xbar master端</text>
<polyline points="1015,192 1048,192" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<rect x="750" y="380" width="265" height="150" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="765" y="409" font-size="18" fill="#245fc7">目标侧 mux</text>
<text x="765" y="436" font-size="15" fill="#20334c">AW/AR仲裁 + ID前缀</text>
<text x="765" y="458" font-size="15" fill="#20334c">W来源FIFO</text>
<text x="765" y="480" font-size="15" fill="#20334c">B/R按来源返回</text>
<rect x="1060" y="380" width="155" height="125" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="1075" y="409" font-size="18" fill="#245fc7">主存</text>
<text x="1075" y="436" font-size="15" fill="#20334c">目标</text>
<text x="1075" y="458" font-size="15" fill="#20334c">接xbar master端</text>
<polyline points="1015,442 1048,442" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<polyline points="530,205 738,205" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<polyline points="530,205 738,455" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<polyline points="530,455 738,205" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<polyline points="530,455 738,455" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<rect x="543" y="293" width="180" height="29" rx="4" fill="#f5f8fc"/>
<text x="548" y="315" font-size="15" fill="#20334c">Connectivity[i][j]</text>
<polyline points="1135,505 1135,570 130,570 130,510" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<text x="430" y="551" font-size="14" fill="#16806b">示例B/R：主存返回 → 来源识别/去前缀 → DMA</text>
<rect x="260" y="615" width="550" height="130" rx="10" fill="white" stroke="#b94b29" stroke-width="2"/>
<text x="275" y="644" font-size="18" fill="#b94b29">错误路径与顺序约束：两种机制</text>
<text x="275" y="671" font-size="15" fill="#20334c">未映射 / 禁止连接 → axi_err_slv → DECERR</text>
<text x="275" y="693" font-size="15" fill="#20334c">同输入、同ID、同方向跨目标：等待旧事务完成</text>
<polyline points="390,530 390,600" fill="none" stroke="#b94b29" stroke-width="2.5" marker-end="url(#irq)"/>
<text x="32" y="795" font-size="16" fill="#20334c">不同目标可并行；相同目标需仲裁。来源编号用于区分不同master的同名ID。</text>
<text x="32" y="819" font-size="16" fill="#20334c">当前SoC：Connectivity=全1，默认目标关闭，CUT_ALL_PORTS，内部PipelineStages=0。</text>
<text x="32" y="878" font-size="14" fill="#20334c">教学示意 · 蓝：数据/请求  绿：控制/响应  橙：中断/错误  紫：时钟/复位 · 未标拍数不代表零延迟</text>
</g></svg>
