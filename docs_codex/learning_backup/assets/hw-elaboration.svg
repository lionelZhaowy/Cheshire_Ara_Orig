<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img"><title>源码、配置与生成物如何汇入硬件展开</title><rect width="1240" height="800" fill="#f5f8fc"/><defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#245fc7"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#16806b"/></marker>
<marker id="irq" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94b29"/></marker>
<marker id="clock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#8251af"/></marker>
</defs><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="40" font-size="25" fill="#20334c">源码、配置与生成物如何汇入硬件展开</text>
<text x="32" y="73" font-size="16" fill="#20334c">输入汇合，不是运行时执行链；软件不能新增已被删去的硬件。</text>
<rect x="30" y="125" width="330" height="130" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="45" y="154" font-size="18" fill="#16806b">CPU profile</text>
<text x="45" y="181" font-size="15" fill="#20334c">唯一cva6_config_pkg</text>
<text x="45" y="203" font-size="15" fill="#20334c">RVV / cache / MMU / FPU</text>
<rect x="450" y="125" width="330" height="130" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="465" y="154" font-size="18" fill="#16806b">SoC Cfg</text>
<text x="465" y="181" font-size="15" fill="#20334c">DefaultCfg + TB/wrapper覆盖</text>
<text x="465" y="203" font-size="15" fill="#20334c">总线 / 外设 / LLC / Ara</text>
<rect x="870" y="125" width="330" height="130" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="885" y="154" font-size="18" fill="#16806b">生成包与清单</text>
<text x="885" y="181" font-size="15" fill="#20334c">PLIC / CLINT / 寄存器尺寸</text>
<text x="885" y="203" font-size="15" fill="#20334c">宏、类型与依赖实现</text>
<rect x="220" y="350" width="450" height="140" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="235" y="379" font-size="18" fill="#16806b">合并与派生</text>
<text x="235" y="406" font-size="15" fill="#20334c">gen_cva6_cfg → build_config</text>
<text x="235" y="428" font-size="15" fill="#20334c">gen_axi_in/out / gen_reg_out</text>
<text x="235" y="450" font-size="15" fill="#20334c">类型宽度与地址规则</text>
<polyline points="195,255 195,310 325,310 325,338" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<polyline points="615,255 615,338" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="830" y="350" width="370" height="140" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="845" y="379" font-size="18" fill="#245fc7">编译 + 展开</text>
<text x="845" y="406" font-size="15" fill="#20334c">解析定义、计算常量</text>
<text x="845" y="428" font-size="15" fill="#20334c">展开generate，建立实例与连接</text>
<polyline points="670,415 818,415" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<text x="695" y="396" font-size="14" fill="#16806b">配置/类型</text>
<polyline points="1035,255 1035,338" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="830" y="560" width="370" height="115" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="845" y="589" font-size="18" fill="#245fc7">综合与工艺映射</text>
<text x="845" y="616" font-size="15" fill="#20334c">优化与单元映射</text>
<text x="845" y="638" font-size="15" fill="#20334c">实际面积/时序需报告</text>
<rect x="220" y="560" width="450" height="115" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="235" y="589" font-size="18" fill="#245fc7">仿真与运行时操作</text>
<text x="235" y="616" font-size="15" fill="#20334c">CSR / MMIO改变已存在电路的状态</text>
<text x="235" y="638" font-size="15" fill="#20334c">动态观测不同于配置推导</text>
<polyline points="945,490 945,548" fill="none" stroke="#245fc7" stroke-width="2.5" marker-end="url(#data)"/>
<polyline points="830,460 740,460 740,610 682,610" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<text x="32" y="695" font-size="16" fill="#20334c">需分别保留源码清单、有效配置、展开层级与动态结果；仿真层级不等于综合后网表。</text>
<text x="32" y="778" font-size="14" fill="#20334c">教学示意 · 蓝：数据/请求  绿：控制/响应  橙：中断/错误  紫：时钟/复位 · 未标拍数不代表零延迟</text>
</g></svg>
