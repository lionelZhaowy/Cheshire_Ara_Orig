<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img"><title>硬件学习路线：从预测结构到验证行为</title><rect width="1240" height="800" fill="#f5f8fc"/><defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#245fc7"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#16806b"/></marker>
<marker id="irq" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94b29"/></marker>
<marker id="clock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#8251af"/></marker>
</defs><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="32" y="40" font-size="25" fill="#20334c">硬件学习路线：从预测结构到验证行为</text>
<text x="32" y="73" font-size="16" fill="#20334c">CVA6了解接口；互连与适配读到事务状态，不要求逐级研究CPU流水线。</text>
<rect x="35" y="135" width="350" height="160" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="50" y="164" font-size="18" fill="#16806b">H01 参数化RTL</text>
<text x="50" y="191" font-size="15" fill="#20334c">profile / 宏 / 生成文件</text>
<text x="50" y="213" font-size="15" fill="#20334c">展开不等于综合映射</text>
<polyline points="385,215 434,215" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="445" y="135" width="350" height="160" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="460" y="164" font-size="18" fill="#16806b">H02 CVA6功能配置</text>
<text x="460" y="191" font-size="15" fill="#20334c">cache / MMU / FPU / acc</text>
<text x="460" y="213" font-size="15" fill="#20334c">原值→覆盖→派生→消费者</text>
<polyline points="795,215 844,215" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="855" y="135" width="350" height="160" rx="10" fill="white" stroke="#16806b" stroke-width="2"/>
<text x="870" y="164" font-size="18" fill="#16806b">H03 SoC结构生成</text>
<text x="870" y="191" font-size="15" fill="#20334c">master / target / address rule</text>
<text x="870" y="213" font-size="15" fill="#20334c">关闭UART、开启Ara、旁路LLC</text>
<rect x="35" y="380" width="350" height="160" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="50" y="409" font-size="18" fill="#245fc7">H04–H05 互连与适配</text>
<text x="50" y="436" font-size="15" fill="#20334c">decode / demux / mux / ID</text>
<text x="50" y="458" font-size="15" fill="#20334c">lane / bridge / cut / CDC</text>
<polyline points="385,460 434,460" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="445" y="380" width="350" height="160" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="460" y="409" font-size="18" fill="#245fc7">H06–H08 系统原理</text>
<text x="460" y="436" font-size="15" fill="#20334c">存储 / DMA / 外设 / IRQ</text>
<text x="460" y="458" font-size="15" fill="#20334c">时钟 / 复位 / 平台契约</text>
<polyline points="795,460 844,460" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<rect x="855" y="380" width="350" height="160" rx="10" fill="white" stroke="#245fc7" stroke-width="2"/>
<text x="870" y="409" font-size="18" fill="#245fc7">H09 + 实验：接入IP</text>
<text x="870" y="436" font-size="15" fill="#20334c">Reg控制→IRQ→AXI数据口</text>
<text x="870" y="458" font-size="15" fill="#20334c">静态 / 教学模型 / 单元 / SoC</text>
<polyline points="1150,295 1150,335 15,335 15,460 35,460" fill="none" stroke="#16806b" stroke-width="2.5" marker-end="url(#control)"/>
<text x="600" y="322" font-size="14" fill="#16806b">继续推导</text>
<text x="32" y="695" font-size="16" fill="#20334c">阅读产物：一张配置追踪表、一条事务路径、一份修改影响清单和一组正常/注错验收。</text>
<text x="32" y="719" font-size="16" fill="#20334c">沿途可返回既有寄存器和软件章节；不将配置字典重复抄为正文。</text>
<text x="32" y="778" font-size="14" fill="#20334c">教学示意 · 蓝：数据/请求  绿：控制/响应  橙：中断/错误  紫：时钟/复位 · 未标拍数不代表零延迟</text>
</g></svg>
