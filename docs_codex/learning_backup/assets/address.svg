<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">地址空间与 LLC/SPM：地址窗口 ≠ 物理容量</title><desc id="desc">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</desc><defs><marker id="data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#136fa1"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#12836f"/></marker><marker id="irq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9656b4"/></marker></defs><rect width="1000" height="100%" fill="#fff"/><text x="25" y="32" font-size="21" font-weight="700" fill="#173749">地址空间与 LLC/SPM：地址窗口 ≠ 物理容量</text><rect x="25" y="75" width="360" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="205.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">0x02000000 / 0x03002000</text><text x="205.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">Boot ROM / UART MMIO</text><text x="205.0" y="146" text-anchor="middle" font-size="14" fill="#193e50">寄存器路径，不是 DDR</text><rect x="25" y="205" width="360" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="205.0" y="230" text-anchor="middle" font-size="16" fill="#193e50">0x10000000—0x1001ffff</text><text x="205.0" y="253" text-anchor="middle" font-size="14" fill="#193e50">默认 128 KiB SPM 可缓存窗口</text><text x="205.0" y="276" text-anchor="middle" font-size="14" fill="#193e50">链接脚本默认仅用低 64 KiB</text><rect x="25" y="335" width="360" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="205.0" y="360" text-anchor="middle" font-size="16" fill="#193e50">0x14000000—0x1401ffff</text><text x="205.0" y="383" text-anchor="middle" font-size="14" fill="#193e50">同一 SPM 的非缓存别名</text><text x="205.0" y="406" text-anchor="middle" font-size="14" fill="#193e50">不是新增 128 KiB</text><rect x="625" y="205" width="340" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="795.0" y="230" text-anchor="middle" font-size="16" fill="#193e50">LLC 的同一组 SRAM 阵列</text><text x="795.0" y="253" text-anchor="middle" font-size="14" fill="#193e50">8 ways × 256 × 8 × 8 B</text><text x="795.0" y="276" text-anchor="middle" font-size="14" fill="#193e50">Boot ROM 初始化为全 SPM</text><rect x="625" y="75" width="340" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="795.0" y="100" text-anchor="middle" font-size="16" fill="#193e50">0x80000000—0xffffffff</text><text x="795.0" y="123" text-anchor="middle" font-size="14" fill="#193e50">外部主存路由窗口（2 GiB）</text><text x="795.0" y="146" text-anchor="middle" font-size="14" fill="#193e50">dram.ld 仅声明 8 MiB</text><rect x="625" y="335" width="340" height="85" rx="8" fill="#eef5f7" stroke="#b5ccd7"/><text x="795.0" y="360" text-anchor="middle" font-size="16" fill="#193e50">运行时可重配 LLC ways</text><text x="795.0" y="383" text-anchor="middle" font-size="14" fill="#193e50">cache / SPM / 混合</text><text x="795.0" y="406" text-anchor="middle" font-size="14" fill="#193e50">须迁走栈与活数据再重配</text><polyline points="385,248 625,248" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="505" y="235" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">地址译码 → SPM</text><polyline points="385,378 510,378 510,275 625,275" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="512" y="335" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">减 0x04000000 映射</text><polyline points="790,160 790,205" fill="none" stroke="#136fa1" stroke-width="2.2" marker-end="url(#data)"/><text x="790" y="183" text-anchor="middle" font-size="13" fill="#136fa1" stroke="white" stroke-width="5" paint-order="stroke">主存访问经 LLC 路径</text><polyline points="790,335 790,290" fill="none" stroke="#12836f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#control)"/><text x="790" y="322" text-anchor="middle" font-size="13" fill="#12836f" stroke="white" stroke-width="5" paint-order="stroke">配置 way 用途</text><path d="M25 466h38" stroke="#136fa1" stroke-width="2" marker-end="url(#data)"/><text x="73" y="471" font-size="13" fill="#506777">数据 / 事务</text><path d="M225 466h38" stroke="#12836f" stroke-width="2" marker-end="url(#control)"/><text x="273" y="471" font-size="13" fill="#506777">控制 / 步骤</text><path d="M440 466h38" stroke="#9656b4" stroke-width="2" marker-end="url(#irq)"/><text x="488" y="471" font-size="13" fill="#506777">中断 / 失效通知</text><text x="25" y="498" font-size="12" fill="#647681">教学示意 · 省略部分适配器、流水寄存器与响应通道；不代表逐周期行为</text></svg>